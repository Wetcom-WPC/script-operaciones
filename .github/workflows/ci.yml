name: Verificaciones de Apps Script

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxis de los .js (node --check)
        run: |
          set -e
          ERRORES=0
          while IFS= read -r -d '' ARCHIVO; do
            if ! node --check "$ARCHIVO"; then
              echo "::error file=${ARCHIVO}::Error de sintaxis"
              ERRORES=$((ERRORES + 1))
            fi
          done < <(git ls-files -z '*.js')
          if [ "$ERRORES" -gt 0 ]; then
            echo "Se encontraron ${ERRORES} archivo(s) con errores de sintaxis."
            exit 1
          fi

      - name: Declaraciones duplicadas en el scope global (ver AGENTS.md §4)
        run: |
          # Se enumera con `git ls-files` y no con `grep -r .`: esa forma recorre todo lo que
          # cuelgue del directorio, incluidas copias del propio repo que no se despliegan (un
          # worktree de git ignorado, por ejemplo), y cada copia hace que toda declaración
          # aparezca "duplicada" contra sí misma. Mismo criterio que deploy.sh.
          DUPLICADOS=$(git ls-files -z '*.js' | xargs -0 grep -hoE "^(const|let|class) +[A-Za-z0-9_]+" | sort | uniq -d || true)
          if [ -n "$DUPLICADOS" ]; then
            echo "Declaraciones duplicadas en el scope global (rompen el proyecto ENTERO en Apps Script):"
            echo "$DUPLICADOS"
            exit 1
          fi
