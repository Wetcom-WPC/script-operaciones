  function renderPaginatedTable(tickets, tbodyId, paginacionId, pagina, itemsPorPagina) {
    var tbody = document.getElementById(tbodyId);
    var paginacion = document.getElementById(paginacionId);
    vaciar(tbody);
    vaciar(paginacion);

    var totalPaginas = Math.ceil(tickets.length / itemsPorPagina);
    if (totalPaginas === 0) totalPaginas = 1;
    if (pagina > totalPaginas) pagina = totalPaginas;

    var inicio = (pagina - 1) * itemsPorPagina;
    var fin = inicio + itemsPorPagina;
    var itemsPagina = tickets.slice(inicio, fin);

    itemsPagina.forEach(function(t) {
      var colorClase = 'blue-gray';
      if (t.statusCategory === 'yellow') colorClase = 'yellow';
      else if (t.statusCategory === 'green') colorClase = 'green';
      
      var badgeHtml = '<span class="badge-jira ' + colorClase + '">' + t.status + '</span>';
      
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><a href="https://wetcom.atlassian.net/browse/' + t.key + '" target="_blank" style="color:#2563eb;">' + t.key + '</a></td><td>' + t.summary + '</td><td>' + badgeHtml + '</td><td>' + new Date(t.created).toLocaleDateString() + '</td>';
      tbody.appendChild(tr);
    });

    if (totalPaginas > 1) {
      var createBtn = function(texto, pageNum, isActive, isDisabled) {
        var btn = document.createElement('button');
        btn.innerHTML = texto;
        btn.style.padding = '4px 8px';
        btn.style.border = '1px solid #d1d5db';
        btn.style.background = isActive ? '#109E58' : (isDisabled ? '#f3f4f6' : 'white');
        btn.style.color = isActive ? 'white' : (isDisabled ? '#9ca3af' : '#374151');
        btn.style.borderRadius = '4px';
        btn.style.cursor = isDisabled ? 'default' : 'pointer';
        if (!isDisabled && !isActive) {
          btn.addEventListener('click', function() {
            renderPaginatedTable(tickets, tbodyId, paginacionId, pageNum, itemsPorPagina);
          });
        }
        paginacion.appendChild(btn);
      };

      createBtn('&laquo;', pagina - 1, false, pagina === 1);
      
      var pages = [];
      for (var i = 1; i <= totalPaginas; i++) {
        if (i === 1 || i === totalPaginas || (i >= pagina - 1 && i <= pagina + 1)) {
          pages.push(i);
        }
      }
      
      var lastP = 0;
      pages.forEach(function(p) {
        if (lastP + 1 < p) {
          var span = document.createElement('span');
          span.innerHTML = '&hellip;';
          span.style.padding = '4px 4px';
          span.style.color = '#6b7280';
          paginacion.appendChild(span);
        }
        createBtn(p, p, p === pagina, false);
        lastP = p;
      });

      createBtn('&raquo;', pagina + 1, false, pagina === totalPaginas);
    }
  }

  function pintarMetricasIndice(datos) {
    if (!datos) return;
    var elReloj = document.getElementById('relojProximoEnvio');
    var elBadge = document.getElementById('badgeEstadoVentana');
    var elCantMarcadas = document.getElementById('cantCasillasMarcadas');
    var elCantTotal = document.getElementById('cantClientesTotal');
    var elMailsHoy = document.getElementById('cantMailsEnviadosHoy');

    if (elCantMarcadas) elCantMarcadas.textContent = datos.casillasMarcadas || 0;
    if (elCantTotal) elCantTotal.textContent = datos.totalClientes || 0;

    // Actualizar cantidad de mails de hoy desde logs si están cargados
    if (elMailsHoy && logsGlobales && logsGlobales.envioMails) {
      elMailsHoy.textContent = logsGlobales.envioMails.length;
    }

    if (datos.proximoEnvio) {
      if (elReloj) elReloj.textContent = datos.proximoEnvio.proximaEjecucion || '--:--';
      if (elBadge) {
        if (datos.proximoEnvio.enVentana) {
          elBadge.textContent = 'En Ventana (08-11 hs)';
          elBadge.className = 'pildora alerta';
        } else if (datos.proximoEnvio.finDeSemana) {
          elBadge.textContent = 'Fin de Semana';
          elBadge.className = 'pildora';
        } else {
          elBadge.textContent = 'Fuera de Horario';
          elBadge.className = 'pildora';
        }
      }
    }

    // Llenar selector de PODs si aún no se llenó
    var selectPod = document.getElementById('filtroPodIndice');
    if (selectPod && selectPod.options.length <= 1 && datos.clientes) {
      var podsUnicos = {};
      datos.clientes.forEach(function (c) {
        if (c.pod && c.pod !== '-') podsUnicos[c.pod] = true;
      });
      Object.keys(podsUnicos).sort().forEach(function (pod) {
        var opt = document.createElement('option');
        opt.value = pod;
        opt.textContent = pod;
        selectPod.appendChild(opt);
      });
    }
  }

  function renderizarTablaIndice() {
    var tbody = document.getElementById('tbodyIndiceControl');
    var aviso = document.getElementById('avisoIndice');
    var elCantFilas = document.getElementById('cantFilasMostradas');
    if (!tbody) return;
    vaciar(tbody);

    if (!datosIndiceGlobal || !datosIndiceGlobal.clientes || datosIndiceGlobal.clientes.length === 0) {
      var trVacio = document.createElement('tr');
      trVacio.innerHTML = '<td colspan="8" style="padding: 28px; text-align: center; color: var(--gris);">No se encontraron clientes configurados en el Índice.</td>';
      tbody.appendChild(trVacio);
      return;
    }

    var filtroBuscar = (document.getElementById('filtroBuscarIndice') ? document.getElementById('filtroBuscarIndice').value : '').trim().toLowerCase();
    var filtroPod = (document.getElementById('filtroPodIndice') ? document.getElementById('filtroPodIndice').value : '').trim();
    var filtroEstado = (document.getElementById('filtroEstadoCasillaIndice') ? document.getElementById('filtroEstadoCasillaIndice').value : '').trim();

    var filtrados = datosIndiceGlobal.clientes.filter(function (c) {
      if (filtroPod && c.pod !== filtroPod) return false;

      var tieneAlgunaMarcada = (
        (c.tecnologias.vsphere && c.tecnologias.vsphere.checked) ||
        (c.tecnologias.veeam && c.tecnologias.veeam.checked) ||
        (c.tecnologias.nutanix && c.tecnologias.nutanix.checked) ||
        (c.tecnologias.rvtools && c.tecnologias.rvtools.checked)
      );

      if (filtroEstado === 'con_pendientes' && !tieneAlgunaMarcada) return false;
      if (filtroEstado === 'sin_pendientes' && tieneAlgunaMarcada) return false;

      if (filtroBuscar) {
        var textoUnificado = (c.nombre + ' ' + c.empresa + ' ' + c.pod + ' ' + c.servicios).toLowerCase();
        if (textoUnificado.indexOf(filtroBuscar) === -1) return false;
      }
      return true;
    });

    // Ordenar PRIMERO por POD y luego alfabéticamente por cliente
    filtrados.sort(function (a, b) {
      var podA = (a.pod || '').toUpperCase();
      var podB = (b.pod || '').toUpperCase();
      if (podA !== podB) {
        if (podA === '-') return 1;
        if (podB === '-') return -1;
        return podA.localeCompare(podB);
      }
      return a.nombre.localeCompare(b.nombre);
    });

    if (elCantFilas) {
      elCantFilas.textContent = filtrados.length + ' de ' + datosIndiceGlobal.clientes.length + ' clientes mostrados';
    }

    if (filtrados.length === 0) {
      var trSinResultados = document.createElement('tr');
      trSinResultados.innerHTML = '<td colspan="8" style="padding: 24px; text-align: center; color: var(--gris);">No hay clientes que coincidan con los filtros aplicados.</td>';
      tbody.appendChild(trSinResultados);
      return;
    }

    filtrados.forEach(function (c) {
      var tieneAlgunaMarcada = (
        (c.tecnologias.vsphere && c.tecnologias.vsphere.checked) ||
        (c.tecnologias.veeam && c.tecnologias.veeam.checked) ||
        (c.tecnologias.nutanix && c.tecnologias.nutanix.checked) ||
        (c.tecnologias.rvtools && c.tecnologias.rvtools.checked)
      );

      var tr = document.createElement('tr');
      if (tieneAlgunaMarcada) tr.className = 'fila-con-envio-pendiente';

      // 1. Columna Fila
      var tdFila = document.createElement('td');
      tdFila.style.color = 'var(--gris-claro)';
      tdFila.style.fontWeight = '600';
      tdFila.textContent = '#' + c.fila;
      tr.appendChild(tdFila);

      // 2. Columna Cliente
      var tdCliente = document.createElement('td');
      var divCli = document.createElement('div');
      divCli.style.fontWeight = '600';
      divCli.style.color = 'var(--tinta)';
      divCli.textContent = c.nombre;
      var divSub = document.createElement('div');
      divSub.style.fontSize = '11px';
      divSub.style.color = 'var(--gris)';
      divSub.textContent = (c.opsKey ? 'Ops: ' + c.opsKey : '') + (c.soporteKey ? ' | Sop: ' + c.soporteKey : '');
      tdCliente.appendChild(divCli);
      if (c.opsKey || c.soporteKey) tdCliente.appendChild(divSub);

  // Los textos son relativos ("hace 12 minutos"): sin esto, una pestaña abierta toda la mañana

  //
  // Además se vuelven a pedir los datos al servidor, para no depender de que alguien apriete
  // "Actualizar" cada vez que quiere saber si salió un mail. 60s es el intervalo correcto:
  // el caché del Índice dura 45s, así que cada vuelta trae datos frescos sin pedir de más.
  //
  // El guard de document.hidden no es un detalle: sin él, una pestaña que quedó abierta el
  // viernes sigue llamando al servidor todo el fin de semana. Cada llamada es una ejecución
  // de Apps Script, y esa cuota es la MISMA que necesitan las operaciones — quemarla mirando
  // un dashboard que nadie tiene delante sería pagar dos veces por nada.
  setInterval(function () {
    pintarUltimoLanzamiento();
    pintarContextoBandeja();
    // Actualizar reloj y estado de envío si el panel está abierto

    if (document.hidden) return;

    // Silencioso: sin spinner ni "Consultando...", para que la pantalla no parpadee cada

  function webapp_calcularProximoEnvioLocal() {
    var ahora = new Date();
    var horaActual = ahora.getHours();
    var minutosActual = ahora.getMinutes();
    var diaSemana = ahora.getDay();
    var finDeSemana = (diaSemana === 0 || diaSemana === 6);
    var dentroDeVentana = (horaActual >= 8 && horaActual < 11);

    var proxMin = Math.ceil((minutosActual + 1) / 5) * 5;
    var horaProx = horaActual;
    var minProx = proxMin;
    if (minProx >= 60) { horaProx += 1; minProx = 0; }

    var proximoTexto = '';
    var estadoVentana = '';
    if (finDeSemana) {
      estadoVentana = 'FIN_DE_SEMANA';
      proximoTexto = 'Próximo Lunes 08:00 hs';
    } else if (horaActual < 8) {
      estadoVentana = 'ANTES_DE_VENTANA';
      proximoTexto = 'Hoy 08:00 hs';
    } else if (dentroDeVentana) {
      estadoVentana = 'EN_VENTANA';
      var horaFormato = (horaProx < 10 ? '0' : '') + horaProx + ':' + (minProx < 10 ? '0' : '') + minProx + ' hs';
      var minutosFaltan = ((horaProx * 60 + minProx) - (horaActual * 60 + minutosActual));
      proximoTexto = horaFormato + ' (en ~' + minutosFaltan + ' min)';
    } else {
      estadoVentana = 'FINALIZADA_HOY';
      proximoTexto = 'Mañana 08:00 hs';
    }

    return {
      estado: estadoVentana,
      proximaEjecucion: proximoTexto,
      enVentana: dentroDeVentana,
      finDeSemana: finDeSemana
    };
  }

  // =================================================================
  // LLEGADA DE REPORTES
  // A qué hora llega lo que mandan los vRO / vROps / Veeam ONE de los clientes.
  // =================================================================

  var llegadasGlobal = null;
  var llegadasTabActiva = 'datos';

  var COLORES_ORIGEN = { 'vRO': '#2E86C1', 'vROps': '#7D3C98', 'Veeam ONE': '#1E8449', 'Otro': '#8A9891' };
  var NOMBRE_DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

  function minutosAHora(min) {
    var t = Math.round(min);
    var h = Math.floor(t / 60);
    var m = t % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function hoyISO() {
    var d = new Date();
    var m = d.getMonth() + 1, dd = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
  }

  function leerFiltrosLlegadas() {
    var v = function(id) { var el = document.getElementById(id); return el ? el.value : ''; };
    var periodo = v('filtroDiasLlegadas');

    // "dias" es cuánto se le pide al servidor; "desde/hasta" recorta del lado del navegador.
    // Para un rango con fecha de inicio vieja hay que pedir hasta ahí, si no faltarían datos.
    var dias = 30, desde = '', hasta = '';
    if (periodo === 'hoy') {
      dias = 1; desde = hoyISO(); hasta = hoyISO();
    } else if (periodo === 'rango') {
      desde = v('desdeLlegadas');
      hasta = v('hastaLlegadas');
      if (desde) {
        var atras = Math.ceil((Date.now() - new Date(desde + 'T00:00:00').getTime()) / 86400000);
        dias = Math.min(Math.max(atras + 1, 1), 180);
      } else {
        dias = 90;   // sin fecha de inicio todavía, se trae un período amplio
      }
    } else {
      dias = parseInt(periodo, 10) || 30;
    }

    return {
      dias: dias,
      desde: desde,
      hasta: hasta,
      cliente: v('filtroClienteLlegadas'),
      pod: v('filtroPodLlegadas'),
      reporte: v('filtroReporteLlegadas'),
      origen: v('filtroOrigenLlegadas'),
      diaSemana: v('filtroDiaSemanaLlegadas'),
      soloTarde: !!(document.getElementById('filtroSoloTardeLlegadas') || {}).checked
    };
  }

  function filtrarLlegadas(f) {
    if (!llegadasGlobal) return [];
    return (llegadasGlobal.llegadas || []).filter(function(l) {
      if (f.desde && l.fecha < f.desde) return false;
      if (f.hasta && l.fecha > f.hasta) return false;
      if (f.cliente && l.cliente !== f.cliente) return false;
      if (f.pod && l.pod !== f.pod) return false;
      if (f.reporte && l.reporte !== f.reporte) return false;
      if (f.origen && l.origen !== f.origen) return false;
      if (f.diaSemana && String(l.diaSemana) !== f.diaSemana) return false;
      if (f.soloTarde && !l.tarde) return false;
      return true;
    });
  }

  // Los faltantes vienen de otra fuente (la auditoría diaria), así que solo se pueden filtrar
  // por lo que esa fuente conoce: cliente y reporte.
  function filtrarFaltantes(f) {
    if (!llegadasGlobal) return [];
    return (llegadasGlobal.faltantes || []).filter(function(x) {
      if (f.desde && x.fecha < f.desde) return false;
      if (f.hasta && x.fecha > f.hasta) return false;
      if (f.cliente && x.cliente.indexOf(f.cliente) === -1) return false;
      if (f.reporte && x.reporte !== f.reporte) return false;
      return true;
    });
  }

  /** Una fila por casilla remitente + reporte: es la unidad en la que algo se rompe. */
  function agruparLlegadas(llegadas) {
    var porClave = {};
    llegadas.forEach(function(l) {
      var clave = l.remitente + '|' + l.reporte;
      if (!porClave[clave]) {
        porClave[clave] = {
          clave: clave, remitente: l.remitente, cliente: l.cliente, pod: l.pod,
          reporte: l.reporte, origen: l.origen,
          minutos: [], dias: {}, tarde: 0, ultima: ''
        };
      }
      var g = porClave[clave];
      // Si un reporte llega dos veces el mismo día vale el PRIMERO: es cuando el cliente
      // cumplió. Un reenvío posterior no lo vuelve tardío.
      if (g.dias[l.fecha] === undefined || l.minutos < g.dias[l.fecha]) g.dias[l.fecha] = l.minutos;
      if (l.fecha > g.ultima) g.ultima = l.fecha;
    });
    return Object.keys(porClave).map(function(k) {
      var g = porClave[k];
      var valores = Object.keys(g.dias).map(function(d) { return g.dias[d]; });
      g.minutos = valores;
      g.promedio = valores.reduce(function(a, b) { return a + b; }, 0) / valores.length;
      g.tarde = valores.filter(function(m) { return m > llegadasGlobal.limiteMinutos; }).length;
      g.total = valores.length;
      return g;
    });
  }

  /** Promedio por día, para el gráfico. Una línea por lo que se haya elegido agrupar. */
  function serieLlegadas(llegadas, agrupacion) {
    var porDia = {};
    var lineas = {};
    llegadas.forEach(function(l) {
      var linea = agrupacion === 'cliente' ? l.cliente : (agrupacion === 'reporte' ? l.reporte : l.origen);
      lineas[linea] = true;
      if (!porDia[l.fecha]) porDia[l.fecha] = {};
      if (!porDia[l.fecha][linea]) porDia[l.fecha][linea] = [];
      porDia[l.fecha][linea].push(l.minutos);
    });
    // Con una línea por cliente o por reporte pueden salir 30 y el gráfico se vuelve ilegible:
    // se muestran las que más datos tienen y el resto queda en la tabla de abajo.
    var nombres = Object.keys(lineas);
    if (nombres.length > 8) {
      var peso = {};
      llegadas.forEach(function(l) {
        var k = agrupacion === 'cliente' ? l.cliente : (agrupacion === 'reporte' ? l.reporte : l.origen);
        peso[k] = (peso[k] || 0) + 1;
      });
      nombres = nombres.sort(function(a, b) { return peso[b] - peso[a]; }).slice(0, 8);
    }
    var puntos = Object.keys(porDia).sort().map(function(d) {
      var prom = {};
      nombres.forEach(function(n) {
        var vs = porDia[d][n];
        if (vs && vs.length) prom[n] = vs.reduce(function(a, b) { return a + b; }, 0) / vs.length;
      });
      return { etiqueta: d.substring(8) + '/' + d.substring(5, 7), prom: prom };
    });
    return { lineas: nombres, puntos: puntos, recortado: Object.keys(lineas).length > nombres.length };
  }

  function dibujarChartLlegadas(serie) {
    var div = document.getElementById('chart_llegadas_div');
    if (!div) return;
    if (typeof google === 'undefined' || !google.visualization || !google.visualization.LineChart) {
      div.textContent = 'No se pudo cargar la librería de gráficos.';
      return;
    }
    if (!serie.puntos.length) { div.innerHTML = ''; return; }

    var aHoraDelDia = function(min) {
      var t = Math.round(min);
      return [Math.floor(t / 60), t % 60, 0];
    };
    var dt = new google.visualization.DataTable();
    dt.addColumn('string', 'Día');
    serie.lineas.forEach(function(n) { dt.addColumn('timeofday', n); });
    dt.addColumn('timeofday', 'Límite 08:30');
    serie.puntos.forEach(function(p) {
      // Un día sin llegada queda vacío (null), no en cero: un cero sería "llegó a las 00:00"
      // y arrastraría la línea hasta abajo.
      var fila = [p.etiqueta];
      serie.lineas.forEach(function(n) { fila.push(p.prom[n] !== undefined ? aHoraDelDia(p.prom[n]) : null); });
      fila.push(aHoraDelDia(llegadasGlobal.limiteMinutos));
      dt.addRow(fila);
    });

    var paleta = ['#2E86C1', '#7D3C98', '#1E8449', '#D68910', '#CB4335', '#17A589', '#5D6D7E', '#AF7AC5'];
    var colores = serie.lineas.map(function(n, i) { return COLORES_ORIGEN[n] || paleta[i % paleta.length]; }).concat(['#C0392B']);
    var series = {};
    series[serie.lineas.length] = { lineDashStyle: [6, 4], pointSize: 0, enableInteractivity: false };

    new google.visualization.LineChart(div).draw(dt, {
      colors: colores,
      series: series,
      interpolateNulls: true,
      pointSize: 5,
      legend: { position: 'top' },
      chartArea: { width: '85%', height: '68%' },
      vAxis: { format: 'HH:mm' }
    });
  }

  // --- Patrones ---------------------------------------------------------------------------
  // Cada uno responde una pregunta distinta y por eso no se mezclan en un solo puntaje: lo que
  // hay que hacer con "llega tarde todos los miércoles" no es lo mismo que con "dejó de llegar".

  /** La fecha del ultimo dia en que ESTE grupo llego tarde: es la evidencia del patron. */
  function ultimaEvidenciaTarde(llegadas, g) {
    var fechas = llegadas
      .filter(function(l) { return l.remitente === g.remitente && l.reporte === g.reporte && l.tarde; })
      .map(function(l) { return l.fecha; })
      .sort();
    return fechas.length ? fechas[fechas.length - 1] : '';
  }

  function patronesLlegadas(grupos, llegadas) {
    var hoy = new Date();
    var patrones = { diaFijo: [], corriendose: [], sinLlegar: [], erratico: [] };

    // 1. Tarde siempre el mismo día de la semana.
    grupos.forEach(function(g) {
      var porDiaSemana = {};
      llegadas.filter(function(l) { return l.remitente === g.remitente && l.reporte === g.reporte; })
        .forEach(function(l) {
          if (!porDiaSemana[l.diaSemana]) porDiaSemana[l.diaSemana] = { total: 0, tarde: 0 };
          porDiaSemana[l.diaSemana].total++;
          if (l.tarde) porDiaSemana[l.diaSemana].tarde++;
        });
      Object.keys(porDiaSemana).forEach(function(d) {
        var x = porDiaSemana[d];
        // Al menos 2 ocurrencias y que falle en todas: con una sola vez no hay patrón, es un día malo.
        if (x.total >= 2 && x.tarde === x.total) {
          patrones.diaFijo.push({
            tipo: 'diaFijo', cliente: g.cliente, pod: g.pod, reporte: g.reporte, remitente: g.remitente,
            evidencia: ultimaEvidenciaTarde(llegadas, g) || g.ultima,
            detalle: 'Llegó tarde los ' + NOMBRE_DIA[d] + ' las ' + x.total + ' veces que se midió'
          });
        }
      });
    });

    // 2. Se está corriendo: la mitad más nueva contra la mitad más vieja.
    grupos.forEach(function(g) {
      var fechas = Object.keys(g.dias).sort();
      if (fechas.length < 4) return;
      var corte = Math.floor(fechas.length / 2);
      var prom = function(desde, hasta) {
        var vs = fechas.slice(desde, hasta).map(function(d) { return g.dias[d]; });
        return vs.reduce(function(a, b) { return a + b; }, 0) / vs.length;
      };
      var antes = prom(0, corte);
      var ahora = prom(corte, fechas.length);
      var deriva = Math.round(ahora - antes);
      // 20 minutos: por debajo de eso es el ruido normal de un cron que no arranca clavado.
      if (deriva >= 20) {
        patrones.corriendose.push({
          tipo: 'corriendose', evidencia: g.ultima,
          cliente: g.cliente, pod: g.pod, reporte: g.reporte, remitente: g.remitente,
          detalle: 'Se corrió ' + deriva + ' min: pasó de llegar ' + minutosAHora(antes) +
            ' a ' + minutosAHora(ahora)
        });
      }
    });

    // 3. Dejó de llegar: la deducción que no necesita que nadie declare nada. Si algo venía
    //    llegando y hace días que no, es un faltante aunque no esté en ninguna lista.
    grupos.forEach(function(g) {
      if (g.total < 3) return;   // sin historia suficiente no se puede afirmar que "venía llegando"
      var dias = Math.floor((hoy - new Date(g.ultima + 'T12:00:00')) / 86400000);
      if (dias >= 2) {
        patrones.sinLlegar.push({
          tipo: 'sinLlegar', evidencia: g.ultima,
          cliente: g.cliente, pod: g.pod, reporte: g.reporte, remitente: g.remitente,
          detalle: 'Última llegada hace ' + dias + ' días (' + g.ultima + '), y antes venía llegando ' +
            g.total + ' veces'
        });
      }
    });

    // 4. Errático: el promedio puede dar bien y aun así el horario saltar de 6 a 10.
    grupos.forEach(function(g) {
      if (g.total < 4) return;
      var media = g.promedio;
      var varianza = g.minutos.reduce(function(a, m) { return a + (m - media) * (m - media); }, 0) / g.minutos.length;
      var desvio = Math.round(Math.sqrt(varianza));
      if (desvio >= 60) {
        patrones.erratico.push({
          tipo: 'erratico', evidencia: g.ultima,
          cliente: g.cliente, pod: g.pod, reporte: g.reporte, remitente: g.remitente,
          detalle: 'Varía ±' + desvio + ' min entre días (de ' + minutosAHora(Math.min.apply(null, g.minutos)) +
            ' a ' + minutosAHora(Math.max.apply(null, g.minutos)) + ')'
        });
      }
    });

    return patrones;
  }

  // Orden de la tabla. Arranca por la última llegada, de la más nueva a la más vieja: mezclar
  // fechas hacía que la tabla pareciera desordenada. Se puede cambiar clickeando el
  // encabezado, porque según lo que se esté buscando sirve ordenar por otra cosa.
  var ordenLlegadas = { campo: 'ultima', desc: true };

  var CAMPO_ORDEN = {
    cliente: function(g) { return g.cliente.toLowerCase(); },
    pod: function(g) { return g.pod || ''; },
    reporte: function(g) { return g.reporte.toLowerCase(); },
    origen: function(g) { return g.origen; },
    promedio: function(g) { return g.promedio; },
    tarde: function(g) { return g.tarde; },
    ultima: function(g) { return g.ultima; }
  };

  function ordenarGrupos(grupos) {
    var saca = CAMPO_ORDEN[ordenLlegadas.campo] || CAMPO_ORDEN.ultima;
    return grupos.slice().sort(function(a, b) {
      var va = saca(a), vb = saca(b);
      if (va < vb) return ordenLlegadas.desc ? 1 : -1;
      if (va > vb) return ordenLlegadas.desc ? -1 : 1;
      // Empate: lo que más tarde llegó primero, que es lo que uno quiere ver.
      return b.tarde - a.tarde || b.promedio - a.promedio;
    });
  }

  function prepararOrdenTabla() {
    var tabla = document.getElementById('tablaLlegadas');
    if (!tabla || tabla.dataset.ordenListo) return;
    tabla.dataset.ordenListo = '1';
    var ths = tabla.querySelectorAll('thead th');
    var campos = ['cliente', 'pod', 'reporte', 'origen', 'promedio', 'tarde', 'ultima'];
    for (var i = 0; i < ths.length && i < campos.length; i++) {
      (function(th, campo) {
        th.style.cursor = 'pointer';
        th.title = 'Ordenar por esta columna';
        th.addEventListener('click', function() {
          if (ordenLlegadas.campo === campo) ordenLlegadas.desc = !ordenLlegadas.desc;
          else { ordenLlegadas.campo = campo; ordenLlegadas.desc = true; }
          pintarLlegadas();
        });
      })(ths[i], campos[i]);
    }
  }

  function marcarEncabezadoOrdenado() {
    var tabla = document.getElementById('tablaLlegadas');
    if (!tabla) return;
    var ths = tabla.querySelectorAll('thead th');
    var campos = ['cliente', 'pod', 'reporte', 'origen', 'promedio', 'tarde', 'ultima'];
    var textos = ['Cliente', 'POD', 'Reporte', 'Origen', 'Hora promedio', 'Días tarde', 'Última llegada'];
    for (var i = 0; i < ths.length && i < campos.length; i++) {
      ths[i].textContent = textos[i] +
        (ordenLlegadas.campo === campos[i] ? (ordenLlegadas.desc ? ' ▼' : ' ▲') : '');
    }
  }

  function claveDePatron(p) {
    return [p.tipo, String(p.remitente || '').toLowerCase(), p.reporte].join('|');
  }

  /**
   * Separa lo que hay que mirar de lo que alguien ya atendió.
   *
   * Una marca vale solo para la evidencia que existía cuando se puso. Si después aparece
   * evidencia nueva, el patrón vuelve a la lista activa con la aclaración de que ya se había
   * intentado arreglar. Eso es lo que buscábamos: un patrón que se marcó tres veces y volvió
   * tres veces no es un descuido, es algo que no se resuelve por ese camino.
   */
  function clasificarPorAtencion(items) {
    var ultima = (llegadasGlobal.atendidos || {}).ultima || {};
    var activos = [];
    var atendidos = [];
    items.forEach(function(p) {
      var marca = ultima[claveDePatron(p)];
      if (!marca) { activos.push(p); return; }
      // Hay evidencia posterior a la marca: el intento no alcanzó.
      if (p.evidencia && marca.evidenciaHasta && p.evidencia > marca.evidenciaHasta) {
        p.volvio = marca;
        activos.push(p);
      } else {
        p.marca = marca;
        atendidos.push(p);
      }
    });
    return { activos: activos, atendidos: atendidos };
  }

  function filaDePatron(p, conBoton) {
    var tr = crear('tr');
    var tdCli = crear('td', null, p.cliente);
    tdCli.title = p.remitente;   // la casilla exacta, que es donde hay que ir a mirar
    tr.appendChild(tdCli);
    tr.appendChild(crear('td', null, p.pod || '-'));
    tr.appendChild(crear('td', null, p.reporte));

    var tdQue = crear('td');
    tdQue.appendChild(document.createTextNode(p.detalle));
    if (p.volvio) {
      var volvio = crear('div', 'patron-volvio',
        '↩ Se marcó como atendido el ' + p.volvio.cuando + ' por ' + nombreOperador(p.volvio.quien) +
        ' y volvió a aparecer' + (p.volvio.nota ? ': "' + p.volvio.nota + '"' : ''));
      tdQue.appendChild(volvio);
    }
    if (p.marca) {
      var ok = crear('div', 'patron-atendido',
        '✓ ' + p.marca.cuando + ' · ' + nombreOperador(p.marca.quien) +
        (p.marca.nota ? ' · ' + p.marca.nota : ''));
      tdQue.appendChild(ok);
    }
    tr.appendChild(tdQue);

    var tdAcc = crear('td');
    if (conBoton) {
      var btn = crear('button', 'btn-secundario btn-chico', 'Marcar atendido');
      btn.addEventListener('click', function() { abrirModalPatron(p); });
      tdAcc.appendChild(btn);
    }
    tr.appendChild(tdAcc);
    return tr;
  }

  function tablaDePatrones(items, conBoton) {
    var tabla = crear('table', 'matriz-table tabla-logs');
    tabla.style.cssText = 'width: 100%; border-collapse: collapse;';
    var thead = crear('thead');
    var trh = crear('tr');
    ['Cliente', 'POD', 'Reporte', 'Qué pasa', ''].forEach(function(t) { trh.appendChild(crear('th', null, t)); });
    thead.appendChild(trh);
    tabla.appendChild(thead);
    var tbody = crear('tbody');
    items.forEach(function(p) { tbody.appendChild(filaDePatron(p, conBoton)); });
    tabla.appendChild(tbody);
    return tabla;
  }

  function pintarPatrones(patrones) {
    var cont = document.getElementById('patronesLlegadas');
    var vacio = document.getElementById('patronesVacio');
    if (!cont) return;
    cont.innerHTML = '';

    var bloques = [
      { clave: 'sinLlegar', titulo: '🔴 Dejaron de llegar', ayuda: 'Venían llegando y hace días que no. Es el más urgente: puede que el reporte ya no se esté generando.' },
      { clave: 'diaFijo', titulo: '📅 Tarde siempre el mismo día', ayuda: 'Se repite en el mismo día de la semana, así que no es casualidad: algo compite por el recurso ese día.' },
      { clave: 'corriendose', titulo: '📈 Se están corriendo', ayuda: 'Todavía llegan, pero cada vez más tarde. Es el aviso temprano: conviene mirarlo antes de que cruce el límite.' },
      { clave: 'erratico', titulo: '🎲 Horario errático', ayuda: 'El promedio puede dar bien y aun así el horario salta mucho de un día a otro.' }
    ];

    var hubo = false;
    var atendidosTodos = [];

    bloques.forEach(function(b) {
      var partido = clasificarPorAtencion(patrones[b.clave] || []);
      atendidosTodos = atendidosTodos.concat(partido.atendidos);
      if (!partido.activos.length) return;
      hubo = true;

      var card = crear('div', 'chart-card');
      card.style.cssText = 'border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px;';
      var h = crear('h3', null, b.titulo + ' (' + partido.activos.length + ')');
      h.style.cssText = 'margin: 0 0 4px 0; font-size: 16px;';
      card.appendChild(h);
      var ay = crear('p', 'ayuda', b.ayuda);
      ay.style.cssText = 'margin: 0 0 12px 0;';
      card.appendChild(ay);
      card.appendChild(tablaDePatrones(partido.activos, true));
      cont.appendChild(card);
    });

    // Los atendidos no se esconden: se corren abajo. Esconderlos haría que un reporte que
    // nunca más llega desaparezca de la pantalla, que es justo lo que queremos evitar.
    if (atendidosTodos.length) {
      hubo = true;
      var card = crear('div', 'chart-card');
      card.style.cssText = 'border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; opacity: .75;';
      var h = crear('h3', null, '✓ Ya atendidos (' + atendidosTodos.length + ')');
      h.style.cssText = 'margin: 0 0 4px 0; font-size: 16px;';
      card.appendChild(h);
      var ay = crear('p', 'ayuda', 'Alguien ya los miró. Siguen acá a la vista: si vuelve a pasar algo nuevo, suben solos al bloque de arriba.');
      ay.style.cssText = 'margin: 0 0 12px 0;';
      card.appendChild(ay);
      card.appendChild(tablaDePatrones(atendidosTodos, false));
      cont.appendChild(card);
    }

    // Historial completo, incluidas las marcas de patrones que ya no se detectan.
    var hist = ((llegadasGlobal.atendidos || {}).historial) || [];
    if (hist.length) {
      hubo = true;
      var cardH = crear('div', 'chart-card');
      cardH.style.cssText = 'border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px;';
      var hh = crear('h3', null, '🗒 Historial de lo atendido (' + hist.length + ')');
      hh.style.cssText = 'margin: 0 0 4px 0; font-size: 16px;';
      cardH.appendChild(hh);
      var ah = crear('p', 'ayuda', 'Todo lo que se marcó alguna vez, aunque el patrón ya no aparezca. Si un mismo caso figura varias veces, es que se intentó arreglar varias veces.');
      ah.style.cssText = 'margin: 0 0 12px 0;';
      cardH.appendChild(ah);

      // Cuántas veces se marcó cada caso: ver el número repetido es el dato.
      var veces = {};
      hist.forEach(function(x) { veces[x.clave] = (veces[x.clave] || 0) + 1; });

      var tabla = crear('table', 'matriz-table tabla-logs');
      tabla.style.cssText = 'width: 100%; border-collapse: collapse;';
      var thead = crear('thead');
      var trh = crear('tr');
      ['Cuándo', 'Quién', 'Cliente', 'Reporte', 'Patrón', 'Qué se hizo'].forEach(function(t) {
        trh.appendChild(crear('th', null, t));
      });
      thead.appendChild(trh);
      tabla.appendChild(thead);
      var tbody = crear('tbody');
      hist.forEach(function(x) {
        var tr = crear('tr');
        var td0 = crear('td', null, x.cuando);
        td0.style.whiteSpace = 'nowrap';
        tr.appendChild(td0);
        tr.appendChild(crear('td', null, nombreOperador(x.quien)));
        var tdc = crear('td', null, x.cliente || x.remitente);
        tdc.title = x.remitente;
        tr.appendChild(tdc);
        tr.appendChild(crear('td', null, x.reporte));
        var tdp = crear('td');
        tdp.appendChild(crear('span', 'badge', NOMBRE_PATRON[x.tipo] || x.tipo));
        if (veces[x.clave] > 1) {
          tdp.appendChild(crear('span', 'patron-reincidente', ' · ' + veces[x.clave] + ' intentos'));
        }
        tr.appendChild(tdp);
        tr.appendChild(crear('td', null, x.nota || '-'));
        tbody.appendChild(tr);
      });
      tabla.appendChild(tbody);
      cardH.appendChild(tabla);
      cont.appendChild(cardH);
    }

    if (vacio) vacio.style.display = hubo ? 'none' : 'block';
  }

  var NOMBRE_PATRON = {
    sinLlegar: 'Dejó de llegar',
    diaFijo: 'Tarde el mismo día',
    corriendose: 'Se está corriendo',
    erratico: 'Horario errático'
  };

  // --- Marcar un patrón como atendido -------------------------------------------------------

  function abrirModalPatron(p) {
    var fondo = crear('div', 'modal-overlay');
    var caja = crear('div', 'modal-card');
    caja.style.cssText = 'max-width: 560px; padding: 22px;';

    var titulo = crear('h3', null, 'Marcar como atendido');
    titulo.style.cssText = 'margin: 0 0 4px 0;';
    caja.appendChild(titulo);

    var sub = crear('p', 'ayuda', p.cliente + ' · ' + p.reporte + ' · ' + (NOMBRE_PATRON[p.tipo] || p.tipo));
    sub.style.cssText = 'margin: 0 0 2px 0;';
    caja.appendChild(sub);
    var sub2 = crear('p', 'ayuda', p.detalle);
    sub2.style.cssText = 'margin: 0 0 12px 0;';
    caja.appendChild(sub2);

    var ayuda = crear('p', 'ayuda',
      'Esto no da el problema por resuelto: deja constancia de que lo miraste. Si vuelve a pasar, ' +
      'el patrón reaparece y queda registrado que ya se había intentado.');
    ayuda.style.cssText = 'margin: 0 0 12px 0;';
    caja.appendChild(ayuda);

    var ta = crear('textarea');
    ta.placeholder = 'Qué hiciste o qué averiguaste (opcional)';
    ta.maxLength = 500;
    ta.style.cssText = 'width: 100%; min-height: 90px; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-family: inherit; font-size: 14px;';
    caja.appendChild(ta);

    var acciones = crear('div');
    acciones.style.cssText = 'display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;';
    var cancelar = crear('button', 'btn-secundario', 'Cancelar');
    var guardar = crear('button', 'btn-primario', 'Marcar atendido');
    acciones.appendChild(cancelar);
    acciones.appendChild(guardar);
    caja.appendChild(acciones);

    var cerrar = function() { if (fondo.parentNode) document.body.removeChild(fondo); };
    cancelar.addEventListener('click', cerrar);
    fondo.addEventListener('click', function(e) { if (e.target === fondo) cerrar(); });

    guardar.addEventListener('click', function() {
      ocupar(guardar, 'Guardando...');
      google.script.run
        .withSuccessHandler(function(r) {
          cerrar();
          if (r && r.atendidos) llegadasGlobal.atendidos = r.atendidos;
          pintarLlegadas();
        })
        .withFailureHandler(function(err) {
          liberar(guardar);
          var aviso = document.getElementById('avisoLlegadas');
          if (aviso) mostrarAviso(aviso, 'error', 'No se pudo guardar: ' + mensajeDeError(err));
        })
        .webapp_marcarPatronAtendido({
          tipo: p.tipo, remitente: p.remitente, reporte: p.reporte, cliente: p.cliente,
          // Se guarda hasta qué evidencia vale la marca. Sin esto no habría forma de saber si
          // lo que aparece después es el mismo problema o uno nuevo.
          evidenciaHasta: p.evidencia || '',
          nota: ta.value
        });
    });

    fondo.appendChild(caja);
    document.body.appendChild(fondo);
    ta.focus();
  }

  // --- Pintado general --------------------------------------------------------------------

  function pintarLlegadas() {
    if (!llegadasGlobal) return;
    var f = leerFiltrosLlegadas();
    var llegadas = filtrarLlegadas(f);
    var grupos = agruparLlegadas(llegadas);
    var faltantes = filtrarFaltantes(f);

    var total = llegadas.length;
    var tarde = llegadas.filter(function(l) { return l.tarde; }).length;
    var prom = total ? llegadas.reduce(function(a, l) { return a + l.minutos; }, 0) / total : 0;

    var set = function(id, txt) { var el = document.getElementById(id); if (el) el.textContent = txt; };
    set('scLlegadasTotal', String(total));
    set('scLlegadasTarde', total ? tarde + ' de ' + total : '-');
    set('scLlegadasPromedio', total ? minutosAHora(prom) : '-');
    set('scLlegadasFaltantes', String(faltantes.length));

    var cardTarde = document.getElementById('scLlegadasTardeCard');
    if (cardTarde) cardTarde.classList.toggle('alerta', tarde > 0);
    var cardFalta = document.getElementById('scLlegadasFaltantesCard');
    if (cardFalta) cardFalta.classList.toggle('alerta', faltantes.length > 0);

    var desde = document.getElementById('llegadasDesde');
    if (desde) {
      desde.textContent = llegadasGlobal.registroDesde
        ? 'Registro desde el ' + llegadasGlobal.registroDesde + '. Actualizado ' + llegadasGlobal.calculadoA + '.'
        : 'Todavía no hay nada registrado. Apretá Actualizar para empezar.';
    }
    var aviso = document.getElementById('avisoLlegadas');
    if (aviso) {
      if (llegadasGlobal.aviso) mostrarAviso(aviso, 'warn', llegadasGlobal.aviso);
      else aviso.hidden = true;
    }

    var agrup = (document.getElementById('agrupacionChartLlegadas') || {}).value || 'origen';
    var serie = serieLlegadas(llegadas, agrup);
    dibujarChartLlegadas(serie);
    var titulo = document.getElementById('tituloChartLlegadas');
    if (titulo) {
      titulo.textContent = 'Evolución de la hora de llegada' +
        (serie.recortado ? ' (las ' + serie.lineas.length + ' con más datos)' : '');
    }

    prepararOrdenTabla();
    marcarEncabezadoOrdenado();
    var tbody = document.getElementById('tbodyLlegadas');
    var vacio = document.getElementById('llegadasVacio');
    if (tbody) {
      tbody.innerHTML = '';
      ordenarGrupos(grupos).forEach(function(g) {
        var tr = crear('tr');
        var tdCli = crear('td', null, g.cliente);
        tdCli.title = g.remitente;
        tr.appendChild(tdCli);
        tr.appendChild(crear('td', null, g.pod || '-'));
        tr.appendChild(crear('td', null, g.reporte));
        tr.appendChild(crear('td', null, g.origen));
        var tdProm = crear('td');
        var pill = crear('span', 'tech-pill ' + (g.promedio > llegadasGlobal.limiteMinutos ? 'status-err' : 'status-ok'),
          minutosAHora(g.promedio));
        tdProm.appendChild(pill);
        tr.appendChild(tdProm);
        var tdTarde = crear('td', null, g.tarde + ' de ' + g.total);
        if (g.tarde > 0) tdTarde.style.color = '#C0392B';
        tr.appendChild(tdTarde);
        tr.appendChild(crear('td', null, g.ultima));
        tbody.appendChild(tr);
      });
      if (vacio) vacio.style.display = grupos.length ? 'none' : 'block';
    }

    pintarPatrones(patronesLlegadas(grupos, llegadas));
  }

  function llenarFiltrosLlegadas() {
    var llenar = function(id, valores) {
      var sel = document.getElementById(id);
      if (!sel) return;
      var actual = sel.value;
      while (sel.options.length > 1) sel.remove(1);
      valores.filter(function(v) { return v; }).sort().forEach(function(v) {
        var o = document.createElement('option');
        o.value = v; o.textContent = v;
        sel.appendChild(o);
      });
      sel.value = actual;
    };
    var unicos = function(campo) {
      var s = {};
      (llegadasGlobal.llegadas || []).forEach(function(l) { if (l[campo]) s[l[campo]] = true; });
      return Object.keys(s);
    };
    llenar('filtroClienteLlegadas', unicos('cliente'));
    llenar('filtroPodLlegadas', unicos('pod'));
    llenar('filtroReporteLlegadas', unicos('reporte'));
    llenar('filtroOrigenLlegadas', unicos('origen'));
  }

  function cargarLlegadas(forzar) {
    var btn = document.getElementById('btnActualizarLlegadas');
    var aviso = document.getElementById('avisoLlegadas');
    var f = leerFiltrosLlegadas();
    // El ocupar y el liberar van siempre juntos y con la misma condición: si solo se libera,
    // el botón pierde su etiqueta y queda en blanco.
    if (forzar && btn) ocupar(btn, 'Buscando correos nuevos...');
    google.script.run
      .withSuccessHandler(function(r) {
        if (forzar && btn) liberar(btn);
        llegadasGlobal = r;
        llenarFiltrosLlegadas();
        pintarLlegadas();
      })
      .withFailureHandler(function(err) {
        if (forzar && btn) liberar(btn);
        if (aviso) mostrarAviso(aviso, 'error', 'No se pudieron traer las llegadas: ' + mensajeDeError(err));
      })
      .webapp_obtenerLlegadasReportes(f.dias, !!forzar);
  }

  function inicializarLlegadas() {
    var btn = document.getElementById('btnActualizarLlegadas');
    // Al apretar Actualizar, además de refrescar, se registra lo que haya llegado desde la
    // última vez: así el historial se mantiene al día sin un activador nuevo.
    if (btn) btn.addEventListener('click', function() { cargarLlegadas(true); });

    ['filtroClienteLlegadas', 'filtroPodLlegadas', 'filtroReporteLlegadas', 'filtroOrigenLlegadas',
     'filtroDiaSemanaLlegadas', 'filtroSoloTardeLlegadas', 'agrupacionChartLlegadas'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('change', pintarLlegadas);
    });
    // El período cambia cuántos días pide el servidor, así que hay que volver a traer.
    var selDias = document.getElementById('filtroDiasLlegadas');
    var rango = document.getElementById('rangoLlegadas');
    var verRango = function() {
      if (rango) rango.style.display = (selDias && selDias.value === 'rango') ? 'inline-flex' : 'none';
    };
    if (selDias) {
      selDias.addEventListener('change', function() {
        verRango();
        // Al elegir Rango todavia no hay fechas cargadas: se espera a que las complete.
        if (selDias.value !== 'rango') cargarLlegadas(false);
      });
      verRango();
    }
    ['desdeLlegadas', 'hastaLlegadas'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('change', function() { cargarLlegadas(false); });
    });

    document.querySelectorAll('[data-tab-llegadas]').forEach(function(b) {
      b.addEventListener('click', function() {
        llegadasTabActiva = b.getAttribute('data-tab-llegadas');
        document.querySelectorAll('[data-tab-llegadas]').forEach(function(x) {
          x.classList.toggle('active', x === b);
          x.setAttribute('aria-selected', x === b ? 'true' : 'false');
        });
        var datos = document.getElementById('panelLlegadasDatos');
        var patr = document.getElementById('panelLlegadasPatrones');
        if (datos) datos.style.display = llegadasTabActiva === 'datos' ? '' : 'none';
        if (patr) patr.style.display = llegadasTabActiva === 'patrones' ? '' : 'none';
        // El gráfico se dibuja mal si el div estaba oculto: se redibuja al volver.
        if (llegadasTabActiva === 'datos') pintarLlegadas();
      });
    });

    cargarLlegadas(false);
  }

})();
</script>
