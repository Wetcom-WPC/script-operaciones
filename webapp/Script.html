<script>
/*
  Cliente del panel de Operaciones.

  Todo el contenido variable se inserta con textContent y nunca con innerHTML: los asuntos y
  los nombres de adjunto vienen de correos externos y son, literalmente, texto que escribió
  otra persona. Construir los nodos a mano es la forma barata de que eso no pueda ejecutarse.
*/
(function () {
  'use strict';

  var estado = window.ESTADO_INICIAL || {};

  var el = {
    usuario:    document.getElementById('usuario'),
    casilla:    document.getElementById('casilla'),
    contexto:   document.getElementById('contexto'),
    btnCiclo:   document.getElementById('btnCiclo'),
    avisoCiclo: document.getElementById('avisoCiclo'),
    ultimo:     document.getElementById('ultimoLanzamiento'),
    btnActualizar:   document.getElementById('btnActualizar'),
    contextoBandeja: document.getElementById('contextoBandeja'),
    avisoBandeja:    document.getElementById('avisoBandeja'),
    columnas:        document.getElementById('columnas')
  };

  // --- Utilidades ---------------------------------------------------------------------------

  function crear(tag, clase, texto) {
    var nodo = document.createElement(tag);
    if (clase) nodo.className = clase;
    if (texto !== undefined && texto !== null) nodo.textContent = texto;
    return nodo;
  }

  function vaciar(nodo) {
    while (nodo.firstChild) nodo.removeChild(nodo.firstChild);
  }

  function pildora(contenedor, texto, clase) {
    contenedor.appendChild(crear('span', 'pildora' + (clase ? ' ' + clase : ''), texto));
  }

  /** "hace 4 minutos" / "hace 2 horas": la antigüedad importa más que la hora exacta. */
  function antiguedad(iso) {
    var minutos = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (minutos < 1)  return 'recién';
    if (minutos === 1) return 'hace 1 minuto';
    if (minutos < 60) return 'hace ' + minutos + ' minutos';
    var horas = Math.floor(minutos / 60);
    return horas === 1 ? 'hace 1 hora' : 'hace ' + horas + ' horas';
  }

  function ocupar(boton, textoEspera) {
    boton.disabled = true;
    boton.dataset.textoOriginal = boton.textContent;
    vaciar(boton);
    boton.appendChild(crear('span', 'hilando'));
    boton.appendChild(document.createTextNode(textoEspera));
  }

  function liberar(boton) {
    boton.disabled = false;
    vaciar(boton);
    boton.textContent = boton.dataset.textoOriginal || boton.textContent;
  }

  function mostrarAviso(nodo, tipo, texto, acciones) {
    vaciar(nodo);
    nodo.className = 'aviso ' + tipo;
    nodo.appendChild(crear('div', null, texto));
    if (acciones && acciones.length) {
      var fila = crear('div', 'acciones');
      acciones.forEach(function (accion) {
        var boton = crear('button', accion.clase || 'btn-secundario', accion.texto);
        boton.addEventListener('click', accion.alHacerClic);
        fila.appendChild(boton);
      });
      nodo.appendChild(fila);
    }
    nodo.hidden = false;
  }

  // --- Encabezado y contexto ----------------------------------------------------------------

  function pintarEncabezado() {
    el.usuario.textContent = estado.usuario || '';
    el.casilla.textContent = estado.cuenta || 'casilla del deploy';
    el.casilla.title = 'El ciclo y la lectura de correos corren siempre sobre esta casilla, ' +
      'sin importar quién use el panel.';

    vaciar(el.contexto);
    pildora(el.contexto, estado.fecha);
    pildora(el.contexto, 'Ventana operativa ' + estado.ventana.inicio + '–' + estado.ventana.fin + ' hs');

    if (estado.testing) pildora(el.contexto, 'Entorno de PRUEBAS', 'testing');
    if (estado.feriado) pildora(el.contexto, 'Hoy es feriado: el ciclo se omite', 'alerta');
    else if (estado.finDeSemana) pildora(el.contexto, 'Fin de semana: el ciclo se omite', 'alerta');
    else if (!estado.enVentana) pildora(el.contexto, 'Fuera de la ventana automática', 'alerta');
    if (estado.cicloEnCurso) pildora(el.contexto, 'Hay un ciclo corriendo ahora', 'alerta');

    // Renderizar KPIs
    if (estado.kpis) {
      document.getElementById('kpiProcesados').textContent = estado.kpis.procesados;
      document.getElementById('kpiErrores').textContent = estado.kpis.errores;
      document.getElementById('kpiFaltantes').textContent = estado.kpis.faltantes;
    }

    pintarUltimoLanzamiento();

    // Poblar el filtro de Jira
    var selectCliente = document.getElementById('filtroClienteJira');
    if (selectCliente && selectCliente.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.key;
        opt.textContent = c.nombre;
        selectCliente.appendChild(opt);
      });
    }

    // Poblar el filtro de Reportes Analíticos
    var selectReportes = document.getElementById('filtroClienteReportes');
    if (selectReportes && selectReportes.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.key;
        opt.textContent = c.nombre;
        selectReportes.appendChild(opt);
      });
      selectReportes.addEventListener('change', function() {
        document.getElementById('btnCargarReportes').disabled = !this.value;
      });
    }

    // Poblar el filtro de Logs
    var selectLogs = document.getElementById('filtroClienteLogs');
    if (selectLogs && selectLogs.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.nombre.toLowerCase(); // En los logs el cliente viene por nombre
        opt.textContent = c.nombre;
        selectLogs.appendChild(opt);
      });
    }
  }

  function pintarUltimoLanzamiento() {
    var u = estado.ultimoLanzamiento;
    el.ultimo.textContent = u
      ? 'Último lanzamiento manual: ' + u.usuario + ', ' + antiguedad(u.ts) + '.'
      : 'Todavía no se lanzó ningún ciclo a mano desde este panel.';
  }

  // --- Ejecutar el ciclo --------------------------------------------------------------------

  function lanzarCiclo(forzar) {
    ocupar(el.btnCiclo, 'Lanzando…');
    el.avisoCiclo.hidden = true;

    google.script.run
      .withSuccessHandler(function (r) {
        liberar(el.btnCiclo);

        if (r.ok) {
          estado.ultimoLanzamiento = r.ultimoLanzamiento;
          pintarUltimoLanzamiento();
          mostrarAviso(el.avisoCiclo, 'ok', r.mensaje);
          return;
        }

        // El ciclo se omite los feriados y fines de semana por diseño. Se puede lanzar igual
        // (queda registrado en las ejecuciones del proyecto), pero conviene decirlo antes.
        if (r.codigo === 'DIA_NO_LABORAL') {
          mostrarAviso(el.avisoCiclo, 'atencion', r.mensaje, [
            { texto: 'Lanzar igual', clase: 'btn-primario', alHacerClic: function () { lanzarCiclo(true); } },
            { texto: 'Cancelar', alHacerClic: function () { el.avisoCiclo.hidden = true; } }
          ]);
          return;
        }

        mostrarAviso(el.avisoCiclo, r.codigo === 'EN_CURSO' ? 'atencion' : 'error', r.mensaje);
      })
      .withFailureHandler(function (error) {
        liberar(el.btnCiclo);
        mostrarAviso(el.avisoCiclo, 'error', 'No se pudo lanzar el ciclo: ' + error.message);
      })
      .webapp_lanzarCiclo(!!forzar);
  }

  // --- Bandeja ------------------------------------------------------------------------------

  function actualizarBandeja() {
    ocupar(el.btnActualizar, 'Leyendo Gmail…');
    el.avisoBandeja.hidden = true;

    google.script.run
      .withSuccessHandler(function (datos) {
        liberar(el.btnActualizar);
        estado.bandeja = datos;
        pintarBandeja();
        pintarContextoBandeja();
      })
      .withFailureHandler(function (error) {
        liberar(el.btnActualizar);
        mostrarAviso(el.avisoBandeja, 'error', 'No se pudo leer la bandeja: ' + error.message);
      })
      .webapp_actualizarBandeja();
  }

  /**
   * Solo la cinta de contexto ("actualizado hace X"). Va aparte del listado a propósito: es lo
   * único que cambia con el paso del tiempo, y repintar las columnas enteras cada minuto le
   * borraría el scroll a quien esté leyendo una lista larga.
   */
  function pintarContextoBandeja() {
    var datos = estado.bandeja;
    vaciar(el.contextoBandeja);
    if (!datos) return;

    pildora(el.contextoBandeja, 'Correos del ' + datos.fecha);
    pildora(el.contextoBandeja, 'Actualizado ' + antiguedad(datos.generado) +
      (datos.generadoPor ? ' por ' + datos.generadoPor : ''));

    if (datos.truncado) {
      var cortadas = (datos.columnas || []).filter(function (c) { return c.truncada; })
        .map(function (c) { return c.titulo; });
      pildora(el.contextoBandeja,
        (cortadas.length ? cortadas.join(' y ') : 'Algunas columnas') +
        ' llegaron al tope de ' + (datos.tope || '?') + ' por columna: hay más correos sin listar',
        'alerta');
    }
  }

  function pintarBandeja() {
    var datos = estado.bandeja;

    pintarContextoBandeja();
    vaciar(el.columnas);

    if (!datos) {
      el.columnas.appendChild(
        crear('p', 'vacio', 'Todavía no hay datos guardados. Tocá "Actualizar" para leer la bandeja de hoy.')
      );
      return;
    }

    // Llenar el dropdown de clientes usando la lista oficial de MASTER_INDEX
    var filtroCli = document.getElementById('filtroCliente');
    if (filtroCli.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.nombre.toLowerCase();
        opt.textContent = c.nombre;
        filtroCli.appendChild(opt);
      });
      var optOtros = document.createElement('option');
      optOtros.value = 'otros';
      optOtros.textContent = 'Otros / No identificados';
      filtroCli.appendChild(optOtros);
    }

    var textFiltroCli = filtroCli.value;
    var textFiltroBuscar = document.getElementById('filtroBuscar').value.toLowerCase();

    datos.columnas.forEach(function (columna) {
      el.columnas.appendChild(pintarColumna(columna, datos.items, textFiltroCli, textFiltroBuscar));
    });
  }

  function pintarColumna(columna, items, filtroCli, filtroBuscar) {
    var seccion = crear('div', 'columna');
    seccion.dataset.id = columna.id;

    var idsFiltrados = columna.ids.filter(function(id) {
      var item = items[id];
      if (!item) return false;
      var asuntoLower = item.asunto.toLowerCase();
      
      if (!item._clienteInferido) {
         var encontrado = null;
         if (estado.clientes) {
           for (var i = 0; i < estado.clientes.length; i++) {
              if (asuntoLower.indexOf(estado.clientes[i].nombre.toLowerCase()) !== -1) {
                 encontrado = estado.clientes[i].nombre;
                 break;
              }
           }
         }
         item._clienteInferido = encontrado ? encontrado : 'Otros';
      }
      
      if (filtroCli && filtroCli !== 'otros' && item._clienteInferido.toLowerCase() !== filtroCli) return false;
      if (filtroCli === 'otros' && item._clienteInferido !== 'Otros') return false;
      if (filtroBuscar && asuntoLower.indexOf(filtroBuscar) === -1) return false;
      
      return true;
    });

    var cabecera = crear('header');
    var titulo = crear('div', 'titulo');
    titulo.appendChild(crear('h3', null, columna.titulo));

    var cuentaStr = idsFiltrados.length + (columna.truncada ? '+' : '');
    var cuenta = crear('span', 'cuenta', cuentaStr);
    if (columna.truncada) {
      cuenta.title = 'Hay más correos: la búsqueda se cortó en el tope por columna.';
    }
    titulo.appendChild(cuenta);
    cabecera.appendChild(titulo);
    cabecera.appendChild(crear('p', 'sub', columna.descripcion));
    seccion.appendChild(cabecera);

    if (!idsFiltrados.length) {
      seccion.appendChild(crear('p', 'vacio', 'Sin correos'));
      return seccion;
    }

    var lista = crear('ul', 'lista');
    idsFiltrados.forEach(function (id) {
      var item = items[id];
      lista.appendChild(pintarCorreo(item, columna.id));
    });
    seccion.appendChild(lista);
    return seccion;
  }

    function pintarCorreo(item, columnaId) {
      var li = crear('li', 'correo');
      
      var pAsunto = crear('p', 'asunto', item.asunto);
      if (item.reintentos && item.reintentos > 0) {
        var badgeReintentos = document.createElement('span');
        badgeReintentos.className = 'badge-retry';
        badgeReintentos.textContent = item.reintentos + ' reintentos';
        pAsunto.appendChild(badgeReintentos);
      }
      li.appendChild(pAsunto);
  
      var meta = crear('div', 'meta');
    meta.appendChild(crear('span', 'hora', item.hora));
    var remitente = crear('span', null, item.remitente);
    remitente.title = item.remitenteEmail;
    meta.appendChild(remitente);
    if (item.mensajes > 1) meta.appendChild(crear('span', null, item.mensajes + ' mensajes'));
    li.appendChild(meta);

    if (item.adjuntos.length) {
      li.appendChild(crear('p', 'adjuntos', '📎 ' + item.adjuntos.join(' · ')));
    }

    var marcas = crear('div', 'marcas');

    // En la columna de sin leer, la etiqueta [OPS-*] dice si el ciclo ya lo tocó: un correo sin
    // leer Y sin etiqueta es uno que todavía no pasó por el pipeline.
    if (columnaId === 'SIN_LEER' && !item.etiquetas.length) {
      marcas.appendChild(crear('span', 'marca-chip', 'sin procesar'));
    }
    item.etiquetas.forEach(function (nombre) {
      marcas.appendChild(crear('span', 'marca-chip', nombre));
    });

    // El contador de reintentos es el dato de debugging del estado PENDIENTE: dice cuántas
    // vueltas lleva este correo antes de que el ciclo lo aparte a [OPS-ERROR].
    if (item.reintentos > 0) {
      marcas.appendChild(crear('span', 'marca-chip reintentos', 'reintentos: ' + item.reintentos));
    }

    if (marcas.childNodes.length) li.appendChild(marcas);
    return li;
  }

  // --- Logs del Sistema ------------------------------------------------------------------
  var logsGlobales = null;
  var logTabActivo = 'estadoFinal';
  var ordenLogs = { key: null, asc: true };

  function actualizarContadoresLogs() {
    if (!logsGlobales) return;
    var cEF = (logsGlobales.estadoFinal || []).length;
    var cErr = (logsGlobales.erroresScript || []).length;
    var cMail = (logsGlobales.envioMails || []).length;
    var cFalt = (logsGlobales.reportesFaltantes || []).length;
    
    var bEF = document.getElementById('badgeCountEstadoFinal');
    var bErr = document.getElementById('badgeCountErroresScript');
    var bMail = document.getElementById('badgeCountEnvioMails');
    var bFalt = document.getElementById('badgeCountReportesFaltantes');

    if (bEF) bEF.textContent = cEF;
    if (bErr) bErr.textContent = cErr;
    if (bMail) bMail.textContent = cMail;
    if (bFalt) bFalt.textContent = cFalt;

    var ts = document.getElementById('tsLogs');
    if (ts) {
      var d = new Date();
      ts.textContent = 'Actualizado ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
    }
  }

  function cargarLogs() {
    var btn = document.getElementById('btnActualizarLogs');
    ocupar(btn, 'Cargando logs...');
    document.getElementById('avisoLogs').hidden = true;
    
    var sheetId = null;
    var selectEnv = document.getElementById('filtroEntornoLogs');
    if (selectEnv) sheetId = selectEnv.value;

    google.script.run
      .withSuccessHandler(function(logs) {
        liberar(btn);
        logsGlobales = logs;
        actualizarContadoresLogs();
        pintarTabActivo();
      })
      .withFailureHandler(function(error) {
        liberar(btn);
        mostrarAviso(document.getElementById('avisoLogs'), 'error', 'No se pudieron cargar los logs: ' + error.message);
      })
      .webapp_obtenerLogs(80, sheetId);
  }

  function cambiarTabLogs(event) {
    var target = event.currentTarget || event.target;
    if (!target.classList.contains('tab-btn')) return;
    
    var botones = document.querySelectorAll('#seccion-logs .tab-btn');
    for (var i = 0; i < botones.length; i++) {
      botones[i].classList.remove('active');
      botones[i].setAttribute('aria-selected', 'false');
    }
    target.classList.add('active');
    target.setAttribute('aria-selected', 'true');
    
    logTabActivo = target.getAttribute('data-tab');
    ordenLogs = { key: null, asc: true };
    pintarTabActivo();
  }

  var TECHS_FIJAS = ['Veeam', 'vSphere', 'Horizon', 'Nutanix', 'Tanzu', 'NSX'];

  var POD_COLORES = {
    'POD1': '#db7b65', 'POD 1': '#db7b65',
    'POD2': '#a9a4d8', 'POD 2': '#a9a4d8',
    'POD3': '#90bceb', 'POD 3': '#90bceb',
    'POD4': '#b6d7a8', 'POD 4': '#b6d7a8',
    'POD5': '#c27ba0', 'POD 5': '#c27ba0',
    'Cloud': '#ffe599'
  };

  function _mapTecnologia(tec) {
    if (!tec) return 'Otro';
    var t = tec.toLowerCase();
    if (t.includes('vro') || t.includes('rvtools')) return 'vSphere';
    if (t.includes('veeam')) return 'Veeam';
    if (t.includes('connection')) return 'Horizon';
    if (t.includes('nutanix')) return 'Nutanix';
    if (t.includes('tanzu')) return 'Tanzu';
    if (t.includes('nsx')) return 'NSX';
    return tec;
  }

  function _estadoEsPeor(nuevo, actual) {
    var j = { 'Con Incidencias': 2, 'Con Advertencias': 1, 'ADVERTENCIA': 1, 'Sin Anomalías': 0 };
    return (j[nuevo] || 0) > (j[actual] || 0);
  }

  function _pivotarEnvioMails(datos, fechaFiltro) {
    var hoy = new Date();
    var target = new Date(hoy);
    if (fechaFiltro === 'ayer')     { target.setDate(target.getDate()-1); }
    if (fechaFiltro === 'hace2')    { target.setDate(target.getDate()-2); }
    if (fechaFiltro === 'hace3')    { target.setDate(target.getDate()-3); }
    
    var fechaStr = (target.getDate()+'').padStart(2,'0') + '/' + (target.getMonth()+1+'').padStart(2,'0') + '/' + target.getFullYear();

    var filtrados = datos.filter(function(d) {
      return d.fecha === fechaStr;
    });

    var grupos = {}; 
    filtrados.forEach(function(d) {
      var pod = d.pod || 'Sin POD';
      var cli = d.cliente;
      var tec = _mapTecnologia(d.tecnologia);
      
      if (TECHS_FIJAS.indexOf(tec) === -1) return;
      
      if (!grupos[pod])             grupos[pod] = {};
      if (!grupos[pod][cli])        grupos[pod][cli] = {};
      
      var actual = grupos[pod][cli][tec];
      var nuevo  = { estado: d.estado, operaciones: parseInt(d.operaciones) || 0 };
      
      if (!actual || _estadoEsPeor(nuevo.estado, actual.estado)) {
        grupos[pod][cli][tec] = nuevo;
      }
    });

    return grupos;
  }

  function _renderPivotEnvioMails(grupos, thead, tbody) {
    var trH = crear('tr');
    trH.style.backgroundColor = '#00c370';
    trH.style.color = 'white';
    
    var thPod = crear('th', null, 'POD');
    var thCli = crear('th', null, 'Cliente');
    thPod.style.padding = '8px';
    thCli.style.padding = '8px';
    trH.appendChild(thPod);
    trH.appendChild(thCli);
    
    TECHS_FIJAS.forEach(function(t) { 
        var th = crear('th', null, t);
        th.style.textAlign = 'center';
        th.style.padding = '8px';
        th.style.borderLeft = '1px solid rgba(255,255,255,0.2)';
        trH.appendChild(th); 
    });
    thead.appendChild(trH);

    var podsOrdenados = Object.keys(grupos).sort();
    podsOrdenados.forEach(function(pod) {
      var clientes = grupos[pod];
      var color = POD_COLORES[pod] || '#f9f9f9';
      var clientesList = Object.keys(clientes).sort();
      var totalClientes = clientesList.length;

      clientesList.forEach(function(cliente, idx) {
        var tr = crear('tr');

        if (idx === 0) {
          var tdPod = crear('td');
          tdPod.rowSpan = totalClientes;
          tdPod.textContent = pod;
          tdPod.style.fontWeight = '700';
          tdPod.style.textAlign = 'center';
          tdPod.style.verticalAlign = 'middle';
          tdPod.style.backgroundColor = color;
          tdPod.style.border = '1px solid rgba(0,0,0,0.2)';
          if(pod==='POD4' || pod==='Cloud') tdPod.style.color = '#333';
          else tdPod.style.color = '#fff';
          tr.appendChild(tdPod);
        }

        var tdCli = crear('td', null, cliente);
        tdCli.style.backgroundColor = color;
        tdCli.style.border = '1px solid rgba(0,0,0,0.2)';
        tdCli.style.fontWeight = '600';
        tdCli.style.padding = '4px 10px';
        if(pod==='POD4' || pod==='Cloud') tdCli.style.color = '#333';
        else tdCli.style.color = '#fff';
        tr.appendChild(tdCli);

        TECHS_FIJAS.forEach(function(tech) {
          var td = crear('td');
          td.style.textAlign = 'center';
          td.style.backgroundColor = '#383838';
          td.style.border = '1px solid #555';
          td.style.padding = '4px';
          
          var entrada = clientes[cliente][tech];
          if (!entrada) {
            td.innerHTML = '<span style="color:#666;font-size:16px">🚫</span>';
          } else {
            var emoji, title;
            if (entrada.estado === 'Sin Anomalías' || entrada.estado === 'SUCCESS') {
              emoji = '✅'; title = 'Sin anomalías';
            } else if (entrada.estado === 'Con Advertencias' || entrada.estado === 'ADVERTENCIA') {
              emoji = '⚠️'; title = 'Con advertencias';
            } else {
              emoji = '❌'; title = 'Con incidencias';
            }
            td.title = title + (entrada.operaciones > 0 ? ' (' + entrada.operaciones + ' ops)' : '');
            td.innerHTML = '<span style="font-size:16px;cursor:default">' + emoji + '</span>';
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    });
  }

  function obtenerDatosLogsFiltrados() {
    if (!logsGlobales || !logsGlobales[logTabActivo]) return [];
    
    var textFiltroCli = document.getElementById('filtroClienteLogs') ? document.getElementById('filtroClienteLogs').value.toLowerCase().trim() : '';
    var textFiltroBuscar = document.getElementById('filtroBuscarLogs') ? document.getElementById('filtroBuscarLogs').value.toLowerCase().trim() : '';
    var valPod = document.getElementById('filtroPodLogs') ? document.getElementById('filtroPodLogs').value.toUpperCase().trim() : '';
    var valReinc = document.getElementById('filtroReincidenteLogs') ? document.getElementById('filtroReincidenteLogs').value : '';

    var dataRaw = logsGlobales[logTabActivo] || [];
    
    return dataRaw.filter(function(log) {
      if (textFiltroCli && log.cliente && log.cliente.toLowerCase().indexOf(textFiltroCli) === -1) {
        return false;
      }
      if (valPod && log.pod && log.pod.toUpperCase().replace(/\s+/g, '') !== valPod.replace(/\s+/g, '')) {
        return false;
      }
      if (logTabActivo === 'erroresScript' && valReinc === 'reincidente' && !log.reincidente) {
        return false;
      }
      if (textFiltroBuscar) {
        var str = JSON.stringify(log).toLowerCase();
        if (str.indexOf(textFiltroBuscar) === -1) return false;
      }
      return true;
    });
  }

  function exportarCSVActual() {
    if (!logsGlobales) {
      mostrarAviso(document.getElementById('avisoLogs'), 'atencion', 'Cargá los logs primero antes de exportar.');
      return;
    }
    var datos = obtenerDatosLogsFiltrados();
    if (!datos || datos.length === 0) {
      mostrarAviso(document.getElementById('avisoLogs'), 'atencion', 'No hay datos visibles para exportar con los filtros seleccionados.');
      return;
    }

    var headers = Object.keys(datos[0]);
    var lineas = [];
    lineas.push(headers.map(function(h) { return '"' + h.replace(/"/g, '""') + '"'; }).join(';'));

    datos.forEach(function(item) {
      var fila = headers.map(function(h) {
        var val = item[h];
        if (val === null || val === undefined) val = '';
        return '"' + String(val).replace(/"/g, '""') + '"';
      });
      lineas.push(fila.join(';'));
    });

    var csvBlob = new Blob(['\uFEFF' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(csvBlob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'logs_' + logTabActivo + '_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function pintarTabActivo() {

      document.getElementById('logsVacio').style.display = 'block';

    }

    if (filtroFecha) filtroFecha.style.display = (logTabActivo === 'envioMails') ? 'inline-block' : 'none';

    if (filtroReinc) filtroReinc.style.display = (logTabActivo === 'erroresScript') ? 'inline-block' : 'none';

    if (logTabActivo === 'envioMails') {
      var dataEnvio = obtenerDatosLogsFiltrados();
      var grupos = _pivotarEnvioMails(dataEnvio, filtroFecha ? filtroFecha.value : 'hoy');
      if (Object.keys(grupos).length === 0) {
        document.getElementById('tablaLogs').style.display = 'none';
        document.getElementById('logsVacio').style.display = 'block';
      } else {
        document.getElementById('tablaLogs').style.display = 'table';
        document.getElementById('logsVacio').style.display = 'none';
        _renderPivotEnvioMails(grupos, thead, tbody);
      }
      return;
    }
    
    var data = obtenerDatosLogsFiltrados();

    if (ordenLogs.key) {
      data.sort(function(a, b) {
        var valA = a[ordenLogs.key];
        var valB = b[ordenLogs.key];
        
        if (valA === undefined || valA === null) valA = '';
        if (valB === undefined || valB === null) valB = '';
        
        if (typeof valA === 'string' && typeof valB === 'string') {
           var r = valA.localeCompare(valB);
           return ordenLogs.asc ? r : -r;
        }
        if (valA > valB) return ordenLogs.asc ? 1 : -1;
        if (valA < valB) return ordenLogs.asc ? -1 : 1;
        return 0;
      });
    }

    if (data.length === 0) {
      document.getElementById('tablaLogs').style.display = 'none';
      document.getElementById('logsVacio').style.display = 'block';
      return;
    }

    document.getElementById('tablaLogs').style.display = 'table';
    document.getElementById('logsVacio').style.display = 'none';

    // Generar cabecera según el tab
    var trCabecera = crear('tr');
    trCabecera.style.borderBottom = '2px solid #eee';
    
    var cabeceras = [];
    if (logTabActivo === 'estadoFinal') {
      cabeceras = [
        { label: 'Hora', key: 'hora' },
        { label: 'Operación', key: 'operacion' },
        { label: 'Cliente', key: 'cliente' },
        { label: 'POD', key: 'pod' },
        { label: 'Estado', key: 'estado' }
      ];
    } else if (logTabActivo === 'erroresScript') {
      cabeceras = [
        { label: 'Hora', key: 'hora' },
        { label: 'Operación', key: 'operacion' },
        { label: 'Cliente', key: 'cliente' },
        { label: '¿Reincidente?', key: 'reincidente' },
        { label: 'Detalle Error', key: 'error' }
      ];
    } else if (logTabActivo === 'envioMails') {
      cabeceras = [
        { label: 'Hora', key: 'horaStr' },
        { label: 'Cliente', key: 'cliente' },
        { label: 'Tecnología', key: 'tecnologia' },
        { label: 'POD', key: 'pod' },
        { label: 'Estado', key: 'estado' },
        { label: 'Tickets', key: 'totalTickets' },
        { label: 'Sop.', key: 'soporte' },
        { label: 'Ops.', key: 'operaciones' }
      ];
    } else if (logTabActivo === 'reportesFaltantes') {
      cabeceras = [
        { label: 'Fecha', key: 'fecha' },
        { label: 'Hora', key: 'hora' },
        { label: 'Cliente', key: 'cliente' },
        { label: 'POD', key: 'pod' },
        { label: 'Tecnología', key: 'tecnologia' },
        { label: 'Operación', key: 'operacion' }

    cabeceras.forEach(function(c) {

      th.style.userSelect = 'none';

      if (ordenLogs.key === c.key) {
         texto += ordenLogs.asc ? ' ▼' : ' ▲';
      }
      th.textContent = texto;
      
      th.addEventListener('click', function() {
         if (ordenLogs.key === c.key) {
            ordenLogs.asc = !ordenLogs.asc;
         } else {
            ordenLogs.key = c.key;
            ordenLogs.asc = true;
         }
         pintarTabActivo();
      });
      
      trCabecera.appendChild(th);
    });
    thead.appendChild(trCabecera);

    // Generar filas
    data.forEach(function(log, i) {

      if (logTabActivo === 'estadoFinal' && (log.origen || log.ultimoError || log.intentos > 1)) tieneDetalle = true;
      if (logTabActivo === 'erroresScript' && log.error) tieneDetalle = true;

          }

        tr.addEventListener('click', toggleDetalle);
        tr.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleDetalle();

      if (logTabActivo === 'estadoFinal') {
        tr.appendChild(crear('td', null, log.hora));
        tr.appendChild(crear('td', null, log.operacion));
        tr.appendChild(crear('td', null, log.cliente || '-'));
        
        var tdPod = crear('td');

        } else {

        tr.appendChild(tdPod);
        
        var tdEstado = crear('td');

        if (log.estado === 'SUCCESS' || log.estado.indexOf('Resuelto') > -1) badge = 'badge-success';
        else if (log.estado === 'ADVERTENCIA' || log.estado.indexOf('advertencia') > -1) badge = 'badge-warning';
        else if (log.estado === 'ERROR' || log.estado.indexOf('No resuelto') > -1) badge = 'badge-error';
        tdEstado.appendChild(crear('span', 'badge ' + badge, log.estado));
        tr.appendChild(tdEstado);

      else if (logTabActivo === 'erroresScript') {
        tr.appendChild(crear('td', null, log.hora));
        tr.appendChild(crear('td', null, log.operacion));
        tr.appendChild(crear('td', null, log.cliente || '-'));
        
        var tdReinc = crear('td');
        if (log.reincidente) {
          tdReinc.appendChild(crear('span', 'badge-reincidente', '⚠ SÍ'));
        } else {
          tdReinc.textContent = 'No';
          tdReinc.style.color = '#9ca3af';
        }
        tr.appendChild(tdReinc);
        
        tr.appendChild(crear('td', null, (log.error ? log.error.substring(0, 55) + '...' : '-')));
      }
      else if (logTabActivo === 'envioMails') {
        tr.appendChild(crear('td', null, log.horaStr));
        tr.appendChild(crear('td', null, log.cliente || '-'));
        tr.appendChild(crear('td', null, log.tecnologia));
        tr.appendChild(crear('td', null, log.pod));
        
        var tdEstado = crear('td');
        var badge = 'badge-neutral';
        if (log.estado === 'Sin Anomalías') badge = 'badge-success';
        else if (log.estado === 'Con Advertencias') badge = 'badge-warning';
        else if (log.estado === 'Con Incidencias') badge = 'badge-error';
        tdEstado.appendChild(crear('span', 'badge ' + badge, log.estado));
        tr.appendChild(tdEstado);
        
        tr.appendChild(crear('td', null, log.totalTickets));
        tr.appendChild(crear('td', null, log.soporte));
        tr.appendChild(crear('td', null, log.operaciones));
      }
      else if (logTabActivo === 'reportesFaltantes') {
        tr.appendChild(crear('td', null, log.fecha));
        tr.appendChild(crear('td', null, log.hora));
        tr.appendChild(crear('td', null, log.cliente || '-'));
        tr.appendChild(crear('td', null, log.pod || '-'));
        tr.appendChild(crear('td', null, log.tecnologia || '-'));
        tr.appendChild(crear('td', null, log.operacion));
      }
      
      tbody.appendChild(tr);

      // Fila de detalle expandible
      if (tieneDetalle) {
        var trDetalle = crear('tr', 'fila-detalle');
        trDetalle.id = 'detalle-log-' + i;
        trDetalle.style.display = 'none';

          var bTickets = crear('span', 'badge-info');
          bTickets.innerHTML = '<strong>Tickets Creados:</strong> ' + (log.ticketsCreados || 0);
          var bAct = crear('span', 'badge-info');
          bAct.innerHTML = '<strong>Tickets Actualizados:</strong> ' + (log.ticketsActualizados || 0);

          badges.appendChild(bIntentos);
          badges.appendChild(bTickets);
          badges.appendChild(bAct);
          badges.appendChild(bTareas);

          if (log.ultimaAct) {
            var bHoraAct = crear('span', 'badge-info');
            bHoraAct.innerHTML = '<strong>Última Actualización:</strong> ' + log.ultimaAct;
            badges.appendChild(bHoraAct);
          }
          divDetalle.appendChild(badges);

          if (log.ultimoError) {
            var errorWrap = crear('div', 'error-formateado');

      }
    });

  function cambiarSubtabOperaciones(event) {
    var target = event.currentTarget || event.target;
    var subtab = target.getAttribute('data-tab-operaciones');
    if (!subtab) return;

    var botones = document.querySelectorAll('#seccion-operaciones .tab-btn');
    for (var i = 0; i < botones.length; i++) {
      botones[i].classList.remove('active');
      botones[i].setAttribute('aria-selected', 'false');
    }
    target.classList.add('active');
    target.setAttribute('aria-selected', 'true');

    subtabOperacionesActivo = subtab;

    var vMatriz = document.getElementById('vistaSubtabMatriz');
    var vTendencias = document.getElementById('vistaSubtabTendencias');
    var controles = document.getElementById('controlesMatriz');
    var scorecard = document.getElementById('scorecardMatriz');

    if (subtab === 'matriz') {
      if (vMatriz) vMatriz.style.display = 'block';
      if (vTendencias) vTendencias.style.display = 'none';
      if (controles) controles.style.display = 'flex';
      if (scorecard) scorecard.style.display = 'grid';
    } else {
      if (vMatriz) vMatriz.style.display = 'none';
      if (vTendencias) vTendencias.style.display = 'block';
      if (controles) controles.style.display = 'none';
      if (scorecard) scorecard.style.display = 'none';
      if (!tendenciasGlobal) {
        cargarTendencias();
      } else {
        pintarTendencias();
      }
    }
  }

  function pintarTendencias() {
    if (!tendenciasGlobal || tendenciasGlobal.length === 0) return;

    var arrChart = [['Día', 'Resueltos', 'Con Advertencias', 'Errores']];
    var tbody = document.getElementById('tbodyTendencias');
    if (!tbody) return;
    vaciar(tbody);

    tendenciasGlobal.forEach(function(d) {
      arrChart.push([d.fecha, d.resueltos, d.advertencias, d.errores]);

      var totalOps = d.resueltos + d.advertencias + d.errores;
      var estabilidadPct = totalOps > 0 ? Math.round((d.resueltos / totalOps) * 100) : 100;

      var tr = crear('tr');
      tr.appendChild(crear('td', null, d.fecha));
      tr.appendChild(crear('td', null, d.resueltos));
      tr.appendChild(crear('td', null, d.advertencias));
      tr.appendChild(crear('td', null, d.errores));
      tr.appendChild(crear('td', null, d.totalTickets));

      var tdEst = crear('td');
      var badgeClase = 'badge-success';
      if (estabilidadPct < 80) badgeClase = 'badge-error';
      else if (estabilidadPct < 95) badgeClase = 'badge-warning';
      tdEst.appendChild(crear('span', 'badge ' + badgeClase, estabilidadPct + '%'));
      tr.appendChild(tdEst);

      tbody.appendChild(tr);
    });

    var chartDiv = document.getElementById('chart_tendencia_div');
    if (chartDiv && typeof google !== 'undefined' && google.visualization && google.visualization.ColumnChart) {
      var dataTable = google.visualization.arrayToDataTable(arrChart);
      var options = {
        isStacked: true,
        colors: ['#109E58', '#D97706', '#DC2626'],
        legend: { position: 'top' },
        chartArea: { width: '85%', height: '70%' },
        hAxis: { title: 'Fecha' },
        vAxis: { title: 'Volumen de Operaciones', minValue: 0 }
      };
      var chart = new google.visualization.ColumnChart(chartDiv);
      chart.draw(dataTable, options);
    }
  }

  // --- Modal de Detalle de Cliente ---------------------------------------------------------
  function abrirModalDetalleCliente(cli) {
    var modal = document.getElementById('modalDetalleCliente');
    var titulo = document.getElementById('modalTituloCliente');
    var cuerpo = document.getElementById('modalCuerpoCliente');
    if (!modal || !cuerpo) return;

    titulo.textContent = 'Detalle Operacional — ' + cli.cliente + (cli.pod ? ' [' + cli.pod + ']' : '');
    vaciar(cuerpo);

    if (!cli.operaciones || cli.operaciones.length === 0) {
      cuerpo.appendChild(crear('p', 'vacio', 'No se encontraron operaciones registradas para este cliente.'));
    } else {
      var wrap = crear('div', 'table-responsive');
      var tabla = crear('table', 'tabla-logs');
      var thead = crear('thead');
      var trH = crear('tr');
      ['Hora', 'Tecnología', 'Operación', 'Estado', 'Tickets', 'Detalle / Error'].forEach(function(h) {
        trH.appendChild(crear('th', null, h));
      });
      thead.appendChild(trH);
      tabla.appendChild(thead);

      var tbody = crear('tbody');
      cli.operaciones.forEach(function(op) {
        var tr = crear('tr');
        tr.appendChild(crear('td', null, op.hora || '-'));
        tr.appendChild(crear('td', null, op.tech || '-'));
        tr.appendChild(crear('td', null, op.operacion || '-'));

        var tdEst = crear('td');
        var badge = 'badge-neutral';
        if (op.estado && (op.estado.indexOf('Resuelto') > -1 || op.estado === 'SUCCESS')) badge = 'badge-success';
        else if (op.estado && op.estado.indexOf('advertencia') > -1) badge = 'badge-warning';
        else if (op.estado && op.estado.indexOf('No resuelto') > -1) badge = 'badge-error';
        tdEst.appendChild(crear('span', 'badge ' + badge, op.estado));
        tr.appendChild(tdEst);

        tr.appendChild(crear('td', null, op.ticketsCreados || 0));

        var tdDet = crear('td');
        if (op.ultimoError) {
          var errSpan = crear('span', null, op.ultimoError);
          errSpan.style.color = 'var(--rojo-osc)';
          errSpan.style.fontSize = '12px';
          tdDet.appendChild(errSpan);
        } else {
          tdDet.textContent = '-';
          tdDet.style.color = '#9ca3af';
        }
        tr.appendChild(tdDet);

        tbody.appendChild(tr);
      });
      tabla.appendChild(tbody);
      wrap.appendChild(tabla);
      cuerpo.appendChild(wrap);
    }

    modal.style.display = 'flex';
  }

  function cerrarModalCliente() {
    var modal = document.getElementById('modalDetalleCliente');
    if (modal) modal.style.display = 'none';
  }

  // --- Gestión de Tickets Jira -------------------------------------------------------------
  
  function cargarJira() {
    var btn = document.getElementById('btnCargarJira');
    var rango = document.getElementById('filtroTiempoJira').value;
    var projectKey = document.getElementById('filtroClienteJira').value;
    ocupar(btn, 'Consultando Jira...');
    document.getElementById('avisoJira').hidden = true;

    google.script.run
      .withSuccessHandler(function(datosAgrupados) {
        liberar(btn);
        pintarJira(datosAgrupados);
      })
      .withFailureHandler(function(error) {
        liberar(btn);
        mostrarAviso(document.getElementById('avisoJira'), 'error', 'No se pudieron consultar los tickets: ' + error.message);
      })
      .webapp_obtenerTicketsJira(rango, projectKey);
  }

  function pintarJira(datosAgrupados) {
    var contenedor = document.getElementById('contenedorTicketsJira');
    var vacio = document.getElementById('contenedorJiraVacio');
    vaciar(contenedor);

    if (!datosAgrupados || datosAgrupados.length === 0) {
      vacio.textContent = 'No se encontraron tickets creados por el bot en el rango seleccionado.';
      vacio.style.display = 'block';
      return;
    }
    
    vacio.style.display = 'none';

    datosAgrupados.forEach(function(grupo, gIndex) {
      // Crear Item de Acordeón
      var item = crear('div', 'acordeon-item');
      
      // Cabecera
      var header = crear('div', 'acordeon-header');
      header.setAttribute('tabindex', '0');
      header.setAttribute('role', 'button');
      header.setAttribute('aria-expanded', gIndex === 0 ? 'true' : 'false');
      var titulo = crear('div', null, grupo.cliente + ' (' + grupo.tickets.length + ' tickets)');
      var icono = crear('div', null, gIndex === 0 ? '▲' : '▼');
      header.appendChild(titulo);
      header.appendChild(icono);
      
      // Contenido (Tabla)
      var content = crear('div', 'acordeon-content');
      var tabla = crear('table', 'tabla-logs');
      tabla.style.width = '100%';
      tabla.style.borderCollapse = 'collapse';
      
      // Thead
      var thead = crear('thead');
      var trHead = crear('tr');
      ['Clave', 'Resumen', 'Estado', 'Creado'].forEach(function(c) {
        trHead.appendChild(crear('th', null, c));
      });
      thead.appendChild(trHead);
      tabla.appendChild(thead);
      
      // Tbody
      var tbody = crear('tbody');
      grupo.tickets.forEach(function(ticket) {
        var tr = crear('tr', 'fila-log');
        
        // Key con enlace
        var tdKey = crear('td');
        var aKey = crear('a');
        aKey.href = 'https://wetcom.atlassian.net/browse/' + ticket.key;
        aKey.target = '_blank';
        aKey.textContent = ticket.key;
        aKey.style.color = '#2563eb';
        aKey.style.textDecoration = 'none';
        aKey.style.fontWeight = '600';
        tdKey.appendChild(aKey);
        tr.appendChild(tdKey);
        
        // Summary
        tr.appendChild(crear('td', null, ticket.summary));
        
        // Status Badge
        var tdStatus = crear('td');
        var colorClase = 'blue-gray';
        if (ticket.statusCategory === 'yellow') colorClase = 'yellow';
        else if (ticket.statusCategory === 'green') colorClase = 'green';
        tdStatus.appendChild(crear('span', 'badge-jira ' + colorClase, ticket.status));
        tr.appendChild(tdStatus);
        
        // Created Date
        var d = new Date(ticket.created);
        var fFecha = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        tr.appendChild(crear('td', null, fFecha));
        
        tbody.appendChild(tr);
      });
      tabla.appendChild(tbody);
      
      // Envolver tabla en un div con overflow
      var overflowDiv = crear('div', 'table-responsive');
      overflowDiv.appendChild(tabla);
      content.appendChild(overflowDiv);
      
      item.appendChild(header);
      item.appendChild(content);
      
      // Lógica de colapso con soporte de teclado
      var toggleAcordeon = function() {
        var isOpen = content.classList.contains('open');
        content.classList.toggle('open');
        header.setAttribute('aria-expanded', !isOpen ? 'true' : 'false');
        icono.textContent = !isOpen ? '▲' : '▼';
      };
      header.addEventListener('click', toggleAcordeon);
      header.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleAcordeon();
        }
      });
      
      // Expandir el primer acordeón por defecto
      if (gIndex === 0) {
        content.classList.add('open');
      }
      
      contenedor.appendChild(item);
    });
  }

  // --- Arranque -----------------------------------------------------------------------------

  el.btnCiclo.addEventListener('click', function () { lanzarCiclo(false); });
  el.btnActualizar.addEventListener('click', actualizarBandeja);
  
  // Listeners para filtros de bandeja
  document.getElementById('filtroCliente').addEventListener('change', pintarBandeja);
  document.getElementById('filtroBuscar').addEventListener('keyup', pintarBandeja);
  
  // Listeners de Logs
  var selectEntornoLogs = document.getElementById('filtroEntornoLogs');
  if (selectEntornoLogs) {
    selectEntornoLogs.addEventListener('change', function() {
      cargarLogs();
      if (matrizGlobal) cargarMatrizSalud();
    });
  }
  var filtroCliLogs = document.getElementById('filtroClienteLogs');
  if (filtroCliLogs) filtroCliLogs.addEventListener('change', pintarTabActivo);
  
  var filtroPodLogs = document.getElementById('filtroPodLogs');
  if (filtroPodLogs) filtroPodLogs.addEventListener('change', pintarTabActivo);

  var filtroReincLogs = document.getElementById('filtroReincidenteLogs');
  if (filtroReincLogs) filtroReincLogs.addEventListener('change', pintarTabActivo);

  var filtroFecha = document.getElementById('filtroFechaEnvio');
  if (filtroFecha) filtroFecha.addEventListener('change', pintarTabActivo);

  var filtroBuscarLogs = document.getElementById('filtroBuscarLogs');
  if (filtroBuscarLogs) filtroBuscarLogs.addEventListener('keyup', pintarTabActivo);

  var btnExportar = document.getElementById('btnExportarLogs');
  if (btnExportar) btnExportar.addEventListener('click', exportarCSVActual);

  document.getElementById('btnActualizarLogs').addEventListener('click', cargarLogs);
  var tabButtons = document.querySelectorAll('#seccion-logs .tab-btn');
  for (var k = 0; k < tabButtons.length; k++) {
    tabButtons[k].addEventListener('click', cambiarTabLogs);
  }

  // Listeners de Salud Operativa
  var btnActMatriz = document.getElementById('btnActualizarMatriz');
  if (btnActMatriz) btnActMatriz.addEventListener('click', cargarMatrizSalud);

  var subtabsOp = document.querySelectorAll('#seccion-operaciones .tab-btn');
  for (var s = 0; s < subtabsOp.length; s++) {
    subtabsOp[s].addEventListener('click', cambiarSubtabOperaciones);
  }

  var fPeriodoMatriz = document.getElementById('filtroPeriodoMatriz');
  if (fPeriodoMatriz) fPeriodoMatriz.addEventListener('change', cargarMatrizSalud);

  var fPodMatriz = document.getElementById('filtroPodMatriz');
  if (fPodMatriz) fPodMatriz.addEventListener('change', pintarMatrizSalud);

  var fEstMatriz = document.getElementById('filtroEstadoMatriz');
  if (fEstMatriz) fEstMatriz.addEventListener('change', pintarMatrizSalud);

  var fBusqMatriz = document.getElementById('filtroBuscarMatriz');
  if (fBusqMatriz) fBusqMatriz.addEventListener('keyup', pintarMatrizSalud);

  // Modal Detalle de Cliente
  var btnCerrarModal = document.getElementById('btnCerrarModalCliente');
  if (btnCerrarModal) btnCerrarModal.addEventListener('click', cerrarModalCliente);

  var modalOverlay = document.getElementById('modalDetalleCliente');
  if (modalOverlay) {
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === this) cerrarModalCliente();
    });
  }

  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') cerrarModalCliente();
  });
  
  // --- Navegación Principal ------------------------------------------------------------------
  
  function cambiarSeccionPrincipal(e) {
    var targetId = e.currentTarget.getAttribute('data-seccion');
    
    // Ocultar todas las secciones
    var vistas = document.querySelectorAll('.vista-seccion');
    for (var i = 0; i < vistas.length; i++) {
      vistas[i].classList.remove('active');
    }
    
    // Desmarcar todos los botones
    var navBtns = document.querySelectorAll('.nav-btn');
    for (var j = 0; j < navBtns.length; j++) {
      navBtns[j].classList.remove('active');
      navBtns[j].setAttribute('aria-selected', 'false');
    }
    
    // Mostrar la sección objetivo y marcar el botón
    var targetEl = document.getElementById(targetId);
    if (targetEl) targetEl.classList.add('active');
    e.currentTarget.classList.add('active');
    e.currentTarget.setAttribute('aria-selected', 'true');

    // Carga perezosa automática al ingresar por primera vez
    if (targetId === 'seccion-operaciones' && !matrizGlobal) {
      cargarMatrizSalud();
    } else if (targetId === 'seccion-logs' && !logsGlobales) {
      cargarLogs();
    }
  }

  var mainNavButtons = document.querySelectorAll('.nav-btn');
  for (var m = 0; m < mainNavButtons.length; m++) {
    mainNavButtons[m].addEventListener('click', cambiarSeccionPrincipal);
  }

  // Listener Jira
  document.getElementById('btnCargarJira').addEventListener('click', cargarJira);

  // --- Reportes Analíticos ------------------------------------------------------------------
  
  google.charts.load('current', {'packages':['corechart', 'bar']});
  
  document.getElementById('btnCargarReportes').addEventListener('click', function() {
    var btn = this;
    var projectKey = document.getElementById('filtroClienteReportes').value;
    var rango = document.getElementById('filtroTiempoReportes').value;
    
    ocupar(btn, 'Consultando...');
    document.getElementById('avisoReportes').hidden = true;
    document.getElementById('contenedorReportesVacio').style.display = 'none';
    document.getElementById('contenedorReportesDatos').style.display = 'none';
    
    google.script.run
      .withSuccessHandler(function(datos) {
        liberar(btn);
        pintarReportesAnaliticos(datos);
      })
      .withFailureHandler(function(error) {
        liberar(btn);
        mostrarAviso(document.getElementById('avisoReportes'), 'error', 'No se pudieron consultar los reportes: ' + error.message);
      })
      .webapp_obtenerDatosGraficosJira(projectKey, rango);
  });

  function pintarReportesAnaliticos(datos) {
    document.getElementById('contenedorReportesDatos').style.display = 'block';
    
    // Torta: Ops vs Soporte
    var dataPie = google.visualization.arrayToDataTable([
      ['Tipo', 'Cantidad'],
      ['Operaciones', datos.stats.totalOps],
      ['Soporte', datos.stats.totalSop]
    ]);
    var optionsPie = {
      pieHole: 0.4,
      colors: ['#109E58', '#3b82f6'],
      legend: { position: 'bottom' },
      chartArea: { width: '90%', height: '80%' }
    };
    var chartPie = new google.visualization.PieChart(document.getElementById('piechart_div'));
    chartPie.draw(dataPie, optionsPie);
    
    // Barras: Por tecnología
    var arrBarras = [['Tecnología', 'Operaciones', 'Soporte']];
    datos.stats.barras.forEach(function(b) {
      arrBarras.push([b.tecnologia, b.ops, b.sop]);
    });
    var dataBar = google.visualization.arrayToDataTable(arrBarras);
    var optionsBar = {
      bars: 'vertical',
      colors: ['#109E58', '#3b82f6'],
      legend: { position: 'top' },
      chartArea: { width: '80%', height: '70%' },
      hAxis: { title: 'Tecnología' },
      vAxis: { title: 'Tickets' }
    };
    var chartBar = new google.charts.Bar(document.getElementById('barchart_div'));
    chartBar.draw(dataBar, google.charts.Bar.convertOptions(optionsBar));

    // Tablas
    document.getElementById('countOps').textContent = datos.ticketsOps.length;
    renderPaginatedTable(datos.ticketsOps, 'tbodyOps', 'paginacionOps', 1, 8);

    document.getElementById('countSop').textContent = datos.ticketsSop.length;
    renderPaginatedTable(datos.ticketsSop, 'tbodySop', 'paginacionSop', 1, 8);
  }

  function renderPaginatedTable(tickets, tbodyId, paginacionId, pagina, itemsPorPagina) {
    var tbody = document.getElementById(tbodyId);
    var paginacion = document.getElementById(paginacionId);
    vaciar(tbody);
    vaciar(paginacion);

    var totalPaginas = Math.ceil(tickets.length / itemsPorPagina);
    if (totalPaginas === 0) totalPaginas = 1;
    if (pagina > totalPaginas) pagina = totalPaginas;

    var inicio = (pagina - 1) * itemsPorPagina;
    var fin = inicio + itemsPorPagina;
    var itemsPagina = tickets.slice(inicio, fin);

    itemsPagina.forEach(function(t) {
      var colorClase = 'blue-gray';
      if (t.statusCategory === 'yellow') colorClase = 'yellow';
      else if (t.statusCategory === 'green') colorClase = 'green';
      
      var badgeHtml = '<span class="badge-jira ' + colorClase + '">' + t.status + '</span>';
      
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><a href="https://wetcom.atlassian.net/browse/' + t.key + '" target="_blank" style="color:#2563eb;">' + t.key + '</a></td><td>' + t.summary + '</td><td>' + badgeHtml + '</td><td>' + new Date(t.created).toLocaleDateString() + '</td>';
      tbody.appendChild(tr);
    });

    if (totalPaginas > 1) {
      var createBtn = function(texto, pageNum, isActive, isDisabled) {
        var btn = document.createElement('button');
        btn.innerHTML = texto;
        btn.className = 'btn-paginacion' + (isActive ? ' active' : '');
        btn.disabled = isDisabled;
        if (!isDisabled && !isActive) {
          btn.addEventListener('click', function() {
            renderPaginatedTable(tickets, tbodyId, paginacionId, pageNum, itemsPorPagina);
          });
        }
        paginacion.appendChild(btn);
      };

      createBtn('&laquo;', pagina - 1, false, pagina === 1);
      
      var pages = [];
      for (var i = 1; i <= totalPaginas; i++) {
        if (i === 1 || i === totalPaginas || (i >= pagina - 1 && i <= pagina + 1)) {
          pages.push(i);
        }
      }
      
      var lastP = 0;
      pages.forEach(function(p) {
        if (lastP + 1 < p) {
          var span = document.createElement('span');
          span.innerHTML = '&hellip;';
          span.style.padding = '4px 4px';
          span.style.color = '#6b7280';
          paginacion.appendChild(span);
        }
        createBtn(p, p, p === pagina, false);
        lastP = p;
      });

      createBtn('&raquo;', pagina + 1, false, pagina === totalPaginas);
    }
  }

  pintarEncabezado();
  pintarBandeja();

  // Los textos son relativos ("hace 12 minutos"): sin esto, una pestaña abierta toda la mañana
  // seguiría diciendo "recién".
  setInterval(function () {
    pintarUltimoLanzamiento();
    pintarContextoBandeja();
  }, 60000);
})();
</script>
