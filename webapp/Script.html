<script>
/*
  Cliente del panel de Operaciones.

  Todo el contenido variable se inserta con textContent y nunca con innerHTML: los asuntos y
  los nombres de adjunto vienen de correos externos y son, literalmente, texto que escribió
  otra persona. Construir los nodos a mano es la forma barata de que eso no pueda ejecutarse.
*/
(function () {
  'use strict';

  var estado = window.ESTADO_INICIAL || {};

  var el = {
    usuario:    document.getElementById('usuario'),
    casilla:    document.getElementById('casilla'),
    contexto:   document.getElementById('contexto'),
    btnCiclo:   document.getElementById('btnCiclo'),
    avisoCiclo: document.getElementById('avisoCiclo'),
    ultimo:     document.getElementById('ultimoLanzamiento'),
    btnActualizar:   document.getElementById('btnActualizar'),
    contextoBandeja: document.getElementById('contextoBandeja'),
    avisoBandeja:    document.getElementById('avisoBandeja'),
    columnas:        document.getElementById('columnas')
  };

  // --- Utilidades ---------------------------------------------------------------------------

  function crear(tag, clase, texto) {
    var nodo = document.createElement(tag);
    if (clase) nodo.className = clase;
    if (texto !== undefined && texto !== null) nodo.textContent = texto;
    return nodo;
  }

  function vaciar(nodo) {
    while (nodo.firstChild) nodo.removeChild(nodo.firstChild);
  }

  function pildora(contenedor, texto, clase) {
    contenedor.appendChild(crear('span', 'pildora' + (clase ? ' ' + clase : ''), texto));
  }

  /** "hace 4 minutos" / "hace 2 horas": la antigüedad importa más que la hora exacta. */
  function antiguedad(iso) {
    var minutos = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    if (minutos < 1)  return 'recién';
    if (minutos === 1) return 'hace 1 minuto';
    if (minutos < 60) return 'hace ' + minutos + ' minutos';
    var horas = Math.floor(minutos / 60);
    return horas === 1 ? 'hace 1 hora' : 'hace ' + horas + ' horas';
  }

  function ocupar(boton, textoEspera) {
    boton.disabled = true;
    // Solo se guarda el texto la PRIMERA vez. Si se llama dos veces seguidas sin liberar en el
    // medio, la segunda guardaría el texto de espera y el botón se quedaría con "Cargando..."
    // para siempre.
    if (!boton.dataset.textoOriginal) boton.dataset.textoOriginal = boton.textContent;
    vaciar(boton);
    boton.appendChild(crear('span', 'hilando'));
    boton.appendChild(document.createTextNode(textoEspera || ''));
  }

  function liberar(boton) {
    boton.disabled = false;
    // Si nunca se ocupó, no hay nada que restaurar: vaciarlo igual le borraría la etiqueta y
    // el botón quedaría en blanco. Pasaba en "Llegada de Reportes", donde el ocupar estaba
    // condicionado a forzar y el liberar no.
    if (!boton.dataset.textoOriginal) return;
    vaciar(boton);
    boton.textContent = boton.dataset.textoOriginal;
  }

  /**
   * Texto legible de un error de google.script.run.
   *
   * No siempre llega un Error con .message: cuando la llamada se corta por tiempo, o el
   * servidor devuelve algo que no se puede serializar, el handler recibe un objeto sin
   * mensaje y concatenarlo a mano imprimía "undefined". Eso dejaba al usuario y a nosotros
   * sin ninguna pista de qué pasó, que es peor que el error en sí.
   */
  function mensajeDeError(err) {
    if (!err) return 'el servidor cortó la llamada sin devolver un motivo (suele ser por tiempo: probá de nuevo).';
    if (typeof err === 'string') return err;
    if (err.message) return err.message;
    try {
      var txt = JSON.stringify(err);
      if (txt && txt !== '{}') return txt;
    } catch (e) {}
    return 'el servidor cortó la llamada sin devolver un motivo (suele ser por tiempo: probá de nuevo).';
  }

  function mostrarAviso(nodo, tipo, texto, acciones) {
    vaciar(nodo);
    nodo.className = 'aviso ' + tipo;
    nodo.appendChild(crear('div', null, texto));
    if (acciones && acciones.length) {
      var fila = crear('div', 'acciones');
      acciones.forEach(function (accion) {
        var boton = crear('button', accion.clase || 'btn-secundario', accion.texto);
        boton.addEventListener('click', accion.alHacerClic);
        fila.appendChild(boton);
      });
      nodo.appendChild(fila);
    }
    nodo.hidden = false;
  }

  // --- Encabezado y contexto ----------------------------------------------------------------

  function pintarEncabezado() {
    el.usuario.textContent = estado.usuario || '';
    el.casilla.textContent = estado.cuenta || 'casilla del deploy';
    el.casilla.title = 'El ciclo y la lectura de correos corren siempre sobre esta casilla, ' +
      'sin importar quién use el panel.';

    vaciar(el.contexto);
    pildora(el.contexto, estado.fecha);
    pildora(el.contexto, 'Ventana operativa ' + estado.ventana.inicio + '–' + estado.ventana.fin + ' hs');

    if (estado.testing) pildora(el.contexto, 'Entorno de PRUEBAS', 'testing');
    if (estado.feriado) pildora(el.contexto, 'Hoy es feriado: el ciclo se omite', 'alerta');
    else if (estado.finDeSemana) pildora(el.contexto, 'Fin de semana: el ciclo se omite', 'alerta');
    else if (!estado.enVentana) pildora(el.contexto, 'Fuera de la ventana automática', 'alerta');
    if (estado.cicloEnCurso) pildora(el.contexto, 'Hay un ciclo corriendo ahora', 'alerta');

    // Renderizar KPIs
    if (estado.kpis) {
      document.getElementById('kpiProcesados').textContent = estado.kpis.procesados;
      document.getElementById('kpiErrores').textContent = estado.kpis.errores;
      document.getElementById('kpiFaltantes').textContent = estado.kpis.faltantes;
    }

    pintarUltimoLanzamiento();

    // Poblar el filtro de Jira
    var selectCliente = document.getElementById('filtroClienteJira');
    if (selectCliente && selectCliente.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.key;
        opt.textContent = c.nombre;
        selectCliente.appendChild(opt);
      });
    }

    // Poblar el filtro de Reportes Analíticos
    var selectReportes = document.getElementById('filtroClienteReportes');
    if (selectReportes && selectReportes.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.key;
        opt.textContent = c.nombre;
        selectReportes.appendChild(opt);
      });
      selectReportes.addEventListener('change', function() {
        document.getElementById('btnCargarReportes').disabled = !this.value;
      });
    }

    // Poblar el filtro de Logs
    var selectLogs = document.getElementById('filtroClienteLogs');
    if (selectLogs && selectLogs.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.nombre.toLowerCase(); // En los logs el cliente viene por nombre
        opt.textContent = c.nombre;
        selectLogs.appendChild(opt);
      });
    }
  }

  function pintarUltimoLanzamiento() {
    var u = estado.ultimoLanzamiento;
    el.ultimo.textContent = u
      ? 'Último lanzamiento manual: ' + u.usuario + ', ' + antiguedad(u.ts) + '.'
      : 'Todavía no se lanzó ningún ciclo a mano desde este panel.';
  }

  // --- Ejecutar el ciclo --------------------------------------------------------------------

  function lanzarCiclo(forzar) {
    ocupar(el.btnCiclo, 'Lanzando…');
    el.avisoCiclo.hidden = true;

    google.script.run
      .withSuccessHandler(function (r) {
        liberar(el.btnCiclo);

        if (r.ok) {
          estado.ultimoLanzamiento = r.ultimoLanzamiento;
          pintarUltimoLanzamiento();
          mostrarAviso(el.avisoCiclo, 'ok', r.mensaje);
          return;
        }

        // El ciclo se omite los feriados y fines de semana por diseño. Se puede lanzar igual
        // (queda registrado en las ejecuciones del proyecto), pero conviene decirlo antes.
        if (r.codigo === 'DIA_NO_LABORAL') {
          mostrarAviso(el.avisoCiclo, 'atencion', r.mensaje, [
            { texto: 'Lanzar igual', clase: 'btn-primario', alHacerClic: function () { lanzarCiclo(true); } },
            { texto: 'Cancelar', alHacerClic: function () { el.avisoCiclo.hidden = true; } }
          ]);
          return;
        }

        mostrarAviso(el.avisoCiclo, r.codigo === 'EN_CURSO' ? 'atencion' : 'error', r.mensaje);
      })
      .withFailureHandler(function (error) {
        liberar(el.btnCiclo);
        mostrarAviso(el.avisoCiclo, 'error', 'No se pudo lanzar el ciclo: ' + error.message);
      })
      .webapp_lanzarCiclo(!!forzar);
  }

  // --- Bandeja ------------------------------------------------------------------------------

  function actualizarBandeja() {
    ocupar(el.btnActualizar, 'Leyendo Gmail…');
    el.avisoBandeja.hidden = true;

    google.script.run
      .withSuccessHandler(function (datos) {
        liberar(el.btnActualizar);
        estado.bandeja = datos;
        pintarBandeja();
        pintarContextoBandeja();
      })
      .withFailureHandler(function (error) {
        liberar(el.btnActualizar);
        mostrarAviso(el.avisoBandeja, 'error', 'No se pudo leer la bandeja: ' + error.message);
      })
      .webapp_actualizarBandeja();
  }

  /**
   * Solo la cinta de contexto ("actualizado hace X"). Va aparte del listado a propósito: es lo
   * único que cambia con el paso del tiempo, y repintar las columnas enteras cada minuto le
   * borraría el scroll a quien esté leyendo una lista larga.
   */
  function pintarContextoBandeja() {
    var datos = estado.bandeja;
    vaciar(el.contextoBandeja);
    if (!datos) return;

    pildora(el.contextoBandeja, 'Correos del ' + datos.fecha);
    pildora(el.contextoBandeja, 'Actualizado ' + antiguedad(datos.generado) +
      (datos.generadoPor ? ' por ' + datos.generadoPor : ''));

    if (datos.truncado) {
      var cortadas = (datos.columnas || []).filter(function (c) { return c.truncada; })
        .map(function (c) { return c.titulo; });
      pildora(el.contextoBandeja,
        (cortadas.length ? cortadas.join(' y ') : 'Algunas columnas') +
        ' llegaron al tope de ' + (datos.tope || '?') + ' por columna: hay más correos sin listar',
        'alerta');
    }
  }

  function pintarBandeja() {
    var datos = estado.bandeja;

    pintarContextoBandeja();
    vaciar(el.columnas);

    if (!datos) {
      el.columnas.appendChild(
        crear('p', 'vacio', 'Todavía no hay datos guardados. Tocá "Actualizar" para leer la bandeja de hoy.')
      );
      return;
    }

    // Llenar el dropdown de clientes usando la lista oficial de MASTER_INDEX
    var filtroCli = document.getElementById('filtroCliente');
    if (filtroCli.options.length <= 1 && estado.clientes) {
      estado.clientes.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.nombre.toLowerCase();
        opt.textContent = c.nombre;
        filtroCli.appendChild(opt);
      });
      var optOtros = document.createElement('option');
      optOtros.value = 'otros';
      optOtros.textContent = 'Otros / No identificados';
      filtroCli.appendChild(optOtros);
    }

    var textFiltroCli = filtroCli.value;
    var textFiltroBuscar = document.getElementById('filtroBuscar').value.toLowerCase();

    datos.columnas.forEach(function (columna) {
      el.columnas.appendChild(pintarColumna(columna, datos.items, textFiltroCli, textFiltroBuscar));
    });
  }

  function pintarColumna(columna, items, filtroCli, filtroBuscar) {
    var seccion = crear('div', 'columna');
    seccion.dataset.id = columna.id;

    var idsFiltrados = columna.ids.filter(function(id) {
      var item = items[id];
      if (!item) return false;
      var asuntoLower = item.asunto.toLowerCase();
      
      if (!item._clienteInferido) {
         var encontrado = null;
         if (estado.clientes) {
           for (var i = 0; i < estado.clientes.length; i++) {
              if (asuntoLower.indexOf(estado.clientes[i].nombre.toLowerCase()) !== -1) {
                 encontrado = estado.clientes[i].nombre;
                 break;
              }
           }
         }
         item._clienteInferido = encontrado ? encontrado : 'Otros';
      }
      
      if (filtroCli && filtroCli !== 'otros' && item._clienteInferido.toLowerCase() !== filtroCli) return false;
      if (filtroCli === 'otros' && item._clienteInferido !== 'Otros') return false;
      if (filtroBuscar && asuntoLower.indexOf(filtroBuscar) === -1) return false;
      
      return true;
    });

    var cabecera = crear('header');
    var titulo = crear('div', 'titulo');
    titulo.appendChild(crear('h3', null, columna.titulo));

    var cuentaStr = idsFiltrados.length + (columna.truncada ? '+' : '');
    var cuenta = crear('span', 'cuenta', cuentaStr);
    if (columna.truncada) {
      cuenta.title = 'Hay más correos: la búsqueda se cortó en el tope por columna.';
    }
    titulo.appendChild(cuenta);
    cabecera.appendChild(titulo);
    cabecera.appendChild(crear('p', 'sub', columna.descripcion));
    seccion.appendChild(cabecera);

    if (!idsFiltrados.length) {
      seccion.appendChild(crear('p', 'vacio', 'Sin correos'));
      return seccion;
    }

    var lista = crear('ul', 'lista');
    idsFiltrados.forEach(function (id) {
      var item = items[id];
      lista.appendChild(pintarCorreo(item, columna.id));
    });
    seccion.appendChild(lista);
    return seccion;
  }

    function pintarCorreo(item, columnaId) {
      var li = crear('li', 'correo');
      
      var pAsunto = crear('p', 'asunto', item.asunto);
      if (item.reintentos && item.reintentos > 0) {
        var badgeReintentos = document.createElement('span');
        badgeReintentos.style.background = '#ef4444';
        badgeReintentos.style.color = 'white';
        badgeReintentos.style.fontSize = '10px';
        badgeReintentos.style.padding = '2px 6px';
        badgeReintentos.style.borderRadius = '10px';
        badgeReintentos.style.marginLeft = '8px';
        badgeReintentos.style.verticalAlign = 'middle';
        badgeReintentos.textContent = item.reintentos + ' retries';
        pAsunto.appendChild(badgeReintentos);
      }
      li.appendChild(pAsunto);
  
      var meta = crear('div', 'meta');
    meta.appendChild(crear('span', 'hora', item.hora));
    var remitente = crear('span', null, item.remitente);
    remitente.title = item.remitenteEmail;
    meta.appendChild(remitente);
    if (item.mensajes > 1) meta.appendChild(crear('span', null, item.mensajes + ' mensajes'));
    li.appendChild(meta);

    if (item.adjuntos.length) {
      li.appendChild(crear('p', 'adjuntos', '📎 ' + item.adjuntos.join(' · ')));
    }

    var marcas = crear('div', 'marcas');

    // En la columna de sin leer, la etiqueta [OPS-*] dice si el ciclo ya lo tocó: un correo sin
    // leer Y sin etiqueta es uno que todavía no pasó por el pipeline.
    if (columnaId === 'SIN_LEER' && !item.etiquetas.length) {
      marcas.appendChild(crear('span', 'marca-chip', 'sin procesar'));
    }
    item.etiquetas.forEach(function (nombre) {
      marcas.appendChild(crear('span', 'marca-chip', nombre));
    });

    // El contador de reintentos es el dato de debugging del estado PENDIENTE: dice cuántas
    // vueltas lleva este correo antes de que el ciclo lo aparte a [OPS-ERROR].
    if (item.reintentos > 0) {
      marcas.appendChild(crear('span', 'marca-chip reintentos', 'reintentos: ' + item.reintentos));
    }

    if (marcas.childNodes.length) li.appendChild(marcas);
    return li;
  }

  // --- Logs del Sistema ------------------------------------------------------------------
  var logsGlobales = null;
  var logTabActivo = 'estadoFinal';
  var ordenLogs = { key: null, asc: true };

  function cargarLogs() {
    var btn = document.getElementById('btnActualizarLogs');
    ocupar(btn, 'Cargando logs...');
    document.getElementById('avisoLogs').hidden = true;
    
    var sheetId = null;
    var selectEnv = document.getElementById('filtroEntornoLogs');
    if (selectEnv) sheetId = selectEnv.value;

    google.script.run
      .withSuccessHandler(function(logs) {
        liberar(btn);
        logsGlobales = logs;
        pintarTabActivo();
      })
      .withFailureHandler(function(error) {
        liberar(btn);
        mostrarAviso(document.getElementById('avisoLogs'), 'error', 'No se pudieron cargar los logs: ' + error.message);
      })
      .webapp_obtenerLogs(50, sheetId);
  }

  function cambiarTabLogs(event) {
    if (!event.target.classList.contains('tab-btn')) return;
    
    // Cambiar clase active
    var botones = document.querySelectorAll('.tab-btn');
    for (var i = 0; i < botones.length; i++) {
      botones[i].classList.remove('active');
    }
    event.target.classList.add('active');
    
    // Setear tab activo, resetear orden y renderizar
    logTabActivo = event.target.getAttribute('data-tab');
    ordenLogs = { key: null, asc: true };
    pintarTabActivo();
  }

  function pintarTabActivo() {
    if (!logsGlobales) {
      document.getElementById('tablaLogs').style.display = 'none';
      document.getElementById('logsVacio').style.display = 'block';
      return;
    }

    var thead = document.getElementById('theadLogs');
    var tbody = document.getElementById('tbodyLogs');
    vaciar(thead);
    vaciar(tbody);
    
    var dataRaw = logsGlobales[logTabActivo] || [];
    
    var textFiltroCli = (document.getElementById('filtroClienteLogs') ? document.getElementById('filtroClienteLogs').value : '').trim().toLowerCase();
    var textFiltroBuscar = (document.getElementById('filtroBuscarLogs') ? document.getElementById('filtroBuscarLogs').value : '').trim().toLowerCase();

    var data = dataRaw.filter(function(log) {
      if (textFiltroCli) {
        var cli = (log.cliente || '').toString().trim().toLowerCase();
        if (!cli || (cli.indexOf(textFiltroCli) === -1 && textFiltroCli.indexOf(cli) === -1)) {
          return false;
        }
      }
      if (textFiltroBuscar) {
        var str = JSON.stringify(log).toLowerCase();
        if (str.indexOf(textFiltroBuscar) === -1) return false;
      }
      return true;
    });

    if (ordenLogs.key) {
      data.sort(function(a, b) {
        var valA = a[ordenLogs.key];
        var valB = b[ordenLogs.key];
        
        // Handle empty values safely
        if (valA === undefined || valA === null) valA = '';
        if (valB === undefined || valB === null) valB = '';
        
        if (typeof valA === 'string' && typeof valB === 'string') {
           var r = valA.localeCompare(valB);
           return ordenLogs.asc ? r : -r;
        }
        if (valA > valB) return ordenLogs.asc ? 1 : -1;
        if (valA < valB) return ordenLogs.asc ? -1 : 1;
        return 0;
      });
    }

    if (data.length === 0) {
      document.getElementById('tablaLogs').style.display = 'none';
      document.getElementById('logsVacio').style.display = 'block';
      return;
    }

    document.getElementById('tablaLogs').style.display = 'table';
    document.getElementById('logsVacio').style.display = 'none';

    // Generar cabecera según el tab
    var trCabecera = crear('tr');
    trCabecera.style.borderBottom = '2px solid #eee';
    
    var cabeceras = [];
    if (logTabActivo === 'estadoFinal') {
      cabeceras = [
        { label: 'Hora', key: 'hora' },
        { label: 'Operación', key: 'operacion' },
        { label: 'Cliente', key: 'cliente' },
        { label: 'Estado', key: 'estado' }
      ];
    } else if (logTabActivo === 'erroresScript') {
      cabeceras = [
        { label: 'Hora', key: 'hora' },
        { label: 'Operación', key: 'operacion' },
        { label: 'Cliente', key: 'cliente' },
        { label: '¿Reincidente?', key: 'reincidente' },
        { label: 'Detalle Error', key: 'error' }
      ];
    } else if (logTabActivo === 'envioMails') {
      cabeceras = [
        { label: 'Hora', key: 'horaStr' },
        { label: 'Cliente', key: 'cliente' },
        { label: 'Tecnología', key: 'tecnologia' },
        { label: 'POD', key: 'pod' },
        { label: 'Estado', key: 'estado' },
        { label: 'Tickets', key: 'totalTickets' },
        { label: 'Sop.', key: 'soporte' },
        { label: 'Ops.', key: 'operaciones' }
      ];
    } else if (logTabActivo === 'reportesFaltantes') {
      cabeceras = [
        { label: 'Fecha', key: 'fecha' },
        { label: 'Hora', key: 'hora' },
        { label: 'Operación', key: 'operacion' },
        { label: 'Cliente', key: 'cliente' }
      ];
    } else if (logTabActivo === 'historialComentarios') {
      cabeceras = [
        { label: 'Cuándo', key: 'cuandoTs' },
        { label: 'Quién', key: 'quien' },
        { label: 'Acción', key: 'accion' },
        { label: 'Envío', key: 'cliente' },
        { label: 'Antes → Después', key: 'nuevo' }
      ];
    }
    
    cabeceras.forEach(function(c) {
      var th = crear('th', null);
      th.style.cursor = 'pointer';
      th.style.userSelect = 'none';
      
      var texto = c.label;
      if (ordenLogs.key === c.key) {
         texto += ordenLogs.asc ? ' ▼' : ' ▲';
      }
      th.textContent = texto;
      
      th.addEventListener('click', function() {
         if (ordenLogs.key === c.key) {
            ordenLogs.asc = !ordenLogs.asc;
         } else {
            ordenLogs.key = c.key;
            ordenLogs.asc = true;
         }
         pintarTabActivo();
      });
      
      trCabecera.appendChild(th);
    });
    thead.appendChild(trCabecera);

    // Generar filas
    data.forEach(function(log, i) {
      var tr = crear('tr', 'fila-log');
      
      // Expandir solo si tiene detalles extra
      var tieneDetalle = false;
      if (logTabActivo === 'estadoFinal' && (log.origen || log.ultimoError)) tieneDetalle = true;
      if (logTabActivo === 'erroresScript' && log.error) tieneDetalle = true;
      
      if (tieneDetalle) {
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', function() {
          var detalle = document.getElementById('detalle-log-' + i);
          if (detalle) detalle.style.display = detalle.style.display === 'none' ? 'table-row' : 'none';
        });
      }

      if (logTabActivo === 'estadoFinal') {
        tr.appendChild(crear('td', null, log.hora));
        tr.appendChild(crear('td', null, log.operacion));
        tr.appendChild(crear('td', null, log.cliente || '-'));
        
        var tdEstado = crear('td');
        var badge = 'badge-neutral';
        if (log.estado === 'SUCCESS' || log.estado.indexOf('Resuelto') > -1) badge = 'badge-success';
        else if (log.estado === 'ADVERTENCIA' || log.estado.indexOf('advertencia') > -1) badge = 'badge-warning';
        else if (log.estado === 'ERROR' || log.estado.indexOf('No resuelto') > -1) badge = 'badge-error';
        tdEstado.appendChild(crear('span', badge, log.estado));
        tr.appendChild(tdEstado);
      } 
      else if (logTabActivo === 'erroresScript') {
        tr.appendChild(crear('td', null, log.hora));
        tr.appendChild(crear('td', null, log.operacion));
        tr.appendChild(crear('td', null, log.cliente || '-'));

        var tdReinc = crear('td');
        tdReinc.style.textAlign = 'center';
        if (log.reincidente) {
          tdReinc.appendChild(crear('span', 'badge-reincidente', '⚠ SÍ'));
        } else {
          tdReinc.textContent = 'No';
          tdReinc.style.color = '#9ca3af';
        }
        tr.appendChild(tdReinc);

        var tdErr = crear('td');
        var errTexto = log.error || '-';
        tdErr.textContent = errTexto.length > 75 ? errTexto.substring(0, 75) + '…' : errTexto;
        tdErr.title = errTexto;
        tr.appendChild(tdErr);
      }
      else if (logTabActivo === 'envioMails') {
        tr.appendChild(crear('td', null, log.horaStr));
        tr.appendChild(crear('td', null, log.cliente || '-'));
        tr.appendChild(crear('td', null, log.tecnologia));
        tr.appendChild(crear('td', null, log.pod));
        
        var tdEstado = crear('td');
        var badge = 'badge-neutral';
        if (log.estado === 'Sin Anomalías') badge = 'badge-success';
        else if (log.estado === 'Con Advertencias') badge = 'badge-warning';
        else if (log.estado === 'Con Incidencias') badge = 'badge-error';
        tdEstado.appendChild(crear('span', badge, log.estado));
        tr.appendChild(tdEstado);
        
        tr.appendChild(crear('td', null, log.totalTickets));
        tr.appendChild(crear('td', null, log.soporte));
        tr.appendChild(crear('td', null, log.operaciones));
      }
      else if (logTabActivo === 'reportesFaltantes') {
        tr.appendChild(crear('td', null, log.fecha));
        tr.appendChild(crear('td', null, log.hora));
        tr.appendChild(crear('td', null, log.operacion));
        tr.appendChild(crear('td', null, log.cliente || '-'));
      }
      else if (logTabActivo === 'historialComentarios') {
        var tdCuando = crear('td', null, log.cuando);
        tdCuando.style.whiteSpace = 'nowrap';
        tr.appendChild(tdCuando);
        tr.appendChild(crear('td', null, nombreOperador(log.quien)));
        var tdAccion = crear('td');
        var claseAccion = log.accion === 'Borrado' ? 'badge-error' : (log.accion === 'Editado' ? 'badge-warning' : 'badge-success');
        tdAccion.appendChild(crear('span', 'badge ' + claseAccion, log.accion));
        tr.appendChild(tdAccion);
        var tdEnvio = crear('td', null, log.fechaEnvio + ' · ' + log.cliente + ' · ' + log.tecnologia);
        tr.appendChild(tdEnvio);
        // Lo que había (rojo, tachado) y lo que quedó (verde). Un alta no tiene "antes" y un
        // borrado no tiene "después".
        var tdCambio = crear('td', 'celda-cambio-comentario');
        if (log.anterior) tdCambio.appendChild(crear('span', 'com-antes', log.anterior));
        if (log.anterior && log.nuevo) tdCambio.appendChild(crear('span', 'com-flecha', ' → '));
        if (log.nuevo) tdCambio.appendChild(crear('span', 'com-nuevo', log.nuevo));
        if (log.excluyeAntes !== log.excluyeDespues && (log.excluyeAntes === 'Sí' || log.excluyeDespues === 'Sí')) {
          var nota = log.excluyeDespues === 'Sí' ? 'pasa a no contar en el promedio' : 'vuelve a contar en el promedio';
          tdCambio.appendChild(crear('div', 'com-nota', nota));
        } else if (log.excluyeDespues === 'Sí') {
          tdCambio.appendChild(crear('div', 'com-nota', 'no cuenta en el promedio'));
        }
        tr.appendChild(tdCambio);
      }
      
      tbody.appendChild(tr);

      // Fila de detalle si aplica
      if (tieneDetalle) {
        var trDetalle = crear('tr', 'fila-detalle');
        trDetalle.id = 'detalle-log-' + i;
        trDetalle.style.display = 'none';
        
        var tdWrap = crear('td');
        tdWrap.colSpan = cabeceras.length;
        var divDetalle = crear('div', 'detalle-contenido');
        
        if (logTabActivo === 'estadoFinal') {
          var badges = crear('div', 'metadata-badges');
          
          var bOrigen = crear('span', 'badge-info');
          bOrigen.innerHTML = '<strong>Origen:</strong> ' + (log.origen || '-');
          var bIntentos = crear('span', 'badge-info');
          bIntentos.innerHTML = '<strong>Intentos:</strong> ' + log.intentos;
          var bTickets = crear('span', 'badge-info');
          bTickets.innerHTML = '<strong>Tickets Creados:</strong> ' + log.ticketsCreados;
          
          badges.appendChild(bOrigen);
          badges.appendChild(bIntentos);
          badges.appendChild(bTickets);
          divDetalle.appendChild(badges);

          if (log.ultimoError) {
            var errorWrap = crear('div', 'error-formateado');
            var partes = log.ultimoError.split(' | ');
            partes.forEach(function(p) {
              var lin = crear('div', 'error-bloque', '• ' + p.trim());
              errorWrap.appendChild(lin);
            });
            divDetalle.appendChild(errorWrap);
          }
        } else if (logTabActivo === 'erroresScript') {
          if (log.error) {
            var errorWrap = crear('div', 'error-formateado');
            
            var badgesErr = crear('div', 'metadata-badges');
            if (log.origen) {
              var bOrigen = crear('span', 'badge-info');
              bOrigen.innerHTML = '<strong>Origen:</strong> ' + log.origen;
              badgesErr.appendChild(bOrigen);
            }
            if (log.reincidente) {
              var bReinc = crear('span', 'badge-reincidente');
              bReinc.textContent = '⚠ Reincidente (este error ya ocurrió con anterioridad)';
              badgesErr.appendChild(bReinc);
            }
            if (badgesErr.childNodes.length > 0) {
              errorWrap.appendChild(badgesErr);
            }

            var pre = crear('pre', null, log.error);
            pre.style.whiteSpace = 'pre-wrap';
            pre.style.wordBreak = 'break-word';
            pre.style.margin = '10px 0 0 0';
            pre.style.fontFamily = 'monospace';
            pre.style.fontSize = '12px';
            pre.style.color = '#dc2626';
            pre.style.background = '#fef2f2';
            pre.style.padding = '12px';
            pre.style.borderRadius = '6px';
            pre.style.border = '1px solid #fecaca';
            errorWrap.appendChild(pre);
            
            divDetalle.appendChild(errorWrap);
          }
        }
        
        tdWrap.appendChild(divDetalle);
        trDetalle.appendChild(tdWrap);
        tbody.appendChild(trDetalle);
      }
    });
  }

  function cargarJira() {
    var btn = document.getElementById('btnCargarJira');
    var rango = document.getElementById('filtroTiempoJira').value;
    var projectKey = document.getElementById('filtroClienteJira').value;
    ocupar(btn, 'Consultando Jira...');
    document.getElementById('avisoJira').hidden = true;

    google.script.run
      .withSuccessHandler(function(datosAgrupados) {
        liberar(btn);
        pintarJira(datosAgrupados);
      })
      .withFailureHandler(function(error) {
        liberar(btn);
        mostrarAviso(document.getElementById('avisoJira'), 'error', 'No se pudieron consultar los tickets: ' + error.message);
      })
      .webapp_obtenerTicketsJira(rango, projectKey);
  }

  function pintarJira(datosAgrupados) {
    var contenedor = document.getElementById('contenedorTicketsJira');
    var vacio = document.getElementById('contenedorJiraVacio');
    vaciar(contenedor);

    if (!datosAgrupados || datosAgrupados.length === 0) {
      vacio.textContent = 'No se encontraron tickets creados por el bot en el rango seleccionado.';
      vacio.style.display = 'block';
      return;
    }
    
    vacio.style.display = 'none';

    datosAgrupados.forEach(function(grupo, gIndex) {
      // Crear Item de Acordeón
      var item = crear('div', 'acordeon-item');
      
      // Cabecera
      var header = crear('div', 'acordeon-header');
      var titulo = crear('div', null, grupo.cliente + ' (' + grupo.tickets.length + ' tickets)');
      var icono = crear('div', null, '▼');
      header.appendChild(titulo);
      header.appendChild(icono);
      
      // Contenido (Tabla)
      var content = crear('div', 'acordeon-content');
      var tabla = crear('table', 'tabla-logs');
      tabla.style.width = '100%';
      tabla.style.borderCollapse = 'collapse';
      
      // Thead
      var thead = crear('thead');
      var trHead = crear('tr');
      ['Clave', 'Resumen', 'Estado', 'Creado'].forEach(function(c) {
        trHead.appendChild(crear('th', null, c));
      });
      thead.appendChild(trHead);
      tabla.appendChild(thead);
      
      // Tbody
      var tbody = crear('tbody');
      grupo.tickets.forEach(function(ticket) {
        var tr = crear('tr', 'fila-log');
        
        // Key con enlace
        var tdKey = crear('td');
        var aKey = crear('a');
        aKey.href = 'https://wetcom.atlassian.net/browse/' + ticket.key;
        aKey.target = '_blank';
        aKey.textContent = ticket.key;
        aKey.style.color = '#2563eb';
        aKey.style.textDecoration = 'none';
        aKey.style.fontWeight = '600';
        tdKey.appendChild(aKey);
        tr.appendChild(tdKey);
        
        // Summary
        tr.appendChild(crear('td', null, ticket.summary));
        
        // Status Badge
        var tdStatus = crear('td');
        var colorClase = 'blue-gray';
        if (ticket.statusCategory === 'yellow') colorClase = 'yellow';
        else if (ticket.statusCategory === 'green') colorClase = 'green';
        tdStatus.appendChild(crear('span', 'badge-jira ' + colorClase, ticket.status));
        tr.appendChild(tdStatus);
        
        // Created Date
        var d = new Date(ticket.created);
        var fFecha = ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        tr.appendChild(crear('td', null, fFecha));
        
        tbody.appendChild(tr);
      });
      tabla.appendChild(tbody);
      
      // Envolver tabla en un div con overflow
      var overflowDiv = crear('div');
      overflowDiv.style.overflowX = 'auto';
      overflowDiv.appendChild(tabla);
      content.appendChild(overflowDiv);
      
      item.appendChild(header);
      item.appendChild(content);
      
      // Lógica de colapso
      header.addEventListener('click', function() {
        var isOpen = content.classList.contains('open');
        content.classList.toggle('open');
        icono.textContent = isOpen ? '▼' : '▲';
      });
      
      // Expandir el primer acordeón por defecto
      if (gIndex === 0) {
        content.classList.add('open');
        icono.textContent = '▲';
      }
      
      contenedor.appendChild(item);
    });
  }

  var matrizGlobal = null;

  var subtabOperacionesActivo = 'matriz';

  function cambiarSubtabOperaciones(event) {
    var target = event.currentTarget || event.target;
    var subtab = target.getAttribute('data-tab-operaciones');
    if (!subtab) return;

    var botones = document.querySelectorAll('#seccion-operaciones .tab-btn');
    for (var i = 0; i < botones.length; i++) {
      botones[i].classList.remove('active');
      botones[i].setAttribute('aria-selected', 'false');
    }
    target.classList.add('active');
    target.setAttribute('aria-selected', 'true');

    subtabOperacionesActivo = subtab;

    var vMatriz = document.getElementById('vistaSubtabMatriz');
    var vHorarios = document.getElementById('vistaSubtabHorarios');
    var controles = document.getElementById('controlesMatriz');
    var scorecard = document.getElementById('scorecardMatriz');

    if (subtab === 'matriz') {
      if (vMatriz) vMatriz.style.display = 'block';
      if (vHorarios) vHorarios.style.display = 'none';
      if (controles) controles.style.display = 'flex';
      if (scorecard) scorecard.style.display = 'grid';
    } else {
      if (vMatriz) vMatriz.style.display = 'none';
      if (vHorarios) vHorarios.style.display = 'block';
      if (controles) controles.style.display = 'none';
      if (scorecard) scorecard.style.display = 'none';
      // Se carga recién la primera vez que se abre la pestaña: si nadie la mira, no gasta nada.
      if (!horariosGlobal) {
        cargarHorarios(false);
      } else {
        pintarHorarios();
      }
    }
  }

  function cargarMatrizSalud(forzar) {
    var btn = document.getElementById('btnActualizarMatriz');
    if (btn) ocupar(btn, 'Actualizando...');
    var aviso = document.getElementById('avisoMatriz');
    if (aviso) aviso.hidden = true;

    var selectEnv = document.getElementById('filtroEntornoMatriz') || document.getElementById('filtroEntornoLogs');
    var sheetId = (selectEnv && selectEnv.value) ? selectEnv.value : '1O-iTAhWRonBcAp3xN7t5_y_TZTvyAtoBP0TIVAIzweQ';

    google.script.run
      .withSuccessHandler(function(datos) {
        if (btn) liberar(btn);
        matrizGlobal = datos;
        // Envíos de Hoy trae solo los de hoy: se reemplazan los de hoy y se deja el resto.
        Object.keys(comentariosGlobal).forEach(function(k) {
          if (k.indexOf(datos.fechaISO + '|') === 0) delete comentariosGlobal[k];
        });
        registrarComentarios(datos.comentarios);
        pintarMatrizSalud();
        if (datos && datos.manualesError) {
          mostrarAviso(aviso, 'atencion', 'No se pudieron leer los envíos a mano (alarmas@ en copia): ' +
            datos.manualesError + '. GIRE y Tanzu pueden figurar como no enviados aunque hayan salido.');
        }
      })
      .withFailureHandler(function(err) {
        if (btn) liberar(btn);
        mostrarAviso(aviso, 'error', 'No se pudo cargar el semáforo de envíos: ' + mensajeDeError(err));
      })
      .webapp_obtenerMatrizEnvios(sheetId, forzar === true);
  }

  function pintarMatrizSalud() {
    if (!matrizGlobal) return;

    var filtroPod = document.getElementById('filtroPodMatriz') ? document.getElementById('filtroPodMatriz').value.toUpperCase().trim() : '';
    var filtroEstado = document.getElementById('filtroEstadoMatriz') ? document.getElementById('filtroEstadoMatriz').value : '';
    var filtroBuscar = document.getElementById('filtroBuscarMatriz') ? document.getElementById('filtroBuscarMatriz').value.toLowerCase().trim() : '';

    var clientesFiltrados = (matrizGlobal.clientes || []).filter(function(cli) {
      if (filtroPod) {
        var p = (cli.pod || '').toUpperCase().replace(/\s+/g, '');
        var fp = filtroPod.replace(/\s+/g, '');
        if (p !== fp) return false;
      }
      if (filtroEstado === 'pendientes' && cli.pendientes === 0) return false;
      if (filtroEstado === 'completos' && cli.pendientes > 0) return false;
      if (filtroBuscar) {
        var textoOps = (cli.operadores || []).map(nombreOperador).join(' ').toLowerCase();
        if (cli.cliente.toLowerCase().indexOf(filtroBuscar) === -1 && textoOps.indexOf(filtroBuscar) === -1) return false;
      }
      return true;
    });

    // Actualizar Scorecards según los clientes mostrados
    var scTot = document.getElementById('scTotalClientes');
    var scPend = document.getElementById('scConPendientes');
    var scComp = document.getElementById('scCompletos');
    var scPct = document.getElementById('scPctCompletos');

    var tot = clientesFiltrados.length;
    var pend = 0, comp = 0;
    clientesFiltrados.forEach(function(c) {
      if (c.pendientes > 0) pend++;
      else comp++;
    });
    var pctCompletos = tot > 0 ? Math.round((comp / tot) * 100) : 100;

    if (scTot) scTot.textContent = tot;
    if (scPend) scPend.textContent = pend;
    if (scComp) scComp.textContent = comp;
    if (scPct) scPct.textContent = pctCompletos + '%';

    var thead = document.getElementById('theadMatriz');
    var tbody = document.getElementById('tbodyMatriz');
    var vacio = document.getElementById('matrizVacio');
    vaciar(thead);
    vaciar(tbody);

    if (clientesFiltrados.length === 0) {
      if (vacio) vacio.style.display = 'block';
      return;
    }
    if (vacio) vacio.style.display = 'none';

    // Thead
    var trHead = crear('tr');
    var thCli = crear('th', 'th-cliente', 'Cliente');
    var thOp = crear('th', null, 'Operador');
    var thPod = crear('th', null, 'POD');
    trHead.appendChild(thCli);
    trHead.appendChild(thOp);
    trHead.appendChild(thPod);

    (matrizGlobal.tecnologias || []).forEach(function(tech) {
      var th = crear('th', null, tech);
      trHead.appendChild(th);
    });

    var thGeneral = crear('th', null, 'Estado General');
    trHead.appendChild(thGeneral);
    thead.appendChild(trHead);

    // Tbody
    clientesFiltrados.forEach(function(cli) {
      // La fila ya no es clickeable: el desglose de cómo terminó cada operación (tickets,
      // errores, advertencias) vive en "Logs del Sistema > Envío de Mails", que es su lugar.
      // Tenerlo también acá era la duplicación que hacía que esta pestaña respondiera dos
      // preguntas a la vez y ninguna bien.
      var tr = crear('tr', 'matriz-row');

      var tdCli = crear('td', null, cli.cliente);
      tdCli.style.fontWeight = '600';
      tr.appendChild(tdCli);

      // Quién operó hoy: el que tildó en el Índice o el que mandó el mail a mano. Vacío hasta
      // que salga el primer envío del día (o si el envío es anterior a que se registre).
      var ops = (cli.operadores || []).map(nombreOperador);
      var tdOp = crear('td', null, ops.length ? ops.join(', ') : '—');
      if (!ops.length) tdOp.style.color = 'var(--gris-claro)';
      tr.appendChild(tdOp);

      var tdPod = crear('td');
      tdPod.style.textAlign = 'center';
      if (cli.pod) {
        var pild = crear('span', 'pildora', cli.pod);
        pild.style.fontSize = '11px';
        tdPod.appendChild(pild);
      } else {
        tdPod.textContent = '-';
      }
      tr.appendChild(tdPod);

      (matrizGlobal.tecnologias || []).forEach(function(tech) {
        var td = crear('td', 'celda-tech');
        var tData = cli.tecnologias ? cli.tecnologias[tech] : null;
        var pill = crear('span', 'tech-pill');

        // RVTools tiene dos estados más que los mails, y los dos existen para no pintar de
        // rojo algo que no está mal:
        //   - "?" (enviado === null): no se pudo verificar. "No pude fijarme" y "no llegó"
        //     mandan al equipo a hacer cosas distintas, así que no pueden verse igual.
        //   - "⏳" (pendienteEnVentana): falta, pero es miércoles o jueves y la ventana de
        //     subida (mié a vie) sigue abierta.
        var comoFue = tData ? tData.fuente : null;
        var origenTxt = comoFue === 'drive' ? 'carpeta semanal en Drive' : 'mail al POD';
        var detalleTxt = (tData && tData.detalle) ? '. ' + tData.detalle : '';

        if (!tData || !tData.contratado) {
          pill.classList.add('status-none');
          pill.textContent = '—';
          pill.title = tech + ': no contratado por este cliente';
        } else if (tData.enviado === null || tData.enviado === undefined) {
          // null o ausente: ninguno de los dos es "no se envió".
          pill.classList.add('status-warn');
          pill.textContent = '?';
          pill.title = tech + ': sin dato' + detalleTxt + '. NO significa que no se haya subido.';
        } else if (tData.enviado === true) {
          pill.classList.add('status-ok');
          // La hora es el dato que evita tener que preguntar. Se recorta a HH:mm porque los
          // segundos no aportan y hacen la celda ilegible.
          var horaCorta = tData.hora ? String(tData.hora).substring(0, 5) : '';
          pill.textContent = horaCorta ? '✅ ' + horaCorta : '✅';
          pill.title = tech + ': enviado' + (tData.hora ? ' a las ' + tData.hora : '') + ' (' + origenTxt + ')' + detalleTxt;
          // RVTools: el archivo puede estar subido y aun así no abrirse. La lupa distingue
          // "la carpeta está" de "además los abrimos y tienen datos".
          if (tech === 'RVTools' && tData.archivosVerificados) {
            pill.textContent = '✅🔍';
            pill.title = 'RVTools: archivos revisados, abren y tienen datos' + detalleTxt;
          }
        } else if (tData.alertaArchivos) {
          // El archivo está en Drive pero no se pudo leer. No es "no lo subieron": el equipo
          // tiene que ir a mirarlo y volver a exportarlo, así que va en amarillo y no en rojo.
          pill.classList.add('status-warn');
          pill.textContent = '⚠️';
          pill.title = 'RVTools: posible archivo corrupto. Está subido pero no se pudo abrir o no tiene los datos esperados' + detalleTxt;
        } else if (tData.pendienteEnVentana) {
          pill.classList.add('status-warn');
          pill.textContent = '⏳';
          pill.title = tech + ': pendiente' + detalleTxt;
        } else {
          pill.classList.add('status-err');
          pill.textContent = '❌';
          pill.title = tech + ': todavía NO se envió (' + origenTxt + ')' + detalleTxt;
        }

        // Corregido a mano: el estado de arriba lo puso una persona, no el sistema. Se avisa
        // en el tooltip y con un borde distinto, para que nadie lea un ✅ como "el log lo vio".
        if (tData && tData.correccion) {
          pill.classList.add('corregido-a-mano');
          pill.title = tech + ': marcado a mano como ' +
            (tData.correccion.estado === 'enviado' ? 'ENVIADO' : 'NO enviado') +
            ' por ' + nombreOperador(tData.correccion.autor) +
            (tData.correccion.actualizado ? ' (' + tData.correccion.actualizado + ')' : '') +
            '. Motivo: ' + tData.correccion.motivo;
        }

        // La celda es editable: si el mail salió pero nadie puso a alarmas@ en copia, el
        // semáforo no se entera y hasta ahora no había forma de arreglarlo.
        if (tData && tData.contratado && matrizGlobal.fechaISO) {

  // --- Histórico de Horarios -----------------------------------------------------------------
  // El servidor manda los envíos crudos del último año (primer envío de cada día hábil) y
  // todo lo demás —período, filtros, promedios, gráfico— se calcula acá. Cambiar un filtro no
  // gasta una sola ejecución de Apps Script.
  //
  // La pantalla, el PDF y el resumen de Slack salen de las MISMAS tres funciones
  // (filtrarEnviosHorarios, agregarHorarios, serieHorarios). Si cada salida calculara su
  // promedio por su lado, el día que alguien toque una el PDF y la pantalla dirían horas
  // distintas para el mismo cliente (AGENTS.md §5).

  // --- Comentarios por envío -----------------------------------------------------------------
  // Un comentario por cliente × tecnología × día. Se cargan con Envíos de Hoy (los de hoy) y con
  // el Histórico (todos), y viven en este mapa: las dos pantallas, el PDF y Slack leen lo mismo.
  var comentariosGlobal = {};

  function claveComentario(fecha, clave, tech) { return fecha + '|' + clave + '|' + tech; }

  function registrarComentarios(lista) {
    (lista || []).forEach(function(c) { comentariosGlobal[claveComentario(c.fecha, c.clave, c.tecnologia)] = c; });
  }

  function comentarioDe(fecha, claves, tech) {
    for (var i = 0; i < claves.length; i++) {
      var c = comentariosGlobal[claveComentario(fecha, claves[i], tech)];
      if (c) return c;
    }
    return null;
  }

  function sheetIdLogsActual() {
    var sel = document.getElementById('filtroEntornoMatriz') || document.getElementById('filtroEntornoLogs');
    return (sel && sel.value) ? sel.value : '1O-iTAhWRonBcAp3xN7t5_y_TZTvyAtoBP0TIVAIzweQ';
  }

      : 'Agregar un comentario sobre este día';
    btn.addEventListener('click', function(ev) {
      ev.stopPropagation();
      abrirModalComentario({ fecha: fecha, cliente: cliente, clave: actual ? actual.clave : claves[0], tecnologia: tech, actual: actual });
    });

  /** Clave de cliente del Histórico a partir de su nombre. */
  function claveDeCliente(nombre) {
    var cli = (horariosGlobal.clientes || []).filter(function(c) { return c.nombre === nombre; })[0];
    return cli ? cli.clave : '';
  }

  /** Comentarios de un cliente en el período, listos para el PDF y Slack. */
  function novedadesDe(clave, desdeIso, hastaIso, techFiltro) {
    var datos = horariosGlobal;
    var out = [];
    Object.keys(comentariosGlobal).forEach(function(k) {
      var c = comentariosGlobal[k];
      if (c.clave !== clave || c.fecha < desdeIso || c.fecha > hastaIso) return;
      if (techFiltro && c.tecnologia !== techFiltro) return;
      var envio = datos.envios.filter(function(e) {
        return e[0] === c.fecha && datos.clientes[e[1]].clave === clave && datos.tecnologias[e[2]] === c.tecnologia;
      })[0];
      out.push({ fechaIso: c.fecha, fecha: isoACorta(c.fecha), tech: c.tecnologia,
        hora: envio ? minutosAHora(envio[3]) : null, tarde: envio ? envio[3] > datos.limiteMinutos : false,
        texto: c.comentario, excluido: !!c.excluir });
    });
    out.sort(function(a, b) { return (a.fechaIso + a.tech).localeCompare(b.fechaIso + b.tech); });
    return out;
  }

  function cargarHorarios(forzar) {
    var btn = document.getElementById('btnActualizarMatriz');
    if (btn && forzar) ocupar(btn, 'Actualizando...');
    var aviso = document.getElementById('avisoHorarios');
    if (aviso) aviso.hidden = true;

    var selectEnv = document.getElementById('filtroEntornoMatriz') || document.getElementById('filtroEntornoLogs');
    var sheetId = (selectEnv && selectEnv.value) ? selectEnv.value : '1O-iTAhWRonBcAp3xN7t5_y_TZTvyAtoBP0TIVAIzweQ';

    google.script.run
      .withSuccessHandler(function(datos) {
        if (btn && forzar) liberar(btn);
        horariosGlobal = datos;
        // El Histórico trae TODOS los comentarios: reemplaza el mapa entero (así un comentario
        // que alguien borró desde otra computadora desaparece acá también).
        comentariosGlobal = {};
        registrarComentarios(datos.comentarios);
        poblarFiltrosHorarios();
        pintarHorarios();
        if (datos.manualesError) {
          mostrarAviso(aviso, 'atencion', 'No se pudieron leer los envíos a mano (alarmas@ en copia): ' +
            datos.manualesError + '. Se muestran solo los automáticos.');
        }
      })
      .withFailureHandler(function(err) {
        if (btn && forzar) liberar(btn);
        mostrarAviso(aviso, 'error', 'No se pudieron cargar los horarios de envío: ' + mensajeDeError(err));
      })
      .webapp_obtenerHorariosEnvio(sheetId, !!forzar);
  }

  function poblarFiltrosHorarios() {
    if (!horariosGlobal) return;
    var llenar = function(id, valores) {
      var sel = document.getElementById(id);
      if (!sel) return;
      var actual = sel.value;
      while (sel.options.length > 1) sel.remove(1);
      valores.forEach(function(v) {
        var opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        sel.appendChild(opt);
      });
      if (valores.indexOf(actual) !== -1) sel.value = actual;
    };
    var nombres = horariosGlobal.clientes.map(function(c) { return c.nombre; });
    var pods = [];
    horariosGlobal.clientes.forEach(function(c) {
      if (c.pod && pods.indexOf(c.pod) === -1) pods.push(c.pod);
    });
    var porTexto = function(a, b) { return a.localeCompare(b); };
    llenar('filtroClienteHorarios', nombres.slice().sort(porTexto));
    // Las tecnologías conocidas siempre se pueden elegir, aunque todavía no haya envíos (Tanzu
    // arranca a registrarse con los mails a mano en copia): elegirla y ver "sin envíos" dice más
    // que no encontrarla en la lista.
    var techs = horariosGlobal.tecnologias.slice();
    ORDEN_TECH.forEach(function(t) { if (techs.indexOf(t) === -1) techs.push(t); });
    llenar('filtroTechHorarios', techs.sort(ordenarTechs));
    llenar('filtroPodHorarios', pods.sort(porTexto));

    // Operador: el valor es el mail; lo que se ve, el nombre.
    var selOp = document.getElementById('filtroOperadorHorarios');
    if (selOp) {
      var actualOp = selOp.value;
      while (selOp.options.length > 1) selOp.remove(1);
      (horariosGlobal.operadores || []).slice().sort(function(a, b) {
        return nombreOperador(a).localeCompare(nombreOperador(b));
      }).forEach(function(email) {
        var opt = document.createElement('option');
        opt.value = email;
        opt.textContent = nombreOperador(email);
        selOp.appendChild(opt);
      });
      if ((horariosGlobal.operadores || []).indexOf(actualOp) !== -1) selOp.value = actualOp;
    }
  }

  /** "thiago.chinabro@wetcom.com" -> "Thiago Chinabro". */
  function nombreOperador(email) {
    var local = String(email || '').split('@')[0];
    return local.split(/[._-]+/).filter(function(p) { return p; }).map(function(p) {
      return p.charAt(0).toUpperCase() + p.slice(1);
    }).join(' ') || email;
  }

  function isoADate(iso) {
    var p = iso.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function dateAIso(d) {
    var pad = function(n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function isoACorta(iso) {
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function minutosAHora(min) {
    var t = Math.round(min);
    var h = Math.floor(t / 60), m = t % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  // Un promedio se juzga por el minuto que se muestra: si dice 11:00, no puede estar en rojo.
  function esTardeHorario(prom) {
    return Math.round(prom) > horariosGlobal.limiteMinutos;
  }

  function leerFiltrosHorarios() {
    var sel = document.getElementById('filtroPeriodoHorarios');
    return {
      dias: parseInt(sel.value, 10) || 7,
      periodoTxt: sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '',
      cliente: document.getElementById('filtroClienteHorarios').value,
      tech: document.getElementById('filtroTechHorarios').value,
      pod: document.getElementById('filtroPodHorarios').value,
      operador: document.getElementById('filtroOperadorHorarios') ? document.getElementById('filtroOperadorHorarios').value : ''
    };
  }

  /**
   * Envíos del período que pasan los filtros. "Últimos N días" incluye hoy, y se cuenta
   * desde el "hoy" del servidor (hora Argentina), no desde el reloj del navegador.
   */
  function filtrarEnviosHorarios(f) {
    var datos = horariosGlobal;
    var desde = isoADate(datos.hoy);
    desde.setDate(desde.getDate() - (f.dias - 1));
    var desdeIso = dateAIso(desde);
    var envios = datos.envios.filter(function(e) {
      if (e[0] < desdeIso) return false;
      var cli = datos.clientes[e[1]];
      if (f.cliente && cli.nombre !== f.cliente) return false;
      if (f.pod && cli.pod !== f.pod) return false;
      if (f.tech && datos.tecnologias[e[2]] !== f.tech) return false;
      if (f.operador && (e[4] === undefined || e[4] < 0 || datos.operadores[e[4]] !== f.operador)) return false;
      // Un día marcado "no cuenta en el promedio" sale de todas las métricas (tabla, gráfico,
      // scorecards, PDF, Slack). El historial día por día lo pide igual, para mostrarlo.
      if (!f.incluirExcluidos) {
        var com = comentariosGlobal[claveComentario(e[0], cli.clave, datos.tecnologias[e[2]])];
        if (com && com.excluir) return false;
      }
      return true;
    });
    return { envios: envios, desdeIso: desdeIso, hastaIso: datos.hoy };
  }

  /** Promedio por operación (cliente + tecnología), lo más tarde primero, y totales. */
  function agregarHorarios(envios) {
    var datos = horariosGlobal;
    var limite = datos.limiteMinutos;
    var ops = {};
    var totalMin = 0, totalFuera = 0;
    envios.forEach(function(e) {
      var k = e[1] + '|' + e[2];
      if (!ops[k]) ops[k] = { cli: datos.clientes[e[1]], tech: datos.tecnologias[e[2]], suma: 0, n: 0, fuera: 0 };
      ops[k].suma += e[3];
      ops[k].n++;
      totalMin += e[3];
      if (e[3] > limite) { ops[k].fuera++; totalFuera++; }
    });
    var filas = Object.keys(ops).map(function(k) {
      var o = ops[k];
      o.prom = o.suma / o.n;
      o.tarde = esTardeHorario(o.prom);
      return o;
    });
    filas.sort(function(a, b) { return b.prom - a.prom; });
    return {
      filas: filas,
      n: envios.length,
      fuera: totalFuera,
      prom: envios.length ? totalMin / envios.length : null,
      opsTarde: filas.filter(function(o) { return o.tarde; }).length
    };
  }

  // Un color fijo por tecnología, el mismo en pantalla y en el PDF. Lo que no esté acá
  // (una tecnología nueva que aparezca en el log) sale en gris hasta que se le asigne uno.
  var COLORES_TECH = { vSphere: '#2C6CB0', Veeam: '#109E58', Nutanix: '#7B3FB5', Tanzu: '#E67E22' };
  var ORDEN_TECH = ['vSphere', 'Veeam', 'Nutanix', 'Tanzu'];

  function ordenarTechs(a, b) {
    var ia = ORDEN_TECH.indexOf(a), ib = ORDEN_TECH.indexOf(b);
    if (ia === -1) ia = 99;
    if (ib === -1) ib = 99;
    return ia !== ib ? ia - ib : a.localeCompare(b);
  }

  /**
   * Puntos del gráfico: una línea por tecnología. En semana y mes, un punto por día; en el
   * año, uno por semana (lunes): 250 puntos diarios son ruido, y lo que interesa ahí es la
   * tendencia.
   */
  function serieHorarios(envios, dias) {
    var porSemana = dias > 31;
    var baldes = {};
    var techs = [];
    envios.forEach(function(e) {
      var clave = e[0];
      if (porSemana) {
        var d = isoADate(e[0]);
        d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        clave = dateAIso(d);
      }
      var tech = horariosGlobal.tecnologias[e[2]];
      if (techs.indexOf(tech) === -1) techs.push(tech);
      if (!baldes[clave]) baldes[clave] = {};
      if (!baldes[clave][tech]) baldes[clave][tech] = { suma: 0, n: 0 };
      baldes[clave][tech].suma += e[3];
      baldes[clave][tech].n++;
    });
    techs.sort(ordenarTechs);
    return {
      porSemana: porSemana,
      techs: techs,
      puntos: Object.keys(baldes).sort().map(function(k) {
        var p = k.split('-');
        var prom = {};
        Object.keys(baldes[k]).forEach(function(t) { prom[t] = baldes[k][t].suma / baldes[k][t].n; });
        return { etiqueta: p[2] + '/' + p[1], prom: prom };
      })
    };
  }

  /**
   * Cuánta gente operó: operadores distintos por día (o por semana en el año, igual que el
   * gráfico), lo más reciente arriba. Solo cuentan los envíos con operador conocido.
   */
  function operadoresPorPeriodo(envios, dias) {
    var porSemana = dias > 31;
    var baldes = {};
    envios.forEach(function(e) {
      if (e[4] === undefined || e[4] < 0) return;
      var clave = e[0];
      if (porSemana) {
        var d = isoADate(e[0]);
        d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        clave = dateAIso(d);
      }
      if (!baldes[clave]) baldes[clave] = {};
      baldes[clave][horariosGlobal.operadores[e[4]]] = true;
    });
    return {
      porSemana: porSemana,
      filas: Object.keys(baldes).sort().reverse().map(function(k) {
        var p = k.split('-');
        var nombres = Object.keys(baldes[k]).map(nombreOperador).sort(function(a, b) { return a.localeCompare(b); });
        return { etiqueta: p[2] + '/' + p[1], cantidad: nombres.length, nombres: nombres };
      })
    };
  }

  var DIAS_SEMANA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

  /**
   * Filas del historial de UN cliente, por tecnología: el primer envío de cada día hábil y,
   * entre medio, los días hábiles sin registro. Los días sin registro cuentan solo desde el
   * primer envío que haya de esa tecnología (antes no había log, no es que faltara) y no se
   * muestran si se filtra por operador (un día sin envío no tiene operador).
   */
  function historialPorTecnologia(f, envios) {
    var datos = horariosGlobal;
    var clave = claveDeCliente(f.cliente);
    var primeraFecha = {};
    datos.envios.forEach(function(e) {
      if (datos.clientes[e[1]].nombre !== f.cliente) return;
      var t = datos.tecnologias[e[2]];
      if (!primeraFecha[t] || e[0] < primeraFecha[t]) primeraFecha[t] = e[0];
    });
    var desdeIso = filtrarEnviosHorarios(f).desdeIso;

    var porTech = {};
    envios.forEach(function(e) {
      var t = datos.tecnologias[e[2]];
      if (!porTech[t]) porTech[t] = {};
      porTech[t][e[0]] = e;
    });

    return Object.keys(porTech).sort(ordenarTechs).map(function(t) {
      var filas = [];
      var inicio = primeraFecha[t] > desdeIso ? primeraFecha[t] : desdeIso;
      var d = isoADate(datos.hoy);
      var fin = isoADate(inicio);
      for (; d >= fin; d.setDate(d.getDate() - 1)) {
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        var iso = dateAIso(d);
        var e = porTech[t][iso];
        var com = comentariosGlobal[claveComentario(iso, clave, t)] || null;
        if (e) {
          filas.push({ fecha: iso, dia: DIAS_SEMANA[d.getDay()], minutos: e[3], tarde: e[3] > datos.limiteMinutos,
            operador: e[4] >= 0 ? nombreOperador(datos.operadores[e[4]]) : '—', origen: e[5] === 1 ? 'A mano' : 'Automático',
            comentario: com, excluido: !!(com && com.excluir) });
        } else if (!f.operador) {
          // Hoy sin envío todavía no es "faltó": puede salir más tarde.
          filas.push({ fecha: iso, dia: DIAS_SEMANA[d.getDay()], minutos: null, esHoy: iso === datos.hoy,
            comentario: com, excluido: !!(com && com.excluir) });
        }
      }
      // El resumen cuenta igual que los promedios: sin los días excluidos.
      var enviados = filas.filter(function(x) { return x.minutos !== null && !x.excluido; });
      var tardes = enviados.filter(function(x) { return x.tarde; }).length;
      var suma = enviados.reduce(function(a, x) { return a + x.minutos; }, 0);
      var sinContar = filas.filter(function(x) { return x.excluido; }).length;
      return { tech: t, clave: clave, filas: filas, enviados: enviados.length, tardes: tardes, sinContar: sinContar,
        prom: enviados.length ? suma / enviados.length : null };
    });
  }

  function pintarHistorialCliente(f, envios) {
    var cont = document.getElementById('historialCliente');
    var lista = document.getElementById('historialTechs');
    if (!cont || !lista) return;
    vaciar(lista);
    if (!f.cliente) { cont.style.display = 'none'; return; }
    cont.style.display = 'block';
    var titulo = document.getElementById('tituloHistorialCliente');
    if (titulo) titulo.textContent = 'Historial día por día — ' + f.cliente;

    var techs = historialPorTecnologia(f, envios);
    if (techs.length === 0) {
      lista.appendChild(crear('p', 'ayuda', 'Sin envíos de este cliente en el período.'));
      return;
    }
    techs.forEach(function(h) {
      var det = crear('details', 'historial-tech');
      if (h.tardes > 0) det.open = true;
      var sum = crear('summary', null, h.tech);
      var resumen = h.prom === null ? 'sin envíos que cuenten en el período'
        : 'promedio ' + minutosAHora(h.prom) + ' · ' + h.tardes + ' de ' + h.enviados + ' después de las 11:00';
      if (h.sinContar > 0) resumen += ' · ' + h.sinContar + (h.sinContar === 1 ? ' día no cuenta' : ' días no cuentan');
      var spanRes = crear('span', 'historial-resumen', resumen);
      if (h.tardes > 0) spanRes.style.color = 'var(--rojo)';
      sum.appendChild(spanRes);
      det.appendChild(sum);

      var tabla = crear('table', 'tabla-logs');
      tabla.style.width = '100%';
      var thead = crear('thead');
      var trh = crear('tr');
      ['Fecha', 'Día', 'Hora del envío', 'Operador', 'Origen', 'Comentario'].forEach(function(t) { trh.appendChild(crear('th', null, t)); });
      thead.appendChild(trh);
      tabla.appendChild(thead);
      var tbody = crear('tbody');
      h.filas.forEach(function(x) {
        var tr = crear('tr', x.minutos === null ? 'historial-sin-registro' : null);
        tr.appendChild(crear('td', null, isoACorta(x.fecha)));
        tr.appendChild(crear('td', null, x.dia));
        var tdHora = crear('td');
        if (x.minutos === null) {
          tdHora.textContent = x.esHoy ? 'todavía no salió' : 'sin registro';
        } else {
          var pill = crear('span', 'tech-pill ' + (x.tarde ? 'status-err' : 'status-ok') + (x.excluido ? ' excluido' : ''), minutosAHora(x.minutos));
          if (x.excluido) pill.title = 'No cuenta en el promedio';
          tdHora.appendChild(pill);
          if (x.excluido) tdHora.appendChild(crear('span', 'badge-no-cuenta', 'no cuenta'));
        }
        tr.appendChild(tdHora);
        tr.appendChild(crear('td', null, x.minutos === null ? '' : x.operador));
        tr.appendChild(crear('td', null, x.minutos === null ? '' : x.origen));
        var tdCom = crear('td', 'celda-comentario');
        if (x.comentario) tdCom.appendChild(crear('span', 'texto-comentario', x.comentario.comentario));
        tdCom.appendChild(botonComentario(x.fecha, f.cliente, [h.clave], h.tech));
        tr.appendChild(tdCom);
        tbody.appendChild(tr);
      });
      tabla.appendChild(tbody);
      det.appendChild(tabla);
      lista.appendChild(det);
    });
  }

  function pintarOperadores(envios, dias) {
    var tbody = document.getElementById('tbodyOperadores');
    if (!tbody) return;
    vaciar(tbody);
    var res = operadoresPorPeriodo(envios, dias);
    var th = document.getElementById('thDiaOperadores');
    if (th) th.textContent = res.porSemana ? 'Semana del' : 'Día';
    var titulo = document.getElementById('tituloOperadoresHorarios');
    if (titulo) titulo.textContent = res.porSemana ? 'Operadores por semana' : 'Operadores por día';
    var vacio = document.getElementById('operadoresVacio');
    if (vacio) vacio.style.display = res.filas.length === 0 ? 'block' : 'none';
    var tabla = document.getElementById('tablaOperadores');
    if (tabla) tabla.style.display = res.filas.length === 0 ? 'none' : '';
    res.filas.forEach(function(fila) {
      var tr = crear('tr');
      tr.appendChild(crear('td', null, fila.etiqueta));
      var tdN = crear('td', null, String(fila.cantidad));
      tdN.style.textAlign = 'center';
      tdN.style.fontWeight = '600';
      tr.appendChild(tdN);
      tr.appendChild(crear('td', null, fila.nombres.join(', ')));
      tbody.appendChild(tr);
    });
  }

  function pintarHorarios() {
    if (!horariosGlobal) return;
    var f = leerFiltrosHorarios();
    var envios = filtrarEnviosHorarios(f).envios;
    var agg = agregarHorarios(envios);

    // --- Scorecards ---
    var marcar = function(idCard, idValor, texto, mal) {
      var card = document.getElementById(idCard);
      var val = document.getElementById(idValor);
      if (val) val.textContent = texto;
      if (card) {
        card.classList.remove('card-ok', 'card-err');
        if (mal !== null) card.classList.add(mal ? 'card-err' : 'card-ok');
      }
    };
    if (agg.n === 0) {
      marcar('scHorarioPromedioCard', 'scHorarioPromedio', '-', null);
      marcar('scFueraHorarioCard', 'scFueraHorario', '-', null);
      marcar('scOpsTardeCard', 'scOpsTarde', '-', null);
    } else {
      marcar('scHorarioPromedioCard', 'scHorarioPromedio', minutosAHora(agg.prom), esTardeHorario(agg.prom));
      marcar('scFueraHorarioCard', 'scFueraHorario',
        agg.fuera + ' de ' + agg.n + ' (' + Math.round(agg.fuera * 100 / agg.n) + '%)', agg.fuera > 0);
      marcar('scOpsTardeCard', 'scOpsTarde', agg.opsTarde + ' de ' + agg.filas.length, agg.opsTarde > 0);
    }

    // --- Tabla ---
    var tbody = document.getElementById('tbodyHorarios');
    var vacio = document.getElementById('horariosVacio');
    vaciar(tbody);
    if (vacio) vacio.style.display = agg.filas.length === 0 ? 'block' : 'none';

    agg.filas.forEach(function(o) {
      var tr = crear('tr');
      var tdCli = crear('td', null, o.cli.nombre);
      tdCli.style.fontWeight = '600';
      tr.appendChild(tdCli);

      var tdPod = crear('td');
      tdPod.style.textAlign = 'center';
      if (o.cli.pod) {
        var pild = crear('span', 'pildora', o.cli.pod);
        pild.style.fontSize = '11px';
        tdPod.appendChild(pild);
      } else {
        tdPod.textContent = '-';
      }
      tr.appendChild(tdPod);

      var tdTech = crear('td', null, o.tech);
      tdTech.style.textAlign = 'center';
      tr.appendChild(tdTech);

      var tdProm = crear('td', 'celda-tech');
      var pill = crear('span', 'tech-pill ' + (o.tarde ? 'status-err' : 'status-ok'), minutosAHora(o.prom));
      pill.title = 'Promedio de ' + o.n + (o.n === 1 ? ' envío' : ' envíos') + (o.tarde ? ': después de las 11:00' : ': en horario');
      tdProm.appendChild(pill);
      tr.appendChild(tdProm);

      var tdFuera = crear('td', null, o.fuera + ' de ' + o.n);
      tdFuera.style.textAlign = 'center';
      if (o.fuera > 0) {
        tdFuera.style.color = 'var(--rojo)';
        tdFuera.style.fontWeight = '600';
      }
      tr.appendChild(tdFuera);

      tbody.appendChild(tr);
    });

    // El PDF es por cliente: sin uno elegido, el botón no tiene qué armar. Si un botón está
    // en medio de un envío (tiene el spinner), no se toca: lo libera su propio callback.
    var libre = function(boton) { return boton && !(boton.querySelector && boton.querySelector('.hilando')); };
    var btnPdf = document.getElementById('btnPdfHorarios');
    if (libre(btnPdf)) {
      btnPdf.disabled = !f.cliente;
      btnPdf.title = f.cliente ? 'PDF de ' + f.cliente + ' — ' + f.periodoTxt : 'Elegí un cliente para armar su PDF';
    }
    var btnSlack = document.getElementById('btnSlackHorarios');
    if (libre(btnSlack)) btnSlack.disabled = agg.n === 0;

    var enviosHistorial = f.cliente
      ? filtrarEnviosHorarios({ dias: f.dias, cliente: f.cliente, tech: f.tech, pod: f.pod, operador: f.operador, incluirExcluidos: true }).envios
      : [];
    pintarHistorialCliente(f, enviosHistorial);
    pintarOperadores(envios, f.dias);

    var serie = serieHorarios(envios, f.dias);
    var titulo = document.getElementById('tituloChartHorarios');
    if (titulo) titulo.textContent = 'Evolución de la hora promedio de envío — ' + (serie.porSemana ? 'por semana' : 'por día');
    dibujarChartHorarios(document.getElementById('chart_horarios_div'), serie, null);
  }

  /**
   * Dibuja la serie en un div. Si se pasa alListo, se lo llama con el gráfico ya dibujado
   * (el PDF lo usa para sacarle la imagen con getImageURI()).
   */
  function dibujarChartHorarios(chartDiv, serie, alListo) {
    if (!chartDiv) return;
    if (typeof google === 'undefined' || !google.visualization || !google.visualization.LineChart) {
      // La librería de gráficos todavía no terminó de cargar: se redibuja cuando esté.
      google.charts.setOnLoadCallback(function() { dibujarChartHorarios(chartDiv, serie, alListo); });
      return;
    }
    if (serie.puntos.length === 0) {
      vaciar(chartDiv);
      if (alListo) alListo(null);
      return;
    }

    var aHoraDelDia = function(min) {
      var t = Math.round(min);
      return [Math.floor(t / 60), t % 60, 0];
    };
    var dt = new google.visualization.DataTable();
    dt.addColumn('string', serie.porSemana ? 'Semana del' : 'Día');
    serie.techs.forEach(function(t) { dt.addColumn('timeofday', t); });
    dt.addColumn('timeofday', 'Límite 11:00');
    serie.puntos.forEach(function(p) {
      // Un día sin envío de una tecnología queda vacío (null), no en cero: un cero sería
      // "salió a las 00:00" y arrastraría la línea hasta abajo.
      var fila = [p.etiqueta];
      serie.techs.forEach(function(t) { fila.push(p.prom[t] !== undefined ? aHoraDelDia(p.prom[t]) : null); });
      fila.push(aHoraDelDia(horariosGlobal.limiteMinutos));
      dt.addRow(fila);
    });

    var colores = serie.techs.map(function(t) { return COLORES_TECH[t] || '#8A9891'; }).concat(['#C0392B']);
    var series = {};
    series[serie.techs.length] = { lineDashStyle: [6, 4], pointSize: 0, enableInteractivity: false };

    var chart = new google.visualization.LineChart(chartDiv);
    if (alListo) {
      google.visualization.events.addListener(chart, 'ready', function() { alListo(chart); });
    }
    chart.draw(dt, {
      colors: colores,
      series: series,
      interpolateNulls: true,
      pointSize: 5,
      legend: { position: 'top' },
      chartArea: { width: '85%', height: '70%' },
      vAxis: { format: 'HH:mm' }
    });

  // --- PDF por cliente ---
  // El gráfico se dibuja fuera de pantalla solo con el cliente (todas sus tecnologías, sin
  // importar el filtro de tecnología/POD), se le saca la imagen y el servidor arma el PDF.
  // El servidor no recalcula nada: recibe los números ya calculados por agregarHorarios().
  function generarPdfHorarios() {
    var f = leerFiltrosHorarios();
    var aviso = document.getElementById('avisoHorarios');
    if (!horariosGlobal || !f.cliente) return;

    var btn = document.getElementById('btnPdfHorarios');
    ocupar(btn, 'Armando PDF...');
    aviso.hidden = true;

    var soloCliente = { dias: f.dias, periodoTxt: f.periodoTxt, cliente: f.cliente, tech: '', pod: '' };
    var rango = filtrarEnviosHorarios(soloCliente);
    var agg = agregarHorarios(rango.envios);
    var serie = serieHorarios(rango.envios, f.dias);

    var lienzo = crear('div');
    lienzo.style.cssText = 'position:absolute; left:-10000px; top:0; width:900px; height:320px;';
    document.body.appendChild(lienzo);

    dibujarChartHorarios(lienzo, serie, function(chart) {
      var imagen = chart ? chart.getImageURI() : null;
      if (lienzo.parentNode) lienzo.parentNode.removeChild(lienzo);

      var datosPdf = {
        cliente: f.cliente,
        pod: agg.filas.length ? agg.filas[0].cli.pod : '',
        periodo: f.periodoTxt,
        desde: isoACorta(rango.desdeIso),
        hasta: isoACorta(rango.hastaIso),
        promedio: agg.prom === null ? null : minutosAHora(agg.prom),
        promedioTarde: agg.prom !== null && esTardeHorario(agg.prom),
        envios: agg.n,
        fuera: agg.fuera,
        imagen: imagen,
        novedades: novedadesDe(claveDeCliente(f.cliente), rango.desdeIso, rango.hastaIso, ''),
        tecnologias: agg.filas.map(function(o) {
          return { tech: o.tech, promedio: minutosAHora(o.prom), tarde: o.tarde, n: o.n, fuera: o.fuera };
        })
      };

      google.script.run
        .withSuccessHandler(function(res) {
          liberar(btn);
          descargarBase64(res.base64, res.nombre, 'application/pdf', aviso);
        })
        .withFailureHandler(function(err) {
          liberar(btn);
          mostrarAviso(aviso, 'error', 'No se pudo generar el PDF: ' + mensajeDeError(err));
        })
        .webapp_generarPdfHorarios(datosPdf);
    });
  }

  function descargarBase64(base64, nombre, tipo, aviso) {
    var bin = atob(base64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: tipo }));
    var a = crear('a');
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // Por si el navegador bloquea la descarga dentro del iframe de Apps Script, queda el
    // botón para abrirlo en otra pestaña.
    mostrarAviso(aviso, 'ok', 'PDF generado: ' + nombre, [
      { texto: 'Abrir PDF', alHacerClic: function() { window.open(url, '_blank'); } }
    ]);
  }

  // --- Resumen por POD a Slack ---
  // Manda exactamente lo que se ve en pantalla (período y filtros actuales), agrupado por
  // POD. Pide confirmación antes: es un mensaje a un canal, no se puede deshacer.
  function prepararSlackHorarios() {
    var f = leerFiltrosHorarios();
    var aviso = document.getElementById('avisoHorarios');
    if (!horariosGlobal) return;
    var rango = filtrarEnviosHorarios(f);
    var agg = agregarHorarios(rango.envios);
    if (agg.n === 0) return;

    var porPod = {};
    agg.filas.forEach(function(o) {
      var pod = o.cli.pod || 'Sin POD';
      if (!porPod[pod]) porPod[pod] = {};
      if (!porPod[pod][o.cli.nombre]) porPod[pod][o.cli.nombre] = [];
      porPod[pod][o.cli.nombre].push({ tech: o.tech, promedio: minutosAHora(o.prom), tarde: o.tarde, n: o.n, fuera: o.fuera });
    });
    var pods = Object.keys(porPod).sort().map(function(pod) {
      return {
        pod: pod,
        clientes: Object.keys(porPod[pod]).sort(function(a, b) { return a.localeCompare(b); }).map(function(nombre) {
          return { cliente: nombre, tecnologias: porPod[pod][nombre],
            novedades: novedadesDe(claveDeCliente(nombre), rango.desdeIso, rango.hastaIso, f.tech) };
        })
      };
    });

    var filtros = [];
    if (f.cliente) filtros.push('cliente ' + f.cliente);
    if (f.tech) filtros.push(f.tech);
    if (f.pod) filtros.push(f.pod);

    var datosSlack = {
      periodo: f.periodoTxt,
      desde: isoACorta(rango.desdeIso),
      hasta: isoACorta(rango.hastaIso),
      filtros: filtros.join(', '),
      promedio: minutosAHora(agg.prom),
      promedioTarde: esTardeHorario(agg.prom),
      envios: agg.n,
      fuera: agg.fuera,
      pods: pods
    };

    var btn = document.getElementById('btnSlackHorarios');
    mostrarAviso(aviso, 'atencion',
      '¿Mandar a Slack el resumen por POD de ' + pods.length + (pods.length === 1 ? ' POD' : ' PODs') +
      ' (' + f.periodoTxt + (datosSlack.filtros ? ', ' + datosSlack.filtros : '') + ')?', [
      { texto: 'Enviar', clase: 'btn-primario', alHacerClic: function() {
        aviso.hidden = true;
        ocupar(btn, 'Enviando...');
        google.script.run
          .withSuccessHandler(function() {
            liberar(btn);
            mostrarAviso(aviso, 'ok', 'Resumen enviado a Slack.');
          })
          .withFailureHandler(function(err) {
            liberar(btn);
            mostrarAviso(aviso, 'error', 'No se pudo enviar a Slack: ' + mensajeDeError(err));
          })
          .webapp_enviarResumenHorariosSlack(datosSlack);
      } },
      { texto: 'Cancelar', alHacerClic: function() { aviso.hidden = true; } }
    ]);
  }

  function cambiarSeccionPrincipal(e) {
    var targetId = e.currentTarget.getAttribute('data-seccion');
    
    // Ocultar todas las secciones
    var vistas = document.querySelectorAll('.vista-seccion');
    for (var i = 0; i < vistas.length; i++) {
      vistas[i].classList.remove('active');
    }
    
    // Desmarcar todos los botones
    var navBtns = document.querySelectorAll('.nav-btn');
    for (var j = 0; j < navBtns.length; j++) {
      navBtns[j].classList.remove('active');
      navBtns[j].setAttribute('aria-selected', 'false');
    }
    
    // Mostrar la sección objetivo y marcar el botón
    var targetEl = document.getElementById(targetId);
    if (targetEl) targetEl.classList.add('active');
    e.currentTarget.classList.add('active');
    e.currentTarget.setAttribute('aria-selected', 'true');

    // Carga perezosa automática al ingresar por primera vez
    if (targetId === 'seccion-operaciones' && !matrizGlobal) {
      cargarMatrizSalud();
    } else if (targetId === 'seccion-logs' && !logsGlobales) {
      cargarLogs();

    }
  }
