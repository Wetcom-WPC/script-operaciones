<style>
/*
  Panel de Operaciones — Hoja de Estilos Enterprise.
  Basado en la identidad de marca WETCOM (#109E58), principios de frontend-design y UI/UX Pro Max.
  Alta densidad informativa, micro-interacciones sutiles, números tabulares y contraste WCAG 2.1 garantizado.
*/
:root {
  /* Marca Wetcom */
  --verde:           #109E58;
  --verde-hover:     #0D8248;
  --verde-active:    #0A6A3B;
  --verde-claro:     #E8F8EE;
  --verde-borde:     #A3E7BD;
  --verde-osc:       #0E7440;

  /* Neutros y Superficies */
  --tinta:           #111915;
  --tinta-secundaria:#374151;
  --gris:            #4B5563;
  --gris-claro:      #6B7280;
  --gris-muy-claro:  #9CA3AF;
  --borde:           #E2E8E5;
  --borde-suave:     #EDF2E8;
  --fondo:           #F6F8F7;
  --blanco:          #FFFFFF;

  /* Semántica de Estados (WCAG AA Contrast >= 4.5:1) */
  --rojo:            #DC2626;
  --rojo-osc:        #991B1B;
  --rojo-suave:      #FEE2E2;
  --rojo-borde:      #FCA5A5;

  --ambar:           #D97706;
  --ambar-osc:       #92400E;
  --ambar-suave:     #FEF3C7;
  --ambar-borde:     #FDE68A;

  --azul:            #2563EB;
  --azul-osc:        #1D4ED8;
  --azul-suave:      #EFF6FF;
  --azul-borde:      #BFDBFE;

  /* Geometría y Sombras */
  --radio-sm:        6px;
  --radio:           10px;
  --radio-lg:        14px;
  --radio-pill:      9999px;

  --sombra-sm:       0 1px 2px rgba(18, 33, 26, 0.05);
  --sombra:          0 1px 3px rgba(18, 33, 26, 0.05), 0 4px 12px rgba(18, 33, 26, 0.03);
  --sombra-md:       0 4px 8px -1px rgba(18, 33, 26, 0.07), 0 2px 4px -2px rgba(18, 33, 26, 0.04);
  --sombra-hover:    0 6px 18px rgba(18, 33, 26, 0.08), 0 2px 6px rgba(18, 33, 26, 0.04);

  /* Transiciones explícitas */
  --trans-fast:      150ms cubic-bezier(0.16, 1, 0.3, 1);
  --trans-normal:    200ms cubic-bezier(0.16, 1, 0.3, 1);
}

/* Reset y Pila de Tipografía */
*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* Accesibilidad: foco visible global sin contornos rotos */
:focus-visible {
  outline: 2px solid var(--verde);
  outline-offset: 2px;
}

/* --- Barra Superior / Header --- */
.barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 28px;
  background: var(--blanco);
  border-bottom: 1px solid var(--borde);
  box-shadow: var(--sombra-sm);
  position: sticky;
  top: 0;
  z-index: 100;
}

.marca {
  display: flex;
  align-items: center;
  gap: 12px;
}

.marca .logo {
  width: 36px;
  height: 36px;
  display: block;
  flex-shrink: 0;
}

.marca h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--tinta);
  line-height: 1.2;
}

.marca p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--gris);
  line-height: 1.2;
}

.sesion {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--gris);
}

.sesion #usuario {
  font-weight: 500;
  color: var(--tinta);
}

.sesion .casilla {
  background: var(--verde-claro);
  color: var(--verde-osc);
  border: 1px solid var(--verde-borde);
  border-radius: var(--radio-pill);
  padding: 3px 12px;
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: 0.01em;
}

/* Layout Principal */
main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 28px 40px;
  display: grid;
  gap: 24px;
}

/* --- Navegación Principal (Tabs del Panel) --- */
.nav-principal {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--borde);
  padding-bottom: 2px;
  margin-bottom: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav-principal::-webkit-scrollbar { display: none; }

.nav-btn {
  padding: 10px 18px;
  background: transparent;
  border: none;
  border-radius: var(--radio-sm) var(--radio-sm) 0 0;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  color: var(--gris);
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  transition: color var(--trans-fast), background-color var(--trans-fast);
}

.nav-btn:hover {
  color: var(--tinta);
  background: rgba(16, 158, 88, 0.05);
}

.nav-btn.active {
  color: var(--verde);
  font-weight: 600;
}

.nav-btn.active::after {
  content: "";
  position: absolute;
  bottom: -2px;
  left: 0;
  right: 0;
  height: 2.5px;
  background: var(--verde);
  border-radius: 2px 2px 0 0;
}

/* --- Vistas / Secciones --- */
.vista-seccion {
  display: none;
}
.vista-seccion.active {
  display: block;
}

/* --- Tarjetas Contenedoras --- */
.tarjeta {
  background: var(--blanco);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 22px 24px;
  position: relative;
  transition: box-shadow var(--trans-fast);
}

.tarjeta + .tarjeta {
  margin-top: 20px;
}

.tarjeta > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.tarjeta h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--tinta);
  letter-spacing: -0.01em;
}

.tarjeta .ayuda {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--gris);
  max-width: 68ch;
  line-height: 1.45;
}

/* --- Botones --- */
button {
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: var(--radio-sm);
  border: 1px solid transparent;
  padding: 8px 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  white-space: nowrap;
  transition: background-color var(--trans-fast), border-color var(--trans-fast), box-shadow var(--trans-fast), transform var(--trans-fast);
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-primario {
  background: var(--verde);
  color: #ffffff;
  box-shadow: 0 1px 2px rgba(16, 158, 88, 0.2);
}

.btn-primario:not(:disabled):hover {
  background: var(--verde-hover);
  box-shadow: 0 2px 5px rgba(16, 158, 88, 0.25);
}

.btn-primario:not(:disabled):active {
  background: var(--verde-active);
}

.btn-secundario {
  background: var(--blanco);
  color: var(--tinta);
  border-color: var(--borde);
  box-shadow: var(--sombra-sm);
}

.btn-secundario:not(:disabled):hover {
  background: #FAFCFA;
  border-color: var(--gris-muy-claro);
  color: var(--tinta);
}

/* Rueda de espera animada */
.hilando {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: girar 0.65s linear infinite;
}

@keyframes girar {
  to { transform: rotate(360deg); }
}

/* --- Avisos y Notificaciones --- */
.aviso {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radio-sm);
  font-size: 13.5px;
  border: 1px solid transparent;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.aviso[hidden] {
  display: none !important;
}

.aviso.ok {
  background: var(--verde-claro);
  border-color: var(--verde-borde);
  color: var(--verde-osc);
}

.aviso.error {
  background: var(--rojo-suave);
  border-color: var(--rojo-borde);
  color: var(--rojo-osc);
}

.aviso.atencion {
  background: var(--ambar-suave);
  border-color: var(--ambar-borde);
  color: var(--ambar-osc);
}

.aviso .acciones {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}

.aviso .acciones button {
  padding: 6px 12px;
  font-size: 12.5px;
}

/* --- Cinta de Contexto / Píldoras --- */
.contexto {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.pildora {
  font-size: 12px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: var(--radio-pill);
  background: var(--fondo);
  color: var(--gris);
  border: 1px solid var(--borde);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pildora.alerta {
  background: var(--ambar-suave);
  color: var(--ambar-osc);
  border-color: var(--ambar-borde);
  font-weight: 600;
}

.pildora.testing {
  background: var(--azul-suave);
  color: var(--azul-osc);
  border-color: var(--azul-borde);
  font-weight: 600;
}

/* --- Tarjetas KPI de Salud del Sistema --- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.kpi-card {
  background: #FAFBFB;
  border: 1px solid var(--borde);
  border-radius: var(--radio-sm);
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  position: relative;
  overflow: hidden;
  transition: border-color var(--trans-fast), background-color var(--trans-fast), box-shadow var(--trans-fast);
}

.kpi-card:hover {
  background: var(--blanco);
  box-shadow: var(--sombra-sm);
  border-color: var(--gris-muy-claro);
}

.kpi-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.kpi-label {
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--gris);
}

.kpi-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.kpi-value {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--tinta);
  margin-top: 2px;
}

.kpi-card.kpi-procesados .kpi-indicator { background: var(--verde); }
.kpi-card.kpi-procesados .kpi-value { color: var(--tinta); }

.kpi-card.kpi-errores .kpi-indicator { background: var(--rojo); }
.kpi-card.kpi-errores .kpi-value { color: var(--rojo); }

.kpi-card.kpi-faltantes .kpi-indicator { background: var(--ambar); }
.kpi-card.kpi-faltantes .kpi-value { color: var(--ambar-osc); }

/* --- Barra de Filtros y Búsqueda Unificada --- */
.filter-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 16px;
  margin-bottom: 16px;
  background: #FAFBFB;
  border: 1px solid var(--borde);
  border-radius: var(--radio-sm);
  padding: 10px 14px;
}

.input-control,
.select-control {
  font-family: inherit;
  font-size: 13.5px;
  color: var(--tinta);
  background: var(--blanco);
  border: 1px solid var(--borde);
  border-radius: var(--radio-sm);
  padding: 8px 12px;
  height: 38px;
  line-height: 1.4;
  outline: none;
  transition: border-color var(--trans-fast), box-shadow var(--trans-fast);
}

.select-control {
  cursor: pointer;
  padding-right: 28px;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234B5563' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
  background-repeat: no-repeat;
  background-position: right 8px center;
  background-size: 14px;
  appearance: none;
  -webkit-appearance: none;
}

.input-control:focus,
.select-control:focus {
  border-color: var(--verde);
  box-shadow: 0 0 0 3px rgba(16, 158, 88, 0.12);
}

.input-control::placeholder {
  color: var(--gris-muy-claro);
}

.search-input {
  flex-grow: 1;
  min-width: 220px;
}

/* --- Bandeja de Correos (Columnas Kanban) --- */
.columnas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin-top: 18px;
  align-items: start;
}

.columna {
  background: #F8FAF9;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--sombra-sm);
}

.columna > header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--borde);
  background: var(--blanco);
}

.columna .titulo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.columna h3 {
  margin: 0;
  font-size: 13.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--tinta);
}

.columna h3::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gris-claro);
  flex-shrink: 0;
}

.columna .cuenta {
  font-size: 11.5px;
  font-weight: 700;
  min-width: 24px;
  text-align: center;
  padding: 2px 8px;
  border-radius: var(--radio-pill);
  background: var(--fondo);
  color: var(--gris);
  font-variant-numeric: tabular-nums;
}

.columna .sub {
  margin: 4px 0 0;
  font-size: 11.5px;
  color: var(--gris);
  line-height: 1.35;
}

.columna[data-id="SIN_LEER"]  h3::before { background: var(--azul); }
.columna[data-id="SIN_LEER"]  .cuenta { background: var(--azul-suave); color: var(--azul-osc); border: 1px solid var(--azul-borde); }
.columna[data-id="ERROR"]     h3::before { background: var(--rojo); }
.columna[data-id="ERROR"]     .cuenta { background: var(--rojo-suave); color: var(--rojo-osc); border: 1px solid var(--rojo-borde); }
.columna[data-id="PENDIENTE"] h3::before { background: var(--ambar); }
.columna[data-id="PENDIENTE"] .cuenta { background: var(--ambar-suave); color: var(--ambar-osc); border: 1px solid var(--ambar-borde); }
.columna[data-id="PROCESADO"] h3::before { background: var(--verde); }
.columna[data-id="PROCESADO"] .cuenta { background: var(--verde-claro); color: var(--verde-osc); border: 1px solid var(--verde-borde); }

.lista {
  list-style: none;
  margin: 0;
  padding: 10px;
  display: grid;
  gap: 8px;
  max-height: 60vh;
  overflow-y: auto;
}

.correo {
  background: var(--blanco);
  border: 1px solid var(--borde);
  border-radius: var(--radio-sm);
  padding: 12px;
  box-shadow: 0 1px 2px rgba(18, 33, 26, 0.03);
  transition: border-color var(--trans-fast), box-shadow var(--trans-fast);
}

.correo:hover {
  border-color: var(--gris-muy-claro);
  box-shadow: var(--sombra-sm);
}

.correo .asunto {
  font-weight: 600;
  font-size: 13px;
  margin: 0 0 6px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--tinta);
  line-height: 1.35;
}

.correo .meta {
  font-size: 12px;
  color: var(--gris);
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  align-items: center;
}

.correo .meta .hora {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--tinta);
}

.correo .adjuntos {
  margin: 6px 0 0;
  font-size: 11.5px;
  color: var(--gris-claro);
  word-break: break-word;
}

.correo .marcas {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 8px;
}

.correo .marca-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--fondo);
  color: var(--gris);
  border: 1px solid var(--borde);
}

.correo .marca-chip.reintentos {
  background: var(--ambar-suave);
  color: var(--ambar-osc);
  border-color: var(--ambar-borde);
}

.vacio {
  padding: 24px 14px;
  text-align: center;
  font-size: 13px;
  color: var(--gris-claro);
}

/* --- Pestañas Secundarias (Subtabs de Logs) --- */
.tabs-container {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--borde);
  margin-top: 14px;
  margin-bottom: 16px;
  overflow-x: auto;
}

.tab-btn {
  background: none;
  border: none;
  padding: 8px 14px;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--gris);
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -1px;
  transition: color var(--trans-fast), border-color var(--trans-fast);
  white-space: nowrap;
}

.tab-btn:hover {
  color: var(--tinta);
}

.tab-btn.active {
  color: var(--verde);
  font-weight: 600;
  border-bottom-color: var(--verde);
}

/* --- Tablas de Datos Enterprise --- */
.table-container {
  border: 1px solid var(--borde);
  border-radius: var(--radio-sm);
  overflow: hidden;
  background: var(--blanco);
  box-shadow: var(--sombra-sm);
  margin-top: 16px;
}

.table-responsive {
  overflow-x: auto;
  max-width: 100%;
}

.tabla-logs {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}

.tabla-logs th {
  padding: 10px 14px;
  background: #FAFBFB;
  border-bottom: 1px solid var(--borde);
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--gris);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 2;
  backdrop-filter: blur(8px);
}

.tabla-logs td {
  padding: 10px 14px;
  border-bottom: 1px solid #F0F4F2;
  vertical-align: middle;
  color: var(--tinta);
}

.tabla-logs tbody tr.fila-log {
  transition: background-color var(--trans-fast);
}

.tabla-logs tbody tr.fila-log:hover {
  background-color: #F8FAF9;
}

.tabla-logs tbody tr.fila-detalle td {
  padding: 0;
  border-bottom: 1px solid var(--borde);
}

/* Celdas numéricas o timestamps */
.tabla-logs td:first-child {
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

/* Detalle expandible */
.detalle-contenido {
  padding: 16px 20px;
  background-color: #F8FAFA;
  border-top: 1px solid var(--borde);
  margin: 0;
  font-size: 13px;
}

.metadata-badges {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.badge-info {
  background: var(--blanco);
  border: 1px solid var(--borde);
  color: var(--gris);
  padding: 3px 10px;
  border-radius: var(--radio-sm);
  font-size: 12px;
  font-weight: 500;
}

.badge-info strong {
  color: var(--tinta);
  font-weight: 600;
  margin-right: 4px;
}

.error-formateado {
  background: var(--blanco);
  border: 1px solid var(--rojo-borde);
  border-left: 4px solid var(--rojo);
  padding: 12px 16px;
  border-radius: var(--radio-sm);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12.5px;
  color: var(--rojo-osc);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.error-bloque {
  line-height: 1.45;
  word-break: break-word;
}

.detalle-contenido pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  background-color: var(--blanco);
  border: 1px solid var(--borde);
  padding: 12px 14px;
  border-radius: var(--radio-sm);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px;
  margin-top: 8px;
  margin-bottom: 0;
