<style>
/*
  Panel de Operaciones — hoja de estilos.
  La paleta arranca del verde del isotipo de WETCOM y no usa más color del necesario: el color
  fuerte queda reservado para las dos cosas que importan de un vistazo, la acción principal y
  el estado de cada correo.
*/
:root {
  --verde:        #109E58;
  --verde-osc:    #0B7D44;
  --verde-claro:  #E7F6EE;

  --tinta:        #12211A;
  --gris:         #5B6B63;
  --gris-claro:   #8A9891;
  --borde:        #E3E9E6;
  --fondo:        #F4F7F5;
  --blanco:       #FFFFFF;

  --rojo:         #C0392B;
  --rojo-suave:   #FCEDEB;
  --ambar:        #A96A05;
  --ambar-suave:  #FFF5E3;
  --azul:         #2C6CB0;
  --azul-suave:   #EDF3FB;

  --radio:        12px;
  --sombra:       0 1px 2px rgba(18, 33, 26, .06), 0 6px 18px rgba(18, 33, 26, .05);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* --- Barra superior ---------------------------------------------------------------------- */
.barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px 24px;
  background: var(--blanco);
  border-bottom: 1px solid var(--borde);
}
.marca { display: flex; align-items: center; gap: 12px; }
.marca .logo { width: 36px; height: 36px; display: block; }
.marca h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.marca p { margin: 0; font-size: 12px; color: var(--gris-claro); }

.sesion { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--gris); }
.sesion .casilla {
  background: var(--verde-claro);
  color: var(--verde-osc);
  border-radius: 999px;
  padding: 4px 12px;
  font-weight: 600;
}

main { max-width: 1400px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }

/* --- Tarjetas ---------------------------------------------------------------------------- */
.tarjeta {
  background: var(--blanco);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 20px 22px;
}
.tarjeta > header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 4px;
}
.tarjeta h2 { margin: 0; font-size: 15px; font-weight: 650; }
.tarjeta .ayuda { margin: 2px 0 0; font-size: 12.5px; color: var(--gris); max-width: 62ch; }

/* --- Botones ----------------------------------------------------------------------------- */
button {
  font: inherit;
  border-radius: 9px;
  border: 1px solid transparent;
  padding: 10px 18px;
  cursor: pointer;
  font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px;
  transition: background .12s ease, border-color .12s ease, opacity .12s ease;
}
button:disabled { opacity: .55; cursor: not-allowed; }

.btn-primario { background: var(--verde); color: #fff; }
.btn-primario:not(:disabled):hover { background: var(--verde-osc); }

.btn-secundario { background: var(--blanco); color: var(--tinta); border-color: var(--borde); }
.btn-secundario:not(:disabled):hover { border-color: var(--gris-claro); background: #FAFCFB; }

/* Rueda de espera dentro del botón: reemplaza al texto "cargando..." sin mover el layout. */
.hilando {
  width: 14px; height: 14px; flex: none;
  border: 2px solid currentColor; border-right-color: transparent;
  border-radius: 50%;
  animation: girar .7s linear infinite;
}
@keyframes girar { to { transform: rotate(360deg); } }

/* --- Avisos ------------------------------------------------------------------------------ */
.aviso {
  margin-top: 14px; padding: 11px 14px; border-radius: 9px;
  font-size: 13px; border: 1px solid transparent;
}
.aviso[hidden] { display: none; }
.aviso.ok    { background: var(--verde-claro); border-color: #BFE5D0; color: var(--verde-osc); }
.aviso.error { background: var(--rojo-suave);  border-color: #F3CFC9; color: var(--rojo); }
.aviso.atencion { background: var(--ambar-suave); border-color: #F2DCB4; color: var(--ambar); }
.aviso .acciones { margin-top: 10px; display: flex; gap: 8px; }
.aviso .acciones button { padding: 6px 14px; font-size: 12.5px; }

/* Cinta de contexto (entorno de pruebas, fuera de ventana, feriado). */
.contexto { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pildora {
  font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
  background: var(--fondo); color: var(--gris); border: 1px solid var(--borde);
}
.pildora.alerta { background: var(--ambar-suave); color: var(--ambar); border-color: #F2DCB4; }
.pildora.testing { background: var(--azul-suave); color: var(--azul); border-color: #CFE0F3; }

/* --- Columnas de la bandeja -------------------------------------------------------------- */
.columnas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 16px;
  margin-top: 18px;
}
.columna { background: var(--fondo); border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; }
.columna > header { padding: 12px 14px; border-bottom: 1px solid var(--borde); background: var(--blanco); }
.columna .titulo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.columna h3 { margin: 0; font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
.columna h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gris-claro); }
.columna .cuenta {
  font-size: 12px; font-weight: 700; min-width: 26px; text-align: center;
  padding: 2px 8px; border-radius: 999px; background: var(--fondo); color: var(--gris);
}
.columna .sub { margin: 6px 0 0; font-size: 11.5px; color: var(--gris-claro); }

.columna[data-id="SIN_LEER"]  h3::before { background: var(--azul); }
.columna[data-id="SIN_LEER"]  .cuenta { background: var(--azul-suave); color: var(--azul); }
.columna[data-id="ERROR"]     h3::before { background: var(--rojo); }
.columna[data-id="ERROR"]     .cuenta { background: var(--rojo-suave); color: var(--rojo); }
.columna[data-id="PENDIENTE"] h3::before { background: var(--ambar); }
.columna[data-id="PENDIENTE"] .cuenta { background: var(--ambar-suave); color: var(--ambar); }
.columna[data-id="PROCESADO"] h3::before { background: var(--verde); }
.columna[data-id="PROCESADO"] .cuenta { background: var(--verde-claro); color: var(--verde-osc); }

.lista { list-style: none; margin: 0; padding: 8px; display: grid; gap: 8px; max-height: 60vh; overflow-y: auto; }
.correo {
  background: var(--blanco); border: 1px solid var(--borde); border-radius: 9px;
  padding: 10px 12px;
}
.correo .asunto {
  font-weight: 600; font-size: 12.5px; margin: 0 0 4px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.correo .meta { font-size: 11.5px; color: var(--gris); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.correo .meta .hora { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--tinta); }
.correo .adjuntos { margin: 6px 0 0; font-size: 11px; color: var(--gris-claro); word-break: break-word; }
.correo .marcas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.correo .marca-chip {
  font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
  background: var(--fondo); color: var(--gris); border: 1px solid var(--borde);
}
.correo .marca-chip.reintentos { background: var(--ambar-suave); color: var(--ambar); border-color: #F2DCB4; }

.vacio { padding: 22px 14px; text-align: center; font-size: 12.5px; color: var(--gris-claro); }

/* --- Pie --------------------------------------------------------------------------------- */
footer { padding: 0 24px 28px; max-width: 1400px; margin: 0 auto; font-size: 11.5px; color: var(--gris-claro); }

/* --- Pantalla de acceso denegado --------------------------------------------------------- */
.centro {
  min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
}
.centro .logo { width: 56px; height: 56px; margin: 0 auto 18px; display: block; }
.centro h1 { font-size: 18px; margin: 0 0 8px; }
.centro p { color: var(--gris); margin: 0; max-width: 46ch; }

@media (max-width: 640px) {
  .barra { padding: 12px 16px; }
  main, footer { padding-left: 16px; padding-right: 16px; }
  .tarjeta { padding: 16px; }
}
</style>
